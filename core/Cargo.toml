[package]
name = "yw-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "yw-core"
path = "src/main.rs"

[dependencies]
axum = "0.7.9"
tokio = { version = "1.42.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace", "fs"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sqlx = { version = "0.8.3", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1.11.1", features = ["v4", "serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
rand = "0.8.5"
argon2 = "0.5.3"
sha2 = "0.10.8"
hex = "0.4.3"
futures = "0.3.31"
tokio-stream = { version = "0.1.17", features = ["sync"] }
anyhow = "1.0.95"
chacha20poly1305 = "0.10.1"
# firma webhook Twilio (HMAC-SHA1 + base64) — #4 escalation FASE 2 ack inbound
hmac = "0.12.1"
sha1 = "0.10.6"
base64 = "0.22.1"

# debuginfo ridotto: evita lo STATUS_STACK_BUFFER_OVERRUN di rustc in codegen su Windows
# (crate binaria grande + debuginfo=2) e velocizza il build. Line-tables bastano per i panic.
[profile.dev]
debug = 1
