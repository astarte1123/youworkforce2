# YouWorkforce — local reproducible pilot profile (Docker Compose).
# Base profile = Workforce + Sicurezza (SOS chain) with GoAlert SIMULATO.
# Optional connectors (goalert real, thingsboard) behind compose profiles, OFF by default.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: youworkforce
    ports: ["5432:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d youworkforce"]
      interval: 3s
      timeout: 3s
      retries: 20

  core:
    build: ./core
    environment:
      YW_DB_OWNER: postgres://postgres:postgres@db:5432/youworkforce
      YW_DB_RT: postgres://app_rt:app_rt_pw@db:5432/youworkforce
      YW_BIND: 0.0.0.0:8080
      TEST_CLOCK: "1"               # enables /api/_test/advance (pilot: set 0)
      # GOALERT_BASE: http://goalert:8081   # set to switch GoAlert to UPSTREAM REALE
      RUST_LOG: info,sqlx=warn
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]

  console:
    build: ./console
    environment:
      YW_CORE_URL: http://core:8080
      YW_CONSOLE_BIND: 0.0.0.0:8081
    depends_on: [core]
    ports: ["8081:8081"]

  # ---- Optional: real GoAlert (profile "goalert") ----
  goalert-db:
    image: postgres:18
    profiles: ["goalert"]
    environment:
      POSTGRES_USER: goalert
      POSTGRES_PASSWORD: goalert
      POSTGRES_DB: goalert
    volumes: ["goalert_db:/var/lib/postgresql/data"]
  goalert:
    image: goalert/goalert:v0.35.0   # verified in this repo (UPSTREAM REALE)
    profiles: ["goalert"]
    # migrate + seed users once: see qa/run-goalert.sh. Then qa/goalert-setup.sh prints the
    # integration KEY; set it per-tenant via superadmin API. Core: GOALERT_BASE=http://goalert:8081
    command: ["goalert", "--db-url", "postgres://goalert:goalert@goalert-db:5432/goalert?sslmode=disable",
              "--listen", "0.0.0.0:8081", "--public-url", "http://localhost:8082", "--disable-https-redirect"]
    depends_on: [goalert-db]
    ports: ["8082:8081"]

  # ---- Optional: real Traccar badge source (profile "traccar") ----
  # device (OsmAnd) -> Traccar -> event forwarding -> core /api/ingress/traccar.
  # See qa/run-traccar.sh (registers device BADGE-001) and qa/traccar-e2e.sh (8/8).
  traccar:
    image: traccar/traccar:6.17.0   # verified in this repo (UPSTREAM REALE)
    profiles: ["traccar"]
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      EVENT_FORWARD_URL: "http://core:8080/api/ingress/traccar?token=acme-ingest-token"
    ports:
      - "8083:8082"     # Traccar web UI / API
      - "5055:5055"     # OsmAnd protocol (device feed)
      - "5055:5055/udp"
    depends_on: [core]

  # ---- Optional: real ThingsBoard IoT (profile "thingsboard") ----
  # device telemetry -> ThingsBoard Rule Engine (REST API Call node) -> core
  # /api/ingress/thingsboard. The rule-chain node + default-profile device are
  # provisioned by qa/run-thingsboard.sh (requires python). e2e: qa/thingsboard-e2e.sh (8/8).
  # NOTE: ThingsBoard CE is BUSL-licensed — run as an external/standalone instance.
  thingsboard:
    image: thingsboard/tb-postgres:3.8.1   # verified in this repo (UPSTREAM REALE)
    profiles: ["thingsboard"]
    ports:
      - "8084:9090"     # web UI / REST / HTTP device API
      - "1883:1883"     # MQTT device transport
      - "7070:7070"     # edge/transport
    volumes: ["tb_data:/data"]

volumes:
  db_data:
  goalert_db:
  tb_data:
