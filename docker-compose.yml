# YouWorkforce — profilo locale riproducibile (Docker Compose).
# Self-contained: escalation, dispositivi GPS/badge e IoT sono motori nativi, nessun servizio esterno.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: youworkforce
    ports: ["5432:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d youworkforce"]
      interval: 3s
      timeout: 3s
      retries: 20

  core:
    build: ./core
    environment:
      YW_DB_OWNER: postgres://postgres:postgres@db:5432/youworkforce
      YW_DB_RT: postgres://app_rt:app_rt_pw@db:5432/youworkforce
      YW_BIND: 0.0.0.0:8080
      TEST_CLOCK: "0"               # 1 solo per i test e2e: abilita gli hook /api/_test/*
      YW_SEED_DEMO: "1"             # tenant demo acme/globex
      RUST_LOG: info,sqlx=warn
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "8080:8080"     # API e console
      - "5027:5027"     # Teltonika TCP (dispositivi GPS/badge)
      - "1883:1883"     # MQTT (sensori IoT)

  console:
    build: ./console
    environment:
      YW_CORE_URL: http://core:8080
      YW_CONSOLE_BIND: 0.0.0.0:8081
    depends_on: [core]
    ports: ["8081:8081"]

volumes:
  db_data:
