name: ci
on: [push, pull_request]

jobs:
  # Gate obbligatorio: tutte le suite e2e + unit test. YouWorkforce è self-contained:
  # servono solo core + Postgres (nessun motore esterno).
  core:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: youworkforce }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      YW_DB_OWNER: postgres://postgres:postgres@localhost:5432/youworkforce
      YW_DB_RT: postgres://app_rt:app_rt_pw@localhost:5432/youworkforce
      YW_SECRET_KEY: yw-ci-secret-key
      TEST_CLOCK: "1"
      YW_SEED_DEMO: "1"
      # motore di escalation YWAlert (nativo): sink webhook per la prova di recapito reale
      # (ywalert-delivery-e2e). Il receiver è avviato dallo script stesso su :18099.
      YW_ESC_SINK_URL: http://127.0.0.1:18099/
      YW_ESC_SINK_LOG: /tmp/yw_sink_shared.log
      YW_ESC_FROM: "+390000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: build core
        run: cargo build --release
        working-directory: core
      - name: unit test core
        run: cargo test --release
        working-directory: core
      - name: build console
        run: go build -o /tmp/console .
        working-directory: console
      - name: start escalation sink receiver (YWAlert delivery proof)
        run: |
          nohup python3 - "$YW_ESC_SINK_LOG" > /tmp/yw_recv.log 2>&1 <<'PY' &
          import http.server,sys
          f=open(sys.argv[1],"ab")
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  n=int(self.headers.get("content-length",0)); b=self.rfile.read(n)
                  f.write(b+b"\n"); f.flush()
                  self.send_response(200); self.end_headers(); self.wfile.write(b"ok")
              def log_message(self,*a): pass
          http.server.HTTPServer(("127.0.0.1",18099),H).serve_forever()
          PY
          for i in $(seq 1 10); do curl -sf -X POST http://127.0.0.1:18099/ -d ping && break; sleep 1; done
      - name: start core
        run: |
          ./core/target/release/yw-core &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
      - name: run core suites
        run: MODE=core bash qa/run-all.sh
