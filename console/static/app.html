function _trOne(s){ if(s==null) return s; const k=s.trim(); if(!k) return s;
  if(I18N_PH[k]!=null) return s.replace(k, I18N_PH[k]);
  const m=k.match(/^(.+?)\s*\((\d+)\)$/); // "Etichetta (12)" -> traduci la parte testuale
  if(m && I18N_PH[m[1]]!=null) return s.replace(m[1], I18N_PH[m[1]]);
  return s; }
function applyI18n(root){ if(LANG!=='en'||!root) return;
  try{
    const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode(n){
      const p=n.parentNode; if(!p) return NodeFilter.FILTER_REJECT;
      const tag=p.nodeName; if(tag==='SCRIPT'||tag==='STYLE'||tag==='TEXTAREA') return NodeFilter.FILTER_REJECT;
      return n.nodeValue && n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }});
    const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(n=>{ const v=_trOne(n.nodeValue); if(v!==n.nodeValue) n.nodeValue=v; });
    const el = root.nodeType===1 ? root : document;
    el.querySelectorAll && el.querySelectorAll('[placeholder]').forEach(e=>{ const v=_trOne(e.getAttribute('placeholder')); if(v!==e.getAttribute('placeholder')) e.setAttribute('placeholder',v); });
    el.querySelectorAll && el.querySelectorAll('[title]').forEach(e=>{ const v=_trOne(e.getAttribute('title')); if(v!==e.getAttribute('title')) e.setAttribute('title',v); });
  }catch(e){}
}
let _i18nStarted=false;
function startI18n(){ if(_i18nStarted||LANG!=='en') return; _i18nStarted=true;
  applyI18n(document.body);
  const obs=new MutationObserver(muts=>{ for(const m of muts){ m.addedNodes.forEach(nd=>{
    if(nd.nodeType===1) applyI18n(nd);
    else if(nd.nodeType===3){ const v=_trOne(nd.nodeValue); if(v!==nd.nodeValue) nd.nodeValue=v; }
  }); } });
  obs.observe(document.body,{childList:true,subtree:true});
}

async function loadCtx(){
  try{ const M=await api('/modules'); ACTIVE_MODS=new Set((M||[]).filter(m=>m.state==='attivo').map(m=>m.code)); }catch(e){}
  try{ const F=await api('/ui/features'); if(F&&typeof F==='object') UI_FEAT=F; }catch(e){}
  try{ const B=await api('/branding'); if(B&&typeof B==='object'){ BRANDING=B; applyBranding(B); } }catch(e){}
  try{ if(ACTIVE_MODS.has('assistant')){ const A=await api('/ai/features'); AI_FEAT=(A&&A.features)||{}; } }catch(e){ AI_FEAT={}; }

  try{ SCENARIOS = await api('/scenarios') || []; }catch(e){ SCENARIOS=[]; }
}

function applyBranding(b){
  const r=document.documentElement.style;
  const set=(k,v)=>{ v?r.setProperty(k,v):r.removeProperty(k); };
  set('--brand', b.brand_primary); set('--brand-ink', b.brand_ink);
  set('--brand-soft', b.brand_soft); set('--brand2', b.brand_accent);
}

// ---------------- SSE ----------------
function connectSSE(){
  try{SSE&&SSE.close()}catch(e){}
  SSE=new EventSource('/api/stream',{withCredentials:true});
  const w=()=>$('#liveWrap');
  SSE.onopen =()=>{ if(w())w().innerHTML='<span class="live on">live</span>'; };
  SSE.onerror=()=>{ if(w())w().innerHTML='<span class="live off">flusso interrotto</span>'; };
  SSE.onmessage=e=>{ let d={};try{d=JSON.parse(e.data)}catch(_){}
    if(d.type==='incident_opened'){ toast('Nuovo incidente: '+(d.etype||'')+' — '+(d.correlation||'').slice(0,8),'bad'); incidentAlert(d); }
    if(d.type==='device_position' && typeof mapLivePos==='function') mapLivePos(d.device_id,d.lat,d.lon);
    const k=location.hash.replace('#/','')||'dashboard';
    if(d.type==='presence' && k==='mappa') route();
    // mappa allarmi = solo non gestiti: aggiorna live quando un incidente si apre/gestisce/chiude
    if(k==='mappa' && (d.type==='incident_opened'||d.type==='incident_ack'||d.type==='incident_closed'||d.type==='incident_updated')) route();
    if(k==='centrale'||k==='dashboard') route();
  };
}
// ---- Allarme: suono + popup quando un dispositivo apre un incidente ----
// Suono generato con Web Audio (nessun file esterno, CSP-safe). Il contesto va "sbloccato" da
// un'interazione utente (policy autoplay): lo riattiviamo al primo gesto.
let _almCtx=null;
function _almAudio(){ try{ if(!_almCtx) _almCtx=new (window.AudioContext||window.webkitAudioContext)(); if(_almCtx.state==='suspended')_almCtx.resume(); }catch(e){} return _almCtx; }
document.addEventListener('pointerdown',_almAudio);
function alarmBeep(){ const ctx=_almAudio(); if(!ctx)return;
  try{ const now=ctx.currentTime;
    [0,0.26,0.52].forEach((t,i)=>{ const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='square'; o.frequency.value=(i%2)?660:960; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,now+t); g.gain.exponentialRampToValueAtTime(0.3,now+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,now+t+0.22); o.start(now+t); o.stop(now+t+0.24); });
  }catch(e){} }
// Popup allarme: un solo modale che accumula gli allarmi arrivati mentre è aperto.
function incidentAlert(d){
  alarmBeep();
  const label=(typeof etLab==='function'?etLab(d.etype):d.etype)||'Allarme';
  const corr=(d.correlation||'').slice(0,8);
  let m=document.getElementById('almModal');
  if(!m){
    m=document.createElement('div'); m.id='almModal';
    m.style.cssText='position:fixed;inset:0;z-index:3000;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;background:rgba(0,0,0,.45)';
    m.innerHTML=`<div class="card" style="max-width:460px;width:100%;overflow:hidden;border:2px solid var(--bad);box-shadow:var(--sh-lg,0 10px 40px rgba(0,0,0,.3))">
      <div class="alm-hd" style="background:var(--bad);color:#fff;padding:12px 16px;font-weight:800;display:flex;align-items:center;gap:8px;font-size:15px">
        🚨 <span>NUOVO ALLARME</span><span id="almN" class="chip" style="margin-left:auto;background:#fff;color:var(--bad);border:none"></span></div>
      <div class="card-b"><div id="almList" class="col" style="gap:8px;max-height:48vh;overflow:auto"></div>
        <div class="row" style="gap:8px;justify-content:flex-end;margin-top:12px">
          <button class="btn ghost" onclick="almClose()">Chiudi</button>
          <button class="btn bad" onclick="location.hash='#/centrale';almClose()">Vai alla Centrale</button></div></div></div>`;
    m.addEventListener('mousedown',e=>{ if(e.target===m) almClose(); });
    document.body.appendChild(m);
  }
  const list=m.querySelector('#almList');
  const row=document.createElement('div'); row.className='card pad'; row.style.cssText='border-left:4px solid var(--bad);cursor:pointer';
  row.innerHTML=`<b>${esc(label)}</b><div class="small mut">correlazione ${esc(corr||'—')} · ${new Date().toLocaleTimeString('it-IT')}</div>`;
  if(d.incident_id) row.onclick=()=>{ almClose(); openIncident(d.incident_id); };
  list.prepend(row);
  const n=list.children.length, nb=m.querySelector('#almN'); if(nb)nb.textContent=(n>1?n+' allarmi':'1 allarme');
}
function almClose(){ const m=document.getElementById('almModal'); if(m)m.remove(); }

  rounds:{ title:'Ronde', goto:'ronde', load:()=>api('/patrol-routes').catch(()=>null),

  role:{ title:'Il tuo ruolo', load:()=>Promise.resolve(ME),
    body:m=>`<div class="center" style="padding:16px"><div class="n" style="font-size:22px">${esc(m.role)}</div><div class="small mut">${esc(m.email)}</div></div>` },
};
function dMut(){return '<div class="small mut" style="padding:12px">non disponibile</div>';}
function dTbl(inner){return `<table class="table"><tbody>${inner}</tbody></table>`;}
function dKpi(ico,label,n,cls=''){return `<div class="row" style="align-items:center;gap:10px;padding:2px 2px 10px"><div class="ico">${ICON[ico]}</div><div class="n ${cls}" style="font-size:22px">${esc(n)}</div><div class="l mut">${label}</div></div>`;}

let DASH_EDIT=false, DASH_LAYOUT=[], DASH_CANEDIT=false, DASH_DRAG=null;
async function vDashboard(v){
  let lay; try{ lay=await api('/dashboard/layout'); }catch(e){ lay={widgets:[],can_edit:false}; }
  DASH_LAYOUT=(lay.widgets||[]).map(w=>({...w})); DASH_CANEDIT=!!lay.can_edit; DASH_EDIT=false;
  await renderDash(v);
}
async function renderDash(v){
  const edit=DASH_EDIT;
  const hdr=`<div class="page-h"><div><h1>Dashboard</h1><div class="mut">${edit?'Trascina ⠿ per riordinare · attiva/nascondi · dimensione':'Panoramica dei moduli attivi'}</div></div>
    ${DASH_CANEDIT?`<div class="row" style="gap:8px">${edit
      ?`<button class="btn ghost" onclick="dashCancel()">Annulla</button><button class="btn" onclick="dashSave()">Salva layout</button>`
      :`<button class="btn ghost" onclick="dashOrganize()">⚙ Organizza</button>`}</div>`:''}</div>`;
  if(edit){
    v.innerHTML=hdr+`<div class="grid g2" id="dashGrid">${DASH_LAYOUT.map((w,i)=>dashEditTile(w,i)).join('')||'<div class="small mut">Nessun widget.</div>'}</div>`;
    bindDashDnD(v); return;
  }
  const vis=DASH_LAYOUT.filter(w=>w.enabled!==false && DASH_WIDGETS[w.key]);
  const data=await Promise.all(vis.map(w=>DASH_WIDGETS[w.key].load().catch(()=>null)));
  const cards=vis.map((w,i)=>{ const def=DASH_WIDGETS[w.key]; const span=w.size==='full'?'grid-column:1/-1':'';
    return `<div class="card" style="${span}"><div class="card-h"><h2>${esc(def.title)}</h2>${def.goto?`<a onclick="location.hash='#/${def.goto}'">apri →</a>`:''}</div><div class="card-b">${def.body(data[i])}</div></div>`;
  }).join('');
  v.innerHTML=hdr+`<div class="grid g2">${cards||'<div class="card pad"><div class="small mut">Nessun widget per i moduli attualmente attivi.</div></div>'}</div>`;
  bindRows(v);
}
function dashEditTile(w,i){ const def=DASH_WIDGETS[w.key]; if(!def)return '';
  const span=w.size==='full'?'grid-column:1/-1':''; const on=w.enabled!==false;
  return `<div class="card dash-tile" draggable="true" data-i="${i}" style="${span};opacity:${on?1:.55};cursor:grab">
    <div class="card-h"><h2 style="cursor:grab">⠿ ${esc(def.title)}</h2>
      <div class="row" style="gap:6px">
        <button class="btn ghost small" onclick="dashToggleSize(${i})">${w.size==='full'?'▭ intera':'◫ metà'}</button>
        <button class="btn ghost small" onclick="dashToggleOn(${i})">${on?'● attivo':'○ nascosto'}</button>
      </div></div>
    <div class="card-b"><div class="small mut">${def.goto?('modulo → '+def.goto):'widget core (sempre)'}</div></div></div>`;
}
function dashOrganize(){ DASH_EDIT=true; renderDash($('#view')); }
function dashCancel(){ route(); }
function dashToggleOn(i){ DASH_LAYOUT[i].enabled=!(DASH_LAYOUT[i].enabled!==false); renderDash($('#view')); }
function dashToggleSize(i){ DASH_LAYOUT[i].size=DASH_LAYOUT[i].size==='full'?'half':'full'; renderDash($('#view')); }
async function dashSave(){
  const payload={widgets:DASH_LAYOUT.map((w,i)=>({widget_key:w.key,enabled:w.enabled!==false,position:i,size:w.size||'half'}))};
  try{ await api('/dashboard/layout',{method:'PUT',body:JSON.stringify(payload)}); toast('Layout salvato','ok'); route(); }
  catch(e){ toast(e.message,'bad'); }
}
function bindDashDnD(v){
  $$('.dash-tile',v).forEach(el=>{
    el.ondragstart=()=>{ DASH_DRAG=+el.dataset.i; };
    el.ondragover=e=>e.preventDefault();
    el.ondrop=e=>{ e.preventDefault(); const to=+el.dataset.i;
      if(DASH_DRAG===null||DASH_DRAG===to)return;
      const [m]=DASH_LAYOUT.splice(DASH_DRAG,1); DASH_LAYOUT.splice(to,0,m); DASH_DRAG=null; renderDash($('#view')); };
  });
}
function kpi(ico,label,n,cls='',small){return `<div class="kpi"><div class="ico">${ICON[ico]}</div>
  <div class="n ${cls}" style="${small?'font-size:18px':''}">${esc(n)}</div><div class="l">${label}</div></div>`;}
function card(title,inner,gotoK){return `<div class="card"><div class="card-h"><h2>${title}</h2>
  ${gotoK?`<a onclick="location.hash='#/${gotoK}'">apri →</a>`:''}</div>
  <table class="table"><tbody>${inner}</tbody></table></div>`;}
function emptyRow(t){return `<tr><td class="empty" style="padding:26px">${t}</td></tr>`;}
function incRow(i){return `<tr class="clk" data-inc="${i.id}"><td><b>${esc(i.etype)}</b><div class="small mut">${esc(i.site||'—')}</div></td>
  <td>${chip(i.state)}</td></tr>`;}
function ordRow(o){return `<tr class="clk" data-ord="${o.id}"><td><b>${esc(o.title)}</b><div class="small mut">${esc(o.site||'—')} · ${esc(o.assignee||'non assegnato')}</div></td>

// Lista filtrata per tab (aperti = non chiusi) + ricerca full-text, ordinata (aperti per priorità desc).
function cenFiltered(){
  const toks=(CEN.q||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list=CEN.all.filter(i=>{
    const inTab = CEN.tab==='tutti' ? true : CEN.tab==='chiusi' ? i.state==='chiuso' : i.state!=='chiuso';
    if(!inTab) return false;
    if(!toks.length) return true;
    const hay=incHay(i); return toks.every(t=>hay.includes(t));
  });
  if(CEN.tab!=='chiusi') list=list.slice().sort((a,b)=>(b.priority||0)-(a.priority||0));
  return list;
}
function cenCounts(){ const a=CEN.all; return {

// Testo ricercabile (full-text) di un incidente: tipo (+etichetta), sede, assegnato, stato
// (+sinonimi), priorità (numero + livello) e correlazione (completa e breve).
function incHay(i){
  const pri={1:'bassa',2:'media',3:'alta',4:'critica',5:'critica'};
  const st={aperto:'aperto nuovo',preso_in_carico:'preso in carico ack',chiuso:'chiuso risolto'};
  const parts=[i.etype, (typeof etLab==='function'?etLab(i.etype):''), i.site, i.assignee,
    i.state, (st[i.state]||''), ('priorità '+i.priority), (pri[i.priority]||''),
    i.correlation, (i.correlation||'').slice(0,8)];
  return parts.filter(Boolean).join(' ').toLowerCase();
}

async function genTurniRun(){

  const a=$('#gA').value, z=$('#gZ').value, s=$('#gS').value, e=$('#gE').value; const mask=genMask();
  if(!uids.length||!a||!z||mask==='0000000'){ m.textContent='scegli lavoratori, intervallo e giorni'; m.style.color='var(--bad)'; return; }
  m.textContent='Genero…'; m.style.color='var(--mut)';
  let ok=0, skip=0; const d0=new Date(a+'T00:00:00'), d1=new Date(z+'T00:00:00');

    const day=d.toISOString().slice(0,10);
    for(const u of uids){ try{ await api('/shift-plans',{method:'POST',body:JSON.stringify({user_id:u,starts_at:day+'T'+s+':00Z',ends_at:day+'T'+e+':00Z'})}); ok++; }catch(err){ skip++; } }

  const reveal=()=>{ if(m){ if(m.setZIndexOffset)m.setZIndexOffset(1000); try{m.openTooltip();}catch(e){} _alarmTipM=m; } };
  // se il pin è dentro un cluster, zoomToShowLayer lo scopre (declustera/spiderfy) poi apre il tooltip

  else { MAP.setView([lat,lon], Math.max(MAP.getZoom()||0,17)); reveal(); }
  // anello di evidenziazione temporaneo, raggio animato in JS
  if(_alarmHi){ try{MAP.removeLayer(_alarmHi);}catch(e){} _alarmHi=null; }
  if(_alarmHiT){ clearInterval(_alarmHiT); }
  _alarmHi=L.circleMarker([lat,lon],{radius:10,color:'#2563eb',weight:3,opacity:.95,fill:false,interactive:false}).addTo(MAP);
  let r=10, grow=true, ticks=0;

    try{_alarmHi.setRadius(r);}catch(e){}
    if(++ticks>42){ clearInterval(_alarmHiT); _alarmHiT=null; if(_alarmHi){ try{MAP.removeLayer(_alarmHi);}catch(e){} _alarmHi=null; } } },55);
}

// Strumenti di disegno geofence (Geoman) — riusabili su mappa outdoor (geo) e indoor (xy).
// onSave opzionale: se assente, salva una geofence outdoor via /geofences.
function setupGeofenceTools(map, opts){
  opts=opts||{};
  if(!map.pm){ toast('Strumenti di disegno non caricati (serve connessione)','bad'); return; }
  if(map.pm){
    map.pm.addControls({position:'topleft', drawCircle:true, drawRectangle:true, drawPolygon:true,
      drawMarker:false, drawPolyline:false, drawCircleMarker:false, drawText:false,
      editMode:true, dragMode:true, cutPolygon:false, removalMode:true, rotateMode:false});
    map.pm.setGlobalOptions({snappable:true, templineStyle:{color:'#2563eb'}, hintlineStyle:{color:'#2563eb',dashArray:'5,5'}});
    map.off('pm:create');
    map.on('pm:create', async (e)=>{
      const geom=geomFromLayer(e.layer, e.shape, opts); map.removeLayer(e.layer);
      if(!geom){ toast('Forma non valida','bad'); return; }
      const name=await askPrompt('Nome della geofence?'); if(!name){ return; }
      const kind = geom.radius!=null ? 'circle':'polygon';
      if(opts.onSave){ opts.onSave(name, kind, geom); return; }
      try{ await api('/geofences',{method:'POST',body:JSON.stringify({name,kind,geom,color:window._gfColor||'#16a34a'})}); toast('Geofence creata','ok'); route(); }
      catch(err){ toast(err.message,'bad'); }
    });
  }
}
function geomFromLayer(layer, shape, opts){
  const xy = opts && opts.xy;                 // indoor: coordinate immagine (lat=y, lng=x)
  const pt = ll => xy ? [ll.lng, ll.lat] : [ll.lat, ll.lng];
  if(shape==='Circle'){ const c=layer.getLatLng(), r=layer.getRadius();
    return xy ? {cx:c.lng, cy:c.lat, radius:r} : {lat:c.lat, lon:c.lng, radius:Math.round(r)}; }
  const ll=(layer.getLatLngs&&layer.getLatLngs()[0])||[]; const pts=ll.map(pt);
  if(pts.length<3) return null; return {points:pts};
}
let FH=null;
function toggleFreehand(btn){
  if(FH){ endFreehand(); return; }
  if(!MAP){ return; } btn.classList.add('ok'); MAP.dragging.disable(); MAP.getContainer().style.cursor='crosshair';
  let pts=[], line=null, drawing=false, last=null;
  const far=(a,b)=>{ const p1=MAP.latLngToContainerPoint(a), p2=MAP.latLngToContainerPoint(b); return p1.distanceTo(p2)>6; };
  const onDown=(e)=>{ drawing=true; pts=[e.latlng]; last=e.latlng; if(line)MAP.removeLayer(line);
    line=L.polyline(pts,{color:'#2563eb',weight:2}).addTo(MAP); };
  const onMove=(e)=>{ if(!drawing)return; if(last&&!far(last,e.latlng))return; pts.push(e.latlng); last=e.latlng; line.setLatLngs(pts); };
  const onUp=async()=>{ if(!drawing)return; drawing=false; if(line)MAP.removeLayer(line);
    if(pts.length>=3){ const geom={points:pts.map(p=>[p.lat,p.lng])}; const name=await askPrompt('Nome della geofence (mano libera)?');
      if(name){ try{ await api('/geofences',{method:'POST',body:JSON.stringify({name,kind:'polygon',geom,color:window._gfColor||'#16a34a'})}); toast('Geofence creata','ok'); route(); }catch(e){toast(e.message,'bad');} } }
    endFreehand();
  };
  FH={onDown,onMove,onUp}; MAP.on('mousedown',onDown); MAP.on('mousemove',onMove); MAP.on('mouseup',onUp);
  toast('Tieni premuto e traccia il perimetro con il mouse','ok');
}
function endFreehand(){ if(!FH||!MAP)return; MAP.off('mousedown',FH.onDown); MAP.off('mousemove',FH.onMove); MAP.off('mouseup',FH.onUp);

function drawIndoorGeofence(g,lg){
  let layer=null;
  const col=g.color||'#16a34a';
  if(g.kind==='circle'&&g.geom.radius){ layer=L.circle([g.geom.cy,g.geom.cx],{radius:g.geom.radius,color:col,fillColor:col,fillOpacity:0.14}); }
  else if(g.kind==='polygon'&&g.geom.points){ layer=L.polygon(g.geom.points.map(p=>[p[1],p[0]]),{color:col,fillColor:col,fillOpacity:0.14}); }
  if(!layer)return;
  layer._gf=g; GF_LAYERS[g.id]=layer;
  layer.bindPopup(`<b>${esc(g.name)}</b>${gfPopupActions(g,window._fpAdmin)}`);
  layer.addTo(lg);
}

function imgDims(file){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{res({w:img.naturalWidth,h:img.naturalHeight}); URL.revokeObjectURL(img.src);}; img.onerror=()=>rej(new Error('immagine non valida')); img.src=URL.createObjectURL(file); }); }
async function pdfToPng(file){
  if(!window.pdfjsLib){ throw new Error('libreria PDF non caricata'); }
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const page=await pdf.getPage(1);
  const scale=Math.min(3, 2000/page.getViewport({scale:1}).width);
  const viewport=page.getViewport({scale:Math.max(1,scale)});
  const canvas=document.createElement('canvas'); canvas.width=Math.round(viewport.width); canvas.height=Math.round(viewport.height);
  await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  return {blob, w:canvas.width, h:canvas.height};
}
// Upload parametrico: nome + sede (dai dati del tenant) + file. Niente prompt.
async function doUploadFloorplan(name, siteId, file){
  if(!name||!name.trim()){ toast('Dai un nome alla piantina','bad'); return false; }
  if(!file){ toast('Scegli un file (immagine o PDF)','bad'); return false; }
  let blob, w, h, ct;
  if(file.type==='application/pdf'){ const r=await pdfToPng(file); blob=r.blob; w=r.w; h=r.h; ct='image/png'; }
  else { const dim=await imgDims(file); w=dim.w; h=dim.h; blob=file; ct=file.type||'image/png'; }
  if(!w||!h){ toast('Dimensioni immagine non leggibili','bad'); return false; }
  const q=new URLSearchParams({name:name.trim(), width:w, height:h}); if(siteId) q.set('site_id',siteId);
  const res=await fetch('/api/floorplans?'+q.toString(),{method:'POST',credentials:'include',
    headers:{'x-tenant-slug':store.slug,'x-csrf-token':csrfToken(),'content-type':ct}, body:blob});
  if(!res.ok){ const t=await res.text().catch(()=>''); toast('Upload fallito ('+res.status+') '+t,'bad'); return null; }
  const j=await res.json().catch(()=>({})); toast('Piantina caricata','ok'); return j.id||true;
}

// Geometria corrente dal layer Leaflet (dopo edit Geoman). Outdoor: lat/lon; indoor: cx/cy o points xy.
function geomFromEditLayer(layer, indoor){
  if(layer.getRadius){ const ll=layer.getLatLng(); return indoor?{cx:ll.lng,cy:ll.lat,radius:Math.round(layer.getRadius())}:{lat:ll.lat,lon:ll.lng,radius:Math.round(layer.getRadius())}; }
  const ll=layer.getLatLngs()[0]||[]; return indoor?{points:ll.map(p=>[p.lng,p.lat])}:{points:ll.map(p=>[p.lat,p.lng])};
}

async function drawTrail(id){
  try{ const P=await api('/devices/'+id+'/positions?limit=50');
    const line=P.map(p=>[p.lat,p.lon]).reverse();
    if(MAPTRAIL){ MAP.removeLayer(MAPTRAIL); MAPTRAIL=null; }
    if(line.length>1){ MAPTRAIL=L.polyline(line,{color:'#2563eb',weight:3,opacity:0.8}).addTo(MAP); MAP.fitBounds(line,{padding:[40,40]}); setupReplay(line); }
    else toast('Solo una posizione nota','warn');
  }catch(e){ toast(e.message,'bad'); }
}
// live: SSE device_position muove/crea il marker
function mapLivePos(id,lat,lon){
  if(!MAP||typeof L==='undefined')return;
  if(MARK[id]) MARK[id].setLatLng([lat,lon]);
  else { const m=L.marker([lat,lon]); MARK[id]=m; (CLUSTER||MAP).addLayer(m); }
}
// Replay percorso: marker che scorre lungo la polyline con slider play/pausa.
function setupReplay(line){
  const bar=$('#replayBar'); if(!bar)return;
  if(REPLAY){ clearInterval(REPLAY.timer); if(REPLAY.marker)MAP.removeLayer(REPLAY.marker); REPLAY=null; }
  bar.classList.remove('hide');
  bar.innerHTML=`<button class="btn ghost small" id="rpPlay">▶ Replay</button>
    <input id="rpSlider" type="range" min="0" max="${line.length-1}" value="0" style="flex:1">
    <span id="rpIdx" class="small mut">1/${line.length}</span>
    <button class="btn-ico btn ghost" id="rpClose">${ICON.x}</button>`;
  const marker=L.circleMarker(line[0],{radius:7,color:'#dc2626',fillColor:'#dc2626',fillOpacity:1}).addTo(MAP);
  REPLAY={marker,timer:null,line};
  const show=i=>{ marker.setLatLng(line[i]); $('#rpSlider').value=i; $('#rpIdx').textContent=(i+1)+'/'+line.length; };
  $('#rpSlider').oninput=e=>show(+e.target.value);
  $('#rpPlay').onclick=()=>{ if(REPLAY.timer){ clearInterval(REPLAY.timer); REPLAY.timer=null; $('#rpPlay').textContent='▶ Replay'; return; }
    $('#rpPlay').textContent='⏸ Pausa';
    REPLAY.timer=setInterval(()=>{ let i=(+$('#rpSlider').value)+1; if(i>=line.length){ clearInterval(REPLAY.timer); REPLAY.timer=null; $('#rpPlay').textContent='▶ Replay'; return; } show(i); MAP.panTo(line[i]); },500); };
  $('#rpClose').onclick=()=>{ clearInterval(REPLAY.timer); MAP.removeLayer(marker); REPLAY=null; bar.classList.add('hide'); bar.innerHTML=''; };
}

function agendaByDay(sched){
  const items=(sched||[]).slice().sort((a,b)=>new Date(a.scheduled_start)-new Date(b.scheduled_start));
  if(!items.length) return `<div class="card"><div class="card-h"><h2>Agenda appuntamenti</h2></div><div class="small mut" style="padding:12px 14px">Nessun appuntamento pianificato.</div></div>`;
  const byDay={}; items.forEach(o=>{ const d=new Date(o.scheduled_start).toISOString().slice(0,10); (byDay[d]=byDay[d]||[]).push(o); });
  const today=new Date().toISOString().slice(0,10);
  const dayLabel=d=>{ const dt=new Date(d+'T00:00:00'); const base=dt.toLocaleDateString('it-IT',{weekday:'long',day:'2-digit',month:'long'}); return d===today?base+' · oggi':base; };
  const hhmm=o=>new Date(o.scheduled_start).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  const asg=o=>o.assignee?esc(o.assignee.split('@')[0]):(o.group_name?('👥 '+esc(o.group_name)):'<span style="color:var(--bad)">da assegnare</span>');
  const blocks=Object.keys(byDay).sort().map(d=>`<div style="padding:8px 14px">
    <div class="small" style="font-weight:600;text-transform:capitalize;margin-bottom:4px">${dayLabel(d)}</div>
    ${byDay[d].map(o=>`<div class="spread clk" data-ord="${o.id}" style="border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:4px 0">
      <div style="min-width:0"><b class="small">${hhmm(o)}</b> · ${esc(o.title)}<div class="small mut">${esc(o.client_name||o.site||'—')} · ${asg(o)}</div></div>
      ${priBadge(o.priority)}${chip(o.state)}</div>`).join('')}</div>`).join('');
  return `<div class="card"><div class="card-h"><h2>Agenda appuntamenti</h2></div>${blocks}</div>`;
}

    <div class="small mut" style="margin-top:2px">${lavDates(l)}${(l.deps&&l.deps.length)?` · dopo: ${l.deps.map(d=>esc((lavById[d]||{}).name||'?')).join(', ')}`:''}</div>
    <div class="row" style="gap:8px;align-items:center;margin-top:6px">${progBar(l.progress_pct)}
      ${planner?`<input type="range" min="0" max="100" value="${l.progress_pct}" style="flex:1" onchange="lavSetProgress('${l.id}',this.value)">
      <span class="small" style="width:38px;text-align:right">${l.progress_pct}%</span>
      <button class="btn ghost small" onclick="lavPlan('${id}','${l.id}')">pianifica</button>
      <button class="btn-ico btn ghost" onclick="lavDel('${l.id}')">${ICON.x}</button>`:`<span class="small">${l.progress_pct}%</span>`}</div></div>`).join('')
    ||'<div class="small mut">Nessuna lavorazione. Aggiungine per misurare l\'avanzamento.</div>';
  const gantt=ganttHtml(c.lavorazioni||[]);
  const sal=(c.sal||[]).map(s=>`<tr><td class="small">${esc(s.sal_date)}</td><td>${s.pct}%</td><td class="small">${s.amount!=null?eur(s.amount):'—'}</td><td class="small mut">${esc(s.note||'')}</td><td style="text-align:right">${planner?`<button class="btn ghost small" onclick='fatturaNew("${id}",${JSON.stringify(s).replace(/'/g,"&#39;")})'>fattura</button>`:''}</td></tr>`).join('')
    ||`<tr><td colspan="5" class="empty">Nessun SAL registrato</td></tr>`;
  const shifts=(c.shifts||[]).map(s=>`<tr><td class="small">${esc(s.email)}</td><td class="small">${dtLocal(s.starts_at)} → ${dtLocal(s.ends_at)}</td><td>${chip(s.state)}</td></tr>`).join('')
    ||`<tr><td colspan="3" class="empty">Nessun turno legato</td></tr>`;
  // C1 — squadre assegnate
  const assigned=c.teams||[]; const assignedIds=new Set(assigned.map(t=>t.id));
  const freeTeams=(allTeams||[]).filter(t=>!assignedIds.has(t.id));
  const teamRows=assigned.map(t=>`<div class="spread" style="border:1px solid var(--line);border-radius:8px;padding:8px">
    <div><b class="small">${esc(t.name)}</b> <span class="small mut">${t.members} persone</span></div>
    ${planner?`<button class="btn-ico btn ghost" onclick="comRemoveTeam('${id}','${t.id}')">${ICON.x}</button>`:''}</div>`).join('')
    ||'<div class="small mut">Nessuna squadra assegnata.</div>';
  const teamAssign=(planner&&freeTeams.length)?`<div class="row" style="gap:8px;margin-top:8px"><select id="cmTeam" class="grow">${freeTeams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><button class="btn small" onclick="comAssignTeam('${id}')">assegna</button></div>`:'';
  const squadreSection=`<div><h3 style="margin:0">Squadre assegnate</h3>
    <div class="col" style="gap:6px;margin-top:8px">${teamRows}</div>${teamAssign}</div>`;
  // C1 — presenze (timbrature)
  const presRows=(c.presenze||[]).map(p=>`<tr><td class="small">${esc(p.email)}</td><td class="small">${dtLocal(p.clock_in)}</td><td class="small">${p.clock_out?dtLocal(p.clock_out):'<span style="color:var(--ok,green)">in cantiere</span>'}</td></tr>`).join('')
    ||`<tr><td colspan="3" class="empty">Nessuna presenza</td></tr>`;
  const clockBtn=c.my_open
    ? `<button class="btn ok small" onclick="comClock('${id}','out')">Timbra uscita</button>`
    : `<button class="btn small" onclick="comClock('${id}','in')">Timbra entrata</button>`;
  const presenzeSection=`<div><div class="spread"><h3 style="margin:0">Presenze in cantiere</h3>${clockBtn}</div>
    <table class="table" style="margin-top:6px"><thead><tr><th>Persona</th><th>Entrata</th><th>Uscita</th></tr></thead><tbody>${presRows}</tbody></table></div>`;
  // C3 — costi vs budget
  const cs=c.cost||{}; const costiRows=(c.costi||[]).map(k=>`<tr><td class="small">${esc(k.description)}<div class="small mut">${esc(COSTO_CAT[k.category]||k.category)} · ${esc(k.cost_date)}</div></td><td style="text-align:right">${eur(k.amount)}</td><td style="text-align:right">${planner?`<button class="btn-ico btn ghost" onclick="costoDel('${id}','${k.id}')">${ICON.x}</button>`:''}</td></tr>`).join('')||`<tr><td colspan="3" class="empty">Nessun costo</td></tr>`;
  const vClass=cs.variance==null?'':(cs.variance>=0?'color:var(--ok,#16a34a)':'color:var(--bad)');
  const costiSection=`<div><div class="spread"><h3 style="margin:0">Costi e budget</h3>${planner?`<a onclick="costoNew('${id}')">+ costo</a>`:''}</div>
    <div class="row" style="gap:8px;align-items:center;margin:8px 0">${planner?`<label class="small mut">Costo orario manodopera (€)<input id="cmRate" type="number" step="0.01" value="${c.labor_rate||0}" style="width:110px"> <button class="btn ghost small" onclick="comRate('${id}')">salva</button></label>`:`<span class="small mut">Costo orario: ${eur(c.labor_rate)}</span>`}</div>
    <table class="table"><tbody>
      <tr><td class="small">Manodopera (${cs.labor_hours||0} h × ${eur(c.labor_rate)})</td><td style="text-align:right">${eur(cs.labor_cost)}</td><td></td></tr>
      <tr><td class="small">Materiali / noli / varie</td><td style="text-align:right">${eur(cs.materials_cost)}</td><td></td></tr>
      <tr><td class="small"><b>Costo totale</b></td><td style="text-align:right"><b>${eur(cs.total_cost)}</b></td><td></td></tr>
      <tr><td class="small">Budget</td><td style="text-align:right">${cs.budget!=null?eur(cs.budget):'—'}</td><td></td></tr>
      <tr><td class="small"><b>Scostamento</b></td><td style="text-align:right;${vClass}"><b>${cs.variance!=null?eur(cs.variance):'—'}</b></td><td></td></tr>
    </tbody></table>
    <div class="small mut" style="margin:6px 0 4px">Voci di costo</div>
    <table class="table"><tbody>${costiRows}</tbody></table></div>`;
  // C4 — giornale di cantiere
  const diarioRows=(c.diario||[]).map(g=>`<div style="border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px">
    <div class="spread"><b class="small">${esc(g.diary_date)}</b><span class="small mut">${g.weather?esc(g.weather)+' · ':''}${g.present_count!=null?g.present_count+' presenti':''}${planner?` <button class="btn-ico btn ghost" onclick="diarioDel('${id}','${g.id}')">${ICON.x}</button>`:''}</span></div>
    <div class="small" style="white-space:pre-wrap;margin-top:4px">${esc(g.body)}</div>${g.author?`<div class="small mut" style="margin-top:2px">— ${esc(g.author)}</div>`:''}</div>`).join('')
    ||'<div class="small mut">Nessuna annotazione.</div>';
  const giornaleSection=`<div><div class="spread"><h3 style="margin:0">Giornale di cantiere</h3>${planner?`<a onclick="diarioNew('${id}')">+ annotazione</a>`:''}</div>
    <div style="margin-top:8px">${diarioRows}</div></div>`;
  // C5 — fatture da SAL
  const fattRows=(c.fatture||[]).map(f=>`<tr><td class="small"><b>${esc(f.number)}</b><div class="small mut">${esc(f.issue_date)}</div></td>
    <td style="text-align:right">${eur(f.amount)}</td><td><span class="chip ${f.status==='pagata'?'s-attivo':''}">${esc(f.status)}</span></td>
    <td style="text-align:right">${planner?`<select onchange="fatturaStatus('${id}','${f.id}',this.value)" class="small"><option ${f.status==='emessa'?'selected':''}>emessa</option><option ${f.status==='pagata'?'selected':''}>pagata</option><option ${f.status==='annullata'?'selected':''}>annullata</option></select> <button class="btn-ico btn ghost" onclick="fatturaDel('${id}','${f.id}')">${ICON.x}</button>`:''}</td></tr>`).join('')
    ||`<tr><td colspan="4" class="empty">Nessuna fattura</td></tr>`;
  const fatt_tot=(c.fatture||[]).filter(f=>f.status!=='annullata').reduce((a,f)=>a+(f.amount||0),0);
  const fattureSection=`<div><h3 style="margin:0">Fatturazione (da SAL)</h3>
    <div class="small mut" style="margin:4px 0">Usa «fattura» su una riga SAL per emettere il documento con l'importo maturato.</div>
    <table class="table"><thead><tr><th>Numero</th><th style="text-align:right">Importo</th><th>Stato</th><th></th></tr></thead>
    <tbody>${fattRows}</tbody><tfoot><tr><td style="text-align:right"><b>Fatturato</b></td><td style="text-align:right"><b>${eur(fatt_tot)}</b></td><td colspan="2"></td></tr></tfoot></table></div>`;
  // R3 — allegati
  const attRows=(c.attachments||[]).map(a=>`<div class="spread" style="border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:4px 0">
    <div style="min-width:0"><a href="/api/commessa-attachments/${a.id}" target="_blank" rel="noopener" class="small"><b>${esc(a.filename||a.kind)}</b></a>
      <div class="small mut">${esc(a.entity_kind)}${a.caption?' · '+esc(a.caption):''}${a.created_by?' · '+esc(a.created_by):''}</div></div>
    <button class="btn-ico btn ghost" onclick="comAttDel('${id}','${a.id}')">${ICON.x}</button></div>`).join('')
    ||'<div class="small mut">Nessun allegato.</div>';
  const attSection=`<div><div class="spread"><h3 style="margin:0">Documenti e allegati</h3>
      <span><input type="file" id="cmFile" accept="image/*,application/pdf" style="font-size:12px"><button class="btn ghost small" onclick="comAttUpload('${id}')">⬆ Carica</button></span></div>
    <div style="margin-top:8px">${attRows}</div></div>`;
  drawer('Commessa · '+esc(c.code),`<div class="col" style="gap:12px">
    <div class="row" style="gap:6px"><button class="btn ghost small" onclick="comPrint('${id}')">📄 Stampa dossier</button></div>
    <div><div class="spread"><b>${esc(c.name)}</b>${statusSel}</div>
      <div class="small mut" style="margin-top:4px">${esc(c.client_name||'—')}${c.site?' · '+esc(c.site):''}${c.start_date?' · '+esc(c.start_date):''}${c.end_date?' → '+esc(c.end_date):''}${c.budget!=null?' · € '+c.budget.toLocaleString('it-IT'):''}${(c.cig||c.cup)?`<br>${c.cig?'CIG: '+esc(c.cig):''}${c.cup?' · CUP: '+esc(c.cup):''}`:''}</div>
      <div class="row" style="gap:8px;align-items:center;margin-top:8px">${progBar(c.progress)}<b>${c.progress}%</b><span class="small mut">avanzamento complessivo (media pesata)</span></div></div>
    <div><div class="spread"><h3 style="margin:0">Lavorazioni (WBS)</h3>${planner?`<a onclick="lavNew('${id}')">+ aggiungi</a>`:''}</div>
      <div style="margin-top:8px">${lav}</div></div>
    ${gantt}
    <div><div class="spread"><h3 style="margin:0">SAL — stato avanzamento</h3>${planner?`<a onclick="salNew('${id}')">+ registra SAL</a>`:''}</div>
      <table class="table" style="margin-top:6px"><thead><tr><th>Data</th><th>%</th><th>Importo</th><th>Note</th><th></th></tr></thead><tbody>${sal}</tbody></table></div>
    <div><h3 style="margin:0">Turni legati</h3>
      <table class="table" style="margin-top:6px"><thead><tr><th>Lavoratore</th><th>Quando</th><th>Stato</th></tr></thead><tbody>${shifts}</tbody></table>
      <div class="small mut" style="margin-top:4px">Per legare un turno: pianificalo in <b>Turni</b> e scegli questa commessa.</div></div>
    ${squadreSection}
    ${presenzeSection}
    ${costiSection}
    ${giornaleSection}
    ${fattureSection}
    ${attSection}
    ${planner?`<button class="btn ghost" onclick="comDel('${id}')">${ICON.x} Elimina commessa</button>`:''}</div>`);
}
async function comSetStatus(id,st){ try{await api('/commesse/'+id,{method:'POST',body:JSON.stringify({status:st})}); toast('Stato aggiornato','ok');}catch(e){toast(e.message,'bad');} }
async function comAssignTeam(id){ const sel=$('#cmTeam'); if(!sel||!sel.value)return;
  try{await api('/commesse/'+id+'/teams',{method:'POST',body:JSON.stringify({team_id:sel.value})}); toast('Squadra assegnata','ok'); openCommessa(id);}catch(e){toast(e.message,'bad');} }
async function comRemoveTeam(id,tid){ if(!await askConfirm('Togliere la squadra dalla commessa?'))return;
  try{await api('/commesse/'+id+'/teams/'+tid,{method:'DELETE'}); toast('Rimossa','ok'); openCommessa(id);}catch(e){toast(e.message,'bad');} }
async function comClock(id,dir){
  try{ if(dir==='in'){ let body={};
      if(navigator.geolocation){ try{ const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:6000})); body={lat:pos.coords.latitude,lon:pos.coords.longitude}; }catch(e){} }
      await api('/commesse/'+id+'/presenze/in',{method:'POST',body:JSON.stringify(body)}); toast('Entrata timbrata','ok');
    } else { await api('/commesse/'+id+'/presenze/out',{method:'POST',body:JSON.stringify({})}); toast('Uscita timbrata','ok'); }
    openCommessa(id);
  }catch(e){toast(e.message,'bad');}
}

async function comAttUpload(cid){ const f=$('#cmFile'); if(!f||!f.files||!f.files[0])return toast('scegli un file','warn'); const file=f.files[0];
  if(file.size>10e6)return toast('File troppo grande (max 10MB)','bad');
  const kind=file.type.startsWith('image/')?'photo':'doc';
  const q=new URLSearchParams({kind,filename:file.name});
  try{ const res=await fetch('/api/commesse/'+cid+'/attachments?'+q.toString(),{method:'POST',credentials:'include',
      headers:{'x-tenant-slug':store.slug,'x-csrf-token':csrfToken(),'content-type':file.type||'application/octet-stream'},body:file});
    if(!res.ok) throw new Error('HTTP '+res.status); toast('Allegato caricato','ok'); openCommessa(cid);
  }catch(e){ toast(e.message,'bad'); } }
async function comAttDel(cid,id){ if(!await askConfirm('Eliminare l\'allegato?'))return;

  let c; try{ c=await api('/commesse/'+id); }catch(e){ return toast(e.message,'bad'); }

  const sal=(c.sal||[]).map(s=>`<tr><td>${esc2(s.sal_date)}</td><td>${s.pct}%</td><td>${s.amount!=null?'€ '+s.amount:''}</td><td>${esc2(s.note||'')}</td></tr>`).join('');
  const costi=(c.costi||[]).map(k=>`<tr><td>${esc2(k.description)}</td><td>${esc2(COSTO_CAT[k.category]||k.category)}</td><td>€ ${k.amount}</td><td>${esc2(k.cost_date)}</td></tr>`).join('');
  const fatt=(c.fatture||[]).map(f=>`<tr><td>${esc2(f.number)}</td><td>€ ${f.amount}</td><td>${esc2(f.status)}</td><td>${esc2(f.issue_date)}</td></tr>`).join('');
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>Commessa ${esc2(c.code)}</title>
    <style>body{font:13px/1.4 system-ui,Arial;margin:28px;color:#111}h1{font-size:20px;margin:0 0 2px}h2{font-size:14px;margin:18px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px}
    table{border-collapse:collapse;width:100%;margin-top:4px}th,td{border:1px solid #ddd;padding:4px 6px;text-align:left;font-size:12px}th{background:#f3f3f3}
    .meta{color:#555;font-size:12px}.tot{margin-top:6px;font-size:13px}</style></head><body>
    <h1>${esc2(c.name)}</h1><div class="meta">Commessa ${esc2(c.code)} · ${esc2(c.client_name||'')}${c.site?' · '+esc2(c.site):''}${c.cig?' · CIG '+esc2(c.cig):''}${c.cup?' · CUP '+esc2(c.cup):''}</div>
    <div class="meta">Stato: ${esc2(COMM_STATI[c.status]||c.status)} · Avanzamento: ${c.progress}%${c.budget!=null?' · Budget € '+c.budget:''}${c.start_date?' · dal '+esc2(c.start_date):''}${c.end_date?' al '+esc2(c.end_date):''}</div>

// Gantt leggero: barre posizionate sull'intervallo min→max delle lavorazioni con date.
function ganttHtml(lavs){
  const withD=(lavs||[]).filter(l=>l.start_date&&l.end_date);
  if(!withD.length) return '<div class="small mut">Cronoprogramma: assegna date alle lavorazioni (pulsante «pianifica») per vedere il Gantt.</div>';
  const toT=d=>new Date(d+'T00:00:00').getTime();
  let min=Math.min(...withD.map(l=>toT(l.start_date))), max=Math.max(...withD.map(l=>toT(l.end_date)));
  const span=Math.max(1,max-min); const fmt=t=>new Date(t).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'});
  const rows=(lavs||[]).map(l=>{
    if(!l.start_date||!l.end_date) return `<div class="row" style="gap:8px;align-items:center;margin:3px 0"><div class="small mut" style="width:130px;overflow:hidden;text-overflow:ellipsis">${esc(l.name)}</div><div class="small mut" style="flex:1">— senza date —</div></div>`;
    const a=toT(l.start_date),z=toT(l.end_date);
    const left=(a-min)/span*100, w=Math.max(2,(z-a)/span*100);
    const col=l.late?'var(--bad)':(l.progress_pct>=100?'var(--ok,#16a34a)':'var(--brand,#2563eb)');
    return `<div class="row" style="gap:8px;align-items:center;margin:3px 0">
      <div class="small" style="width:130px;overflow:hidden;text-overflow:ellipsis" title="${esc(l.name)}">${esc(l.name)}</div>
      <div style="flex:1;position:relative;height:18px;background:var(--line);border-radius:4px">
        <div style="position:absolute;left:${left}%;width:${w}%;top:0;bottom:0;background:${col};border-radius:4px" title="${esc(l.start_date)} → ${esc(l.end_date)} · ${l.progress_pct}%">
          <div style="height:100%;width:${l.progress_pct}%;background:rgba(255,255,255,.35);border-radius:4px"></div></div></div></div>`;
  }).join('');
  return `<div><h3 style="margin:0 0 6px">Cronoprogramma</h3>
    <div class="small mut" style="margin-bottom:4px">${fmt(min)} → ${fmt(max)}</div>${rows}</div>`;
}

async function vDispatch(v){
  if(!v._day) v._day=new Date().toISOString().slice(0,10);
  const [O,users]=await Promise.all([api('/orders').catch(()=>[]),api('/users').catch(()=>[])]);
  v._users=users; const workers=users.filter(u=>['lavoratore','operatore'].includes(u.role));
  const day=v._day;
  const sameDay=o=>o.scheduled_start && new Date(o.scheduled_start).toISOString().slice(0,10)===day;
  const tostr=o=>`<div class="spread" style="border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:4px 0">
    <div style="min-width:0"><b class="small">${esc(o.title)}</b><div class="small mut">${esc(o.site||'—')}${o.client_name?' · '+esc(o.client_name):''} ${o.scheduled_start?'· '+new Date(o.scheduled_start).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):''}</div></div>
    ${chip(o.state)}</div>`;
  const unassigned=O.filter(o=>!o.assignee && !o.group_name && o.state!=='completato' && o.state!=='annullato');
  const unRows=unassigned.map(o=>`<div class="spread" style="border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:4px 0">
    <div style="min-width:0"><b class="small">${esc(o.title)}</b><div class="small mut">${esc(o.site||'—')}${o.client_name?' · '+esc(o.client_name):''} · ${schedLabel(o)}</div></div>
    <button class="btn ghost small" onclick="ordSuggestTech('${o.id}',${o.version})">✦ assegna</button></div>`).join('')
    ||'<div class="small mut">Nessun intervento da assegnare.</div>';
  const lanes=workers.map(w=>{ const list=O.filter(o=>o.assignee===w.email && sameDay(o));
    return `<div class="card pad" style="min-width:220px;flex:1"><div class="spread"><b class="small">${esc(w.email.split('@')[0])}</b><span class="chip">${list.length}</span></div>
      ${list.map(tostr).join('')||'<div class="small mut" style="margin-top:6px">—</div>'}</div>`; }).join('');
  // F1 — vista settimana: 7 colonne (lun→dom) con gli appuntamenti del giorno
  const mode=v._dmode||'day';
  const base=new Date(day+'T00:00:00'); const dow=(base.getDay()+6)%7; const mon=new Date(base); mon.setDate(base.getDate()-dow);
  const weekDays=Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d.toISOString().slice(0,10); });
  const today=new Date().toISOString().slice(0,10);
  const dnames=['lun','mar','mer','gio','ven','sab','dom'];
  const schedOn=d=>O.filter(o=>o.scheduled_start && new Date(o.scheduled_start).toISOString().slice(0,10)===d && o.state!=='annullato')
    .sort((a,b)=>new Date(a.scheduled_start)-new Date(b.scheduled_start));
  const weekCols=weekDays.map((d,i)=>{ const list=schedOn(d);
    return `<div class="card pad" style="min-width:150px;flex:1;${d===today?'outline:2px solid var(--brand)':''}">
      <div class="small" style="font-weight:600">${dnames[i]} ${d.slice(8,10)}/${d.slice(5,7)}</div>
      ${list.map(o=>`<div class="clk" data-ord="${o.id}" style="border:1px solid var(--line);border-radius:6px;padding:4px 6px;margin:4px 0">
        <b class="small">${new Date(o.scheduled_start).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</b>
        <div class="small" style="overflow:hidden;text-overflow:ellipsis">${esc(o.title)}</div>
        <div class="small mut">${o.assignee?esc(o.assignee.split('@')[0]):'<span style="color:var(--bad)">—</span>'}</div></div>`).join('')||'<div class="small mut" style="margin-top:6px">—</div>'}
    </div>`; }).join('');
  const toggle=`<span class="row" style="gap:4px"><button class="btn ${mode==='day'?'':'ghost'} small" onclick="(function(){$('#view')._dmode='day';route();})()">Giorno</button><button class="btn ${mode==='week'?'':'ghost'} small" onclick="(function(){$('#view')._dmode='week';route();})()">Settimana</button></span>`;
  v.innerHTML=`<div class="page-h"><div><h1>Agenda tecnici</h1><div class="mut">dispatch degli interventi</div></div>
    <span class="row" style="gap:8px">${toggle}<input type="date" value="${day}" onchange="(function(e){$('#view')._day=e;route();})(this.value)"></span></div>
  <div class="card" style="margin-bottom:14px"><div class="card-h"><h2>Da assegnare (${unassigned.length})</h2></div><div style="padding:0 12px 12px">${unRows}</div></div>
  ${mode==='week'
    ? `<h2 style="margin:4px 0 8px">Settimana ${weekDays[0].slice(8,10)}/${weekDays[0].slice(5,7)} – ${weekDays[6].slice(8,10)}/${weekDays[6].slice(5,7)}</h2>
       <div class="row" style="gap:8px;flex-wrap:nowrap;overflow-x:auto;align-items:flex-start">${weekCols}</div>`
    : `<h2 style="margin:4px 0 8px">Carico del ${day}</h2>
       <div class="row" style="gap:12px;flex-wrap:wrap;align-items:flex-start">${lanes||'<div class="small mut">Nessun tecnico.</div>'}</div>`}`;
  bindRows(v);
}

// firma su canvas (mouse + touch)
let _sigDraw=false;
function ordSigInit(){ const c=$('#ordSig'); if(!c)return; const ctx=c.getContext('2d'); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#111';
  const pos=e=>{ const r=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return [ (t.clientX-r.left)*(c.width/r.width), (t.clientY-r.top)*(c.height/r.height) ]; };
  const down=e=>{ _sigDraw=true; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); e.preventDefault(); };
  const move=e=>{ if(!_sigDraw)return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); e.preventDefault(); };
  const up=()=>{ _sigDraw=false; };
  c.onmousedown=down; c.onmousemove=move; window.addEventListener('mouseup',up);
  c.ontouchstart=down; c.ontouchmove=move; c.ontouchend=up;
}
function ordSigClear(){ const c=$('#ordSig'); if(c)c.getContext('2d').clearRect(0,0,c.width,c.height); }
async function ordSigSave(id){ const c=$('#ordSig'); if(!c)return;
  c.toBlob(async(blob)=>{ if(!blob){ toast('Firma vuota','bad'); return; }
    try{ const res=await fetch('/api/orders/'+id+'/attachments?'+new URLSearchParams({kind:'signature',filename:'firma.png'}).toString(),{method:'POST',credentials:'include',
        headers:{'x-tenant-slug':store.slug,'x-csrf-token':csrfToken(),'content-type':'image/png'},body:blob});
      if(!res.ok) throw new Error('HTTP '+res.status); toast('Firma salvata','ok'); ordSigClear(); ordAttLoad(id);
    }catch(e){ toast(e.message,'bad'); } }, 'image/png');
}

// Schema-driven config: fetch the module's tools, render a form per field type.
async function openModuleConfig(code,name){
  let tools; try{ tools=await api('/modules/'+code+'/tools'); }
  catch(e){ drawer(esc(name), `<div class="small" style="color:var(--bad)">${esc(e.message)}</div>`); return; }
  if(!tools.length){ drawer(esc(name), '<div class="small mut">Nessuno strumento configurabile disponibile per questo tenant.</div>'); return; }
  const body = tools.map(t=>{
    const fields=((t.schema&&t.schema.fields)||[]).map(f=>{
      const val=(t.config&&t.config[f.key]!==undefined)?t.config[f.key]:'';
      const id=`cf_${code}_${t.tool_code}_${f.key}`;
      let input;
      if(f.type==='enum'){ input=`<select id="${id}" ${t.editable?'':'disabled'}>${(f.options||[]).map(o=>`<option ${o==val?'selected':''}>${esc(o)}</option>`).join('')}</select>`; }
      else if(f.type==='int'){ input=`<input id="${id}" type="number" value="${esc(String(val))}" ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} ${t.editable?'':'disabled'}>`; }
      else { input=`<input id="${id}" value="${esc(String(val))}" ${t.editable?'':'disabled'}>`; }
      return `<label class="small mut" style="display:block;margin-top:8px">${esc(f.label||f.key)}${f.min!=null||f.max!=null?` <span class="tag">${f.min??''}–${f.max??''}</span>`:''}<div style="margin-top:3px">${input}</div></label>`;
    }).join('');
    const save=t.editable?`<button class="btn" style="margin-top:10px" onclick="saveToolConfig('${esc(code)}','${esc(t.tool_code)}',this)">Salva</button>`:'<div class="small mut" style="margin-top:8px">sola lettura</div>';
    return `<div class="card pad" data-tool="${esc(t.tool_code)}" style="margin-bottom:12px"><b>${esc(t.name)}</b>
      <div class="small mut">${esc(t.description||'')}</div>${fields}
      <div class="cfg-msg small" style="margin-top:6px"></div>${save}</div>`;
  }).join('');
  drawer(esc(name)+' · strumenti', body);
}
async function saveToolConfig(code,tool,btn){
  const card=btn.closest('[data-tool]'); const cfg={};
  card.querySelectorAll('input,select').forEach(i=>{
    const key=i.id.split('_').slice(3).join('_');
    cfg[key]= i.type==='number' ? Number(i.value) : i.value;
  });
  const msg=card.querySelector('.cfg-msg'); msg.textContent='…'; msg.style.color='var(--mut)';
  try{ await api('/modules/'+code+'/tools/'+tool,{method:'POST',body:JSON.stringify({config:cfg})});
    msg.textContent='Salvato'; msg.style.color='var(--ok,green)';
    if(code==='traccar'&&tool==='alarm_map'){ await loadCtx(); rebuildNav(); } }
  catch(e){ msg.textContent=e.message; msg.style.color='var(--bad)'; }
}

// Testo ricercabile (full-text) di un dispositivo: unisce tutte le colonne mostrate + sinonimi utili.
function devHay(d){
  const prov={in_attesa_primo_fix:'attesa primo fix',traccar_registrato:'registrato',configurato:'configurato',attivo:'attivo'};
  const parts=[d.external_id, d.manufacturer, d.model_name, d.model_code, (!d.model_code?'generico':''),
    d.label, d.asset_name, d.user_email, (d.capabilities||[]).join(' '), d.last_etype,
    d.prov_step, (prov[d.prov_step]||''), (d.enabled?'attivo':'off disattivato'),
    d.last_seen?new Date(d.last_seen).toLocaleString('it-IT'):'mai'];
  return parts.filter(Boolean).join(' ').toLowerCase();
}
// Filtro full-text: ogni token deve comparire (AND). Aggiorna il conteggio e lo stato vuoto.
function devFilter(q){
  q=(q||'').trim().toLowerCase(); const toks=q.split(/\s+/).filter(Boolean);
  let n=0, tot=0;
  $$('#devTable tbody tr[data-hay]').forEach(r=>{ tot++; const ok=toks.every(t=>r.dataset.hay.includes(t)); r.hidden=!ok; if(ok)n++; });
  const c=$('#devCount'); if(c) c.textContent = toks.length ? (n+' '+t('pager_of','di')+' '+tot) : (tot+' '+t('dev_count','dispositivi'));
  const e=$('#devEmpty'); if(e) e.hidden = !(tot>0 && n===0);
}

function fmtNum(x){ return (Math.round(x*10)/10).toString(); }
let _sparkId=0;
function spark(series,color){ if(!series||series.length<2)return'';
  const vs=series.map(p=>typeof p.v==='number'?p.v:parseFloat(p.v)).filter(x=>!isNaN(x)); if(vs.length<2)return'';
  const c=color||'var(--brand)'; const mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1,W=220,H=40,id='sg'+(++_sparkId);
  const xy=vs.map((y,i)=>[((i/(vs.length-1))*W),(H-4-((y-mn)/rg)*(H-8))]);
  const line=xy.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  const area=`M0,${H} `+xy.map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')+` L${W},${H} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="40" preserveAspectRatio="none" style="margin-top:8px;display:block">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity="0.28"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
// Gauge radiale (semicerchio) stile cruscotto IoT: traccia + arco valore + tacca soglia.
function arcGauge(w,num,col){
  const min=w.min,max=w.max,thr=w.threshold; const n=num==null?0:Math.max(0,Math.min(1,(num-min)/((max-min)||1)));
  const cx=95,cy=98,r=74; const pt=(f,rr)=>{const a=Math.PI*(1-f);return [cx+(rr||r)*Math.cos(a),cy-(rr||r)*Math.sin(a)];};
  const arc=(f0,f1)=>{const steps=Math.max(1,Math.round(Math.abs(f1-f0)*54));let d='';for(let i=0;i<=steps;i++){const f=f0+(f1-f0)*i/steps;const p=pt(f);d+=(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1);}return d;};
  let thrMark=''; if(thr!=null){const tf=Math.max(0,Math.min(1,(thr-min)/((max-min)||1)));const a=pt(tf,r-12),b=pt(tf,r+4);thrMark=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="var(--mut)" stroke-width="2.5"/>`;}
  return `<svg viewBox="0 0 190 112" width="100%" height="118" style="display:block">
    <path d="${arc(0,1)}" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round"/>
    ${num!=null?`<path d="${arc(0,n)}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"/>`:''}
    ${thrMark}
    <text x="95" y="90" text-anchor="middle" font-size="30" font-weight="800" fill="${col}">${num==null?'—':fmtNum(num)}</text>
    <text x="95" y="107" text-anchor="middle" font-size="12" fill="var(--mut)">${esc(w.unit||'')}</text></svg>`;
}
const DASH_CARD='background:var(--surface,var(--card,#fff));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh-sm,0 1px 2px rgba(0,0,0,.05))';

    return `<div style="${DASH_CARD}">${head}
      <div style="display:flex;align-items:center;gap:10px;margin-top:8px"><div style="width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:${on?'var(--bad)':'var(--ok)'};color:#fff">${v==null?'·':(on?'!':'✓')}</div>

  }
  const num=(typeof v==='number')?v:(v!=null&&!isNaN(parseFloat(v))?parseFloat(v):null);
  const min=w.min, max=w.max, thr=w.threshold;
  const tripped = num!=null&&thr!=null && ({'>=':num>=thr,'>':num>thr,'<=':num<=thr,'<':num<thr}[w.op]||false);

    <div style="font-size:30px;font-weight:800;color:var(--brand);margin:2px 0">${num==null?'<span class="mut">—</span>':fmtNum(num)}</div>${spark(w.series,'var(--brand)')}</div>`; }

function profNew(){ simpleCreateDrawer('Nuovo profilo di protezione','Nome profilo','', v=>api('/safety/profiles',{method:'POST',body:JSON.stringify({name:v})})); }
async function profSave(id,btn){
  const box=document.querySelector(`[data-prof="${id}"]`); if(!box)return;
  const m=box.querySelector('.prof-msg'); if(m){m.textContent='…';m.style.color='var(--mut)';}
  const g=box.querySelector('[data-f="group"]').value;
  const chk=box.querySelector('[data-f="checkin"]').value;
  const triggers={}; box.querySelectorAll('[data-trg]').forEach(c=>triggers[c.dataset.trg]=c.checked);
  const body={ name:box.querySelector('[data-f="name"]').value.trim(), descr:box.querySelector('[data-f="descr"]').value.trim(),
    escalation_group_id:g||null, triggers, checkin_minutes:chk?parseInt(chk,10):null,
    enabled:box.querySelector('[data-f="enabled"]').checked };
  try{ await api('/safety/profiles/'+id,{method:'PUT',body:JSON.stringify(body)}); toast('Profilo salvato','ok'); if(m){m.textContent='Salvato';m.style.color='var(--ok)';} }
  catch(e){ toast(e.message,'bad'); if(m){m.textContent=e.message;m.style.color='var(--bad)';} }
}
async function profDel(id){
  if(!await askConfirm('Eliminare questo profilo di protezione?'))return;
  try{ await api('/safety/profiles/'+id,{method:'DELETE'}); toast('Profilo eliminato','ok'); route(); }
  catch(e){ toast(e.message,'bad'); }
}
async function profAdd(id){
  const uid=$('#pSel_'+id).value; if(!uid)return;
  try{ await api('/safety/profiles/'+id+'/members',{method:'POST',body:JSON.stringify({user_id:uid})}); toast('Lavoratore assegnato','ok'); route(); }
  catch(e){ toast(e.message,'bad'); }
}
async function profRm(id,uid){
  try{ await api('/safety/profiles/'+id+'/members/'+uid,{method:'DELETE'}); toast('Lavoratore rimosso','ok'); route(); }
  catch(e){ toast(e.message,'bad'); }
}

}

// Tab della pagina Escalation: mostra un pannello per volta (handler/ID invariati).
function escTab(k){
  $$('#escTabs .seg-btn').forEach(b=>b.classList.toggle('on', b.dataset.et===k));
  $$('.esc-tab').forEach(p=>{ p.hidden = p.dataset.et!==k; });
}
// Sotto-tab per-gruppo (Copertura/Policy/Label/Playbook/Assegnazioni/Turni): un pannello per
// volta; ri-click chiude. Lazy-load dei pannelli che lo richiedono.
function grpSub(gid,k){
  const sel='[data-g="'+gid+'"]';
  const strip=document.querySelector('.gsub'+sel);
  const btn=strip?strip.querySelector('.gsub-b[data-k="'+k+'"]'):null;
  const already=btn&&btn.classList.contains('on');
  if(strip) strip.querySelectorAll('.gsub-b').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.gsub-p'+sel).forEach(p=>{ p.hidden=true; });
  if(already) return;
  if(btn) btn.classList.add('on');
  const p=document.querySelector('.gsub-p'+sel+'[data-k="'+k+'"]'); if(p)p.hidden=false;
  if(k==='policy')grpPolicyLoad(gid);
  else if(k==='playbook')grpHandoffLoad(gid);
  else if(k==='assign')grpAssignLoad(gid);
  else if(k==='shifts')grpShiftsLoad(gid);
}

async function grpShiftsLoad(gid){ const out=$('#shf_'+gid); out.innerHTML='<span class="mut">Calcolo…</span>';

function grpShiftsRender(gid){
  const S=window._shf[gid]||{shifts:[],view:'list',user:''};
  let shifts=S.shifts; if(S.user) shifts=shifts.filter(s=>(s.oncall||[]).includes(S.user));
  const users=[...new Set(S.shifts.flatMap(s=>s.oncall||[]))].sort();
  const ctrl=`<div class="row small" style="gap:6px;align-items:center;margin-bottom:6px">
    <button class="btn ghost small" onclick="grpShiftsView('${gid}','list')" ${S.view==='list'?'style="font-weight:700"':''}>lista</button>
    <button class="btn ghost small" onclick="grpShiftsView('${gid}','cal')" ${S.view==='cal'?'style="font-weight:700"':''}>calendario</button>
    <select class="small" onchange="grpShiftsUser('${gid}',this.value)"><option value="">tutti</option>${users.map(u=>`<option value="${u}" ${S.user===u?'selected':''}>${esc(u)}</option>`).join('')}</select></div>`;
  let body;
  if(S.view==='cal'){ body=grpShiftsCalendar(shifts); }
  else { body=shifts.map(s=>`<div class="row small" style="gap:6px;border-bottom:1px solid var(--line);padding:3px 0">
      <span style="min-width:200px">${new Date(s.start).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} → ${new Date(s.end).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
      <span>${(s.oncall||[]).map(esc).join(', ')}</span></div>`).join('')||'<div class="mut">nessun turno</div>'; }
  $('#shf_'+gid).innerHTML=ctrl+body;
}
function grpShiftsView(gid,v){ (window._shf[gid]=window._shf[gid]||{}).view=v; grpShiftsRender(gid); }
function grpShiftsUser(gid,u){ (window._shf[gid]=window._shf[gid]||{}).user=u; grpShiftsRender(gid); }
function grpShiftsCalendar(shifts){
  // nomi on-call per giorno (chi è reperibile in quel giorno)
  const byDay={};
  shifts.forEach(s=>{ let d=new Date(s.start); d.setHours(0,0,0,0); const end=new Date(s.end);
    for(let t=new Date(d); t<end; t.setDate(t.getDate()+1)){ const k=t.toISOString().slice(0,10); byDay[k]=byDay[k]||new Set(); (s.oncall||[]).forEach(e=>byDay[k].add(e)); } });
  const days=Object.keys(byDay).sort(); if(!days.length) return '<div class="mut">nessun turno</div>';
  // griglia a settimane (lun-dom) dal primo all'ultimo giorno
  const first=new Date(days[0]+'T00:00:00'); const last=new Date(days[days.length-1]+'T00:00:00');
  const startGrid=new Date(first); startGrid.setDate(first.getDate()-((first.getDay()+6)%7)); // lunedì
  let html='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">'+['Lu','Ma','Me','Gi','Ve','Sa','Do'].map(d=>`<div class="small mut" style="text-align:center">${d}</div>`).join('');
  for(let t=new Date(startGrid); t<=last; t.setDate(t.getDate()+1)){ const k=t.toISOString().slice(0,10); const names=byDay[k]?[...byDay[k]]:[];
    const inrange=t>=first; html+=`<div style="border:1px solid var(--line);border-radius:6px;padding:3px;min-height:48px;${inrange?'':'opacity:.4'}">
      <div class="small mut">${t.getDate()}</div><div style="font-size:11px;line-height:1.2">${names.map(n=>esc(n.split('@')[0])).join('<br>')}</div></div>`; }
  return html+'</div>';
}

window._pol={}; // gid -> {steps:[{delay_min,channel}], repeat}
const POL_CH=[['sms','SMS'],['voice','Voce'],['email','Email'],['slack','Slack']];
const POL_TGT=[['oncall','on-call del gruppo'],['group','altro gruppo'],['user','persona'],['slack','canale Slack']];
async function grpPolicyLoad(gid){
  try{ const r=await api('/groups/'+gid+'/policy');

    grpPolicyRender(gid);
  }catch(e){ $('#pol_'+gid).innerHTML='<span style="color:var(--bad)">'+esc(e.message)+'</span>'; }
}
function polTargetPicker(gid,i,s){
  const P=`window._pol['${gid}'].steps[${i}]`;
  const kinds=`<select class="small" onchange="${P}.target_kind=this.value;grpPolicyRender('${gid}')">${POL_TGT.map(t=>`<option value="${t[0]}" ${s.target_kind===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select>`;
  let extra='';
  if(s.target_kind==='group') extra=`<select class="small" onchange="${P}.target_group_id=this.value"><option value="">—</option>${(window._groupsCache||[]).map(g=>`<option value="${g.id}" ${s.target_group_id===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select>`;
  else if(s.target_kind==='user') extra=`<select class="small" onchange="${P}.target_user_id=this.value"><option value="">—</option>${(window._users||[]).map(u=>`<option value="${u.id}" ${s.target_user_id===u.id?'selected':''}>${esc(u.email)}</option>`).join('')}</select>`;
  else if(s.target_kind==='slack') extra=`<input class="small" placeholder="ID canale Slack" value="${esc(s.target_slack||'')}" style="width:120px" onchange="${P}.target_slack=this.value">`;
  return kinds+' '+extra;
}
function grpPolicyRender(gid){
  const p=window._pol[gid]||{steps:[],repeat:0};
  const rows=p.steps.map((s,i)=>`<div class="row small" style="gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap">
    <b>#${i+1}</b>
    <select class="small" onchange="window._pol['${gid}'].steps[${i}].channel=this.value">${POL_CH.map(c=>`<option value="${c[0]}" ${s.channel===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select>
    → ${polTargetPicker(gid,i,s)}
    attesa <input type="number" min="0" max="1440" value="${s.delay_min}" style="width:56px" onchange="window._pol['${gid}'].steps[${i}].delay_min=+this.value"> min
    <button class="btn-ico btn ghost" title="su" onclick="grpPolMove('${gid}',${i},-1)">↑</button>
    <button class="btn-ico btn ghost" title="giù" onclick="grpPolMove('${gid}',${i},1)">↓</button>
    <button class="btn-ico btn ghost" onclick="grpPolRm('${gid}',${i})">${ICON.x}</button></div>`).join('')
    ||'<div class="small mut">Nessuno step personalizzato → usa la ladder derivata (SMS→Voce) verso l\'on-call del gruppo.</div>';
  $('#pol_'+gid).innerHTML=`${rows}
    <div class="row small" style="gap:6px;align-items:center;margin-top:6px">
      <button class="btn ghost small" onclick="grpPolAdd('${gid}')">+ step</button>
      ripeti <input type="number" min="0" max="10" value="${p.repeat||0}" style="width:50px" onchange="window._pol['${gid}'].repeat=+this.value"> volte
      <button class="btn small" onclick="grpPolSave('${gid}')">Salva policy</button></div>
    <div class="small faint" style="margin-top:3px">Ogni step notifica il <b>target</b> scelto (on-call del gruppo, un altro gruppo, una persona o un canale Slack) sul canale indicato, poi aspetta i minuti prima del successivo. Dopo l'ultimo, ripete N volte finché non c'è presa in carico.</div>`;
}
function grpPolAdd(gid){ (window._pol[gid]=window._pol[gid]||{steps:[],repeat:0}).steps.push({delay_min:5,channel:'sms',target_kind:'oncall',target_group_id:'',target_user_id:'',target_slack:''}); grpPolicyRender(gid); }
function grpPolRm(gid,i){ window._pol[gid].steps.splice(i,1); grpPolicyRender(gid); }
function grpPolMove(gid,i,d){ const a=window._pol[gid].steps; const j=i+d; if(j<0||j>=a.length)return; [a[i],a[j]]=[a[j],a[i]]; grpPolicyRender(gid); }

function auQuery(extra){
  const qs=new URLSearchParams();
  const q=$('#auQ')?.value.trim(), act=$('#auAction')?.value, actor=$('#auActor')?.value.trim();
  const since=$('#auSince')?.value, until=$('#auUntil')?.value, lim=$('#auLimit')?.value||AU_STATE.limit;
  AU_STATE.limit=parseInt(lim);
  if(q)qs.set('q',q); if(act)qs.set('action',act); if(actor)qs.set('actor',actor);
  if(since)qs.set('since',since+'T00:00:00Z'); if(until)qs.set('until',until+'T23:59:59Z');
  qs.set('limit',AU_STATE.limit); qs.set('offset',AU_STATE.offset);
  return qs;
}
function renderAuPager(a){
  if(!a||!a.total) return '';
  const from=a.total?a.offset+1:0, to=a.offset+a.count;
  const prevD=a.offset<=0?'disabled':'', nextD=(a.offset+a.count>=a.total)?'disabled':'';
  return `<button class="btn ghost small" ${prevD} onclick="auditPage(-1)">← prec</button>
    <span class="small mut">${from}–${to} di ${a.total}</span>
    <button class="btn ghost small" ${nextD} onclick="auditPage(1)">succ →</button>`;
}
function renderAudit(a){
  if(!a) return '<div class="small mut">non disponibile</div>';
  const rows=a.rows||[];
  return `<table class="table"><thead><tr><th>Quando</th><th>Attore</th><th>Azione</th><th>Dettaglio</th></tr></thead>
  <tbody>${rows.map(r=>`<tr><td class="small">${fmtTime(r.at)}</td><td class="small">${esc(r.actor)}</td>
    <td><span class="chip">${esc(r.action)}</span></td>
    <td class="small mut" style="max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(JSON.stringify(r.detail||{}))}">${esc(JSON.stringify(r.detail||{}))}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">nessuna voce</td></tr>'}</tbody></table>`;
}
async function auditReload(resetOffset=true){
  if(resetOffset) AU_STATE.offset=0;
  try{ const a=await api('/audit-log?'+auQuery().toString());
    $('#auBox').innerHTML=renderAudit(a); const p=$('#auPager'); if(p)p.innerHTML=renderAuPager(a);
  }catch(e){ toast(e.message,'bad'); }
}
function auditPage(dir){
  const next=AU_STATE.offset+dir*AU_STATE.limit;
  AU_STATE.offset=Math.max(0,next); auditReload(false);
}
function auditClear(){
  ['auQ','auActor','auSince','auUntil'].forEach(id=>{const e=$('#'+id);if(e)e.value='';});
  const a=$('#auAction'); if(a)a.value=''; AU_STATE.offset=0; auditReload();
}
async function auditExport(){
  try{
    const qs=auQuery(); qs.delete('limit'); qs.delete('offset');
    const r=await fetch('/api/audit-log/export?'+qs.toString(),{credentials:'include',headers:{'x-tenant-slug':store.slug}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const blob=await r.blob(); const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download='audit-log.csv'; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('CSV scaricato','ok');
  }catch(e){ toast(e.message,'bad'); }
}
function gdQuery(){
  const qs=new URLSearchParams();

}
function renderGdPager(a){

async function gdReload(resetOffset=true){

function gdPage(dir){

function gdClear(){

async function crForm(r){

  if(!cat.length){ cat=Object.keys(CAP_LABELS).map(code=>({code})); }
  const cur=new Set(r.capabilities||[]);
  const capRow=c=>{ const code=c.code; const checked=cur.has(code)?'checked':'';
    const warn = code==='admin' ? ' style="color:var(--bad)"' : '';
    return `<label class="row" style="gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:8px">

    +sec('Moduli non attivi (assegnati in precedenza)',modOff,'Questi permessi restano perché già assegnati, ma il relativo modulo non è attivo.');

let STMAP=null, STMARK=null;
function siteForm(s){ s=s||{};
  drawer(s.id?'Sede · '+esc(s.name):'Nuova sede', `<div class="col" style="gap:10px">
    <label class="small mut">Nome<input id="stName" value="${esc(s.name||'')}"></label>

    <div class="small mut">Trascina il segnaposto per correggere la posizione esatta (cancello, ingresso cantiere).</div>
    <div class="row" style="gap:8px"><label class="small mut grow">Lat<input id="stLat" type="number" step="any" value="${s.lat!=null?s.lat:''}" oninput="siteSyncMarker()"></label>

    <label class="small mut">Indicazioni d'accesso (visibili solo agli autorizzati)<textarea id="stAcc" style="width:100%;height:60px" placeholder="es. chiave in portineria, codice cancello…">${esc(s.access_notes||'')}</textarea></label>
    <button class="btn" onclick="siteSave('${s.id||''}')">Salva</button><div class="cfg-msg small"></div></div>`);
  setTimeout(siteMapInit,60);

function siteMapInit(){
  const el=document.getElementById('stMap'); if(!el||typeof L==='undefined')return;
  const lat=parseFloat($('#stLat').value), lon=parseFloat($('#stLon').value);
  const has=!isNaN(lat)&&!isNaN(lon);
  STMAP=L.map(el,{zoomControl:true}).setView(has?[lat,lon]:[41.9,12.5], has?16:5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(STMAP);
  STMARK=L.marker(has?[lat,lon]:[41.9,12.5],{draggable:true}).addTo(STMAP);
  STMARK.on('dragend',()=>{ const p=STMARK.getLatLng(); $('#stLat').value=p.lat.toFixed(6); $('#stLon').value=p.lng.toFixed(6); });
  // clic sulla mappa = posiziona
  STMAP.on('click',e=>{ STMARK.setLatLng(e.latlng); $('#stLat').value=e.latlng.lat.toFixed(6); $('#stLon').value=e.latlng.lng.toFixed(6); });
  setTimeout(()=>STMAP&&STMAP.invalidateSize(),120);
}
function siteSyncMarker(){ const lat=parseFloat($('#stLat').value), lon=parseFloat($('#stLon').value);
  if(STMAP&&STMARK&&!isNaN(lat)&&!isNaN(lon)){ STMARK.setLatLng([lat,lon]); STMAP.setView([lat,lon],16); } }
// Geocodifica LATO BROWSER (client -> Nominatim/OSM): il server YW resta self-contained.
async function siteGeocode(){
  const m=$('.cfg-msg'); const q=$('#stAddr').value.trim();
  if(!q){ if(m){m.textContent='inserisci prima l\'indirizzo';m.style.color='var(--bad)';} return; }
  if(m){ m.textContent='cerco l\'indirizzo…'; m.style.color=''; }
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});
    const j=await r.json();
    if(!j.length){ if(m){m.textContent='indirizzo non trovato: trascina il segnaposto a mano';m.style.color='var(--bad)';} return; }
    const lat=parseFloat(j[0].lat), lon=parseFloat(j[0].lon);
    $('#stLat').value=lat.toFixed(6); $('#stLon').value=lon.toFixed(6);
    if(STMAP&&STMARK){ STMARK.setLatLng([lat,lon]); STMAP.setView([lat,lon],17); }
    if(m){ m.textContent='posizione trovata ✓ — controlla e correggi col segnaposto se serve'; m.style.color='var(--ok,green)'; }
  }catch(e){ if(m){m.textContent='geocodifica non disponibile: inserisci lat/lon o trascina il segnaposto';m.style.color='var(--bad)';} }
}

async function spSave(){
  const m=$('.cfg-msg');
  const day=$('#spD').value, t1=$('#spS1').value, t2=$('#spE1').value;
  if(!$('#spU').value||!day||!t1||!t2){m.textContent='compila lavoratore, giorno e orari';m.style.color='var(--bad)';return;}
  // turno notturno: se "Alle" <= "Dalle" la fine è il giorno successivo
  let endDay=day; if(t2<=t1){ const d=new Date(day+'T00:00'); d.setDate(d.getDate()+1); endDay=d.toISOString().slice(0,10); }
  const b={user_id:$('#spU').value,site_id:$('#spS').value||null,starts_at:toISO(day+'T'+t1),ends_at:toISO(endDay+'T'+t2),note:$('#spN').value||null,required_qualification:($('#spQ')&&$('#spQ').value)||null,work_order_id:($('#spW2')&&$('#spW2').value)||null,commessa_id:($('#spCM')&&$('#spCM').value)||null};
  if(!b.starts_at||!b.ends_at){m.textContent='orari non validi';m.style.color='var(--bad)';return;}
  try{ const r=await api('/shift-plans',{method:'POST',body:JSON.stringify(b)});
    const w=(r&&r.warnings)||[];
    toast('Turno pianificato'+(w.length?' · '+w.length+' avviso':''),'ok');
    if(w.length) toast(w.map(x=>x.message).join(' · '),'warn');
    closeDrawer(); route();
  }catch(e){
    // conflitto duro (es. sovrapposizione): offri di forzare consapevolmente
    if(/Forza/.test(e.message)){
      if(await askConfirm(e.message+'\n\nVuoi pianificarlo comunque?')){
        try{ await api('/shift-plans',{method:'POST',body:JSON.stringify(b),headers:{'x-force':'1'}}); toast('Turno pianificato (forzato)','ok'); closeDrawer(); route(); }
        catch(e2){ m.textContent=e2.message; m.style.color='var(--bad)'; }
        return;
      }
    }
    m.textContent=e.message;m.style.color='var(--bad)';
  }
}

function aiBubble(html,me){ const log=$('#aiLog');
  log.append(el(`<div style="align-self:${me?'flex-end':'flex-start'};max-width:90%;background:${me?'var(--brand-soft)':'var(--surface2)'};
    border:1px solid var(--line);border-radius:12px;padding:10px 12px">${html}</div>`));
  log.scrollTop=log.scrollHeight; }
async function askAI(){
  const q=$('#aiQ').value.trim(); if(!q)return; $('#aiQ').value='';
  aiBubble(esc(q),true);
  const wait=el('<div class="small mut" style="align-self:flex-start">…</div>'); $('#aiLog').append(wait);
  try{ const r=await api('/assistant',{method:'POST',body:JSON.stringify({q})}); wait.remove();
    const src=(r.sources||[]).length?`<div class="small mut" style="margin-top:6px">Fonti: ${r.sources.map(s=>`<span class="tag">${esc(s.type)}${s.site?' · '+esc(s.site):''}${s.title?' · '+esc(s.title):''}</span>`).join(' ')}</div>`:'';
    const per=r.period?`<span class="tag">${esc(r.period)}</span>`:'';
    aiBubble(`${esc(r.answer)}<div class="small mut" style="margin-top:6px">${per} <span class="tag sim">${esc(r.provider)}</span></div>${src}`,false);
  }catch(e){ wait.remove(); aiBubble('<span style="color:var(--bad)">'+esc(e.message)+'</span>',false); }
}

// ---------------- drawer ----------------
function drawer(title,html){ $('#drawer').innerHTML=`<div class="dh"><h2>${title}</h2>
  <button class="btn-ico btn ghost" onclick="closeDrawer()">${ICON.x}</button></div><div class="db">${html}</div>`;
  $('#drawer').classList.add('open'); $('#scrim').classList.add('open'); $('#scrim').onclick=closeDrawer; }
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); }
// Conferma non-bloccante (window.confirm è bloccato in alcune webview): modale con Promise.
function askConfirm(msg){ return new Promise(res=>{
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)';
  m.innerHTML=`<div class="card pad" style="max-width:430px;width:92%"><div style="margin-bottom:14px">${esc(msg)}</div>
    <div class="row" style="gap:8px;justify-content:flex-end"><button class="btn ghost" data-no>Annulla</button><button class="btn" data-yes>Conferma</button></div></div>`;
  const done=v=>{ try{m.remove();}catch(e){} res(v); };
  m.addEventListener('click',e=>{ if(e.target===m) done(false); });
  m.querySelector('[data-no]').onclick=()=>done(false);
  m.querySelector('[data-yes]').onclick=()=>done(true);
  document.body.appendChild(m); const y=m.querySelector('[data-yes]'); if(y)y.focus();
}); }
// Prompt non-bloccante con un valore iniziale (per rinominare). Ritorna stringa o null.
function askPrompt(msg,val){ return new Promise(res=>{
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)';
  m.innerHTML=`<div class="card pad" style="max-width:430px;width:92%"><div style="margin-bottom:10px">${esc(msg)}</div>
    <input id="_apIn" value="${esc(val||'')}" style="width:100%;margin-bottom:12px">
    <div class="row" style="gap:8px;justify-content:flex-end"><button class="btn ghost" data-no>Annulla</button><button class="btn" data-yes>OK</button></div></div>`;
  const done=v=>{ try{m.remove();}catch(e){} res(v); };
  m.addEventListener('click',e=>{ if(e.target===m) done(null); });
  m.querySelector('[data-no]').onclick=()=>done(null);
  const inp=m.querySelector('#_apIn');
  m.querySelector('[data-yes]').onclick=()=>done(inp.value);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')done(inp.value); if(e.key==='Escape')done(null); });
  document.body.appendChild(m); inp.focus(); inp.select();
}); }
</script>
