<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="icon" href="/youworkforce.webp" type="image/webp">

<div id="root"></div>
<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer"></aside>
<script src="/app.js"></script>
<script>
let ME=null, SSE=null, CACHE={}, ACTIVE_MODS=new Set(), UI_FEAT={map_outdoor:true,map_indoor:false}, AI_FEAT={};
const can = r => ME && r.includes(ME.role);
// mod = modulo/i richiesti: la voce appare solo se ALMENO UNO è attivo sul tenant.
const DEVICE_MODS=['loneworker','traccar','iot','thingsboard'];
// grp: sezione nav (op=Operatività, work=Lavoro sul campo, cfg=Configurazione)
const NAV = [
  {k:'dashboard', t:'Dashboard', ico:'home', roles:null, grp:'op'},
  // --- Sicurezza Lavoratore (perimetro man-down/SOS): operatività allarmi + config del perimetro ---
  {k:'centrale',  t:'Centrale allarmi', ico:'alert', roles:['operatore','tenant_admin','auditor'], mod:['loneworker','traccar','iot','thingsboard'], grp:'safety'},
  {k:'miei-allarmi',t:'I miei allarmi', ico:'alert', roles:['reperibile','responsabile'], mod:['loneworker','traccar','iot','thingsboard'], grp:'safety'},
  {k:'mappa',     t:'Mappa allarmi', ico:'home', roles:['operatore','tenant_admin','auditor'], mod:DEVICE_MODS, feat:'map_outdoor', grp:'safety'},
  {k:'piantine',  t:'Piantine', ico:'shield', roles:['operatore','tenant_admin','auditor'], mod:DEVICE_MODS, feat:'map_indoor', grp:'safety'},
  // Mappa dispositivi: i device (es. Teltonika GH-5200) generano allarmi E sono asset di campo,
  // quindi la voce compare in ENTRAMBI i gruppi (Sicurezza lavoratore + Lavoro sul campo).
  {k:'mappa-dispositivi', t:'Mappa dispositivi', ico:'home', roles:['operatore','tenant_admin','auditor'], mod:DEVICE_MODS, feat:'map_outdoor', grps:['safety','work']},
  {k:'report',    t:'Report', ico:'receipt', roles:['operatore','tenant_admin','auditor','responsabile'], mod:['loneworker','traccar'], grp:'safety'},
  {k:'dispositivi',t:'Dispositivi & App', ico:'shield', roles:['tenant_admin'], mod:DEVICE_MODS, grp:'safety'},
  {k:'trigger',   t:'Trigger di sicurezza', ico:'alert', roles:['tenant_admin'], mod:['loneworker'], grp:'safety'},
  {k:'profili',   t:'Profili di protezione', ico:'shield', roles:['tenant_admin'], mod:['loneworker'], grp:'safety'},
  {k:'gruppi',    t:'Escalation e reperibilità', ico:'users', roles:['tenant_admin'], mod:['loneworker','traccar','iot','thingsboard'], grp:'safety'},
  // --- Lavoro sul campo ---
  {k:'ordini',    t:'Ordini di lavoro', ico:'clipboard', roles:['pianificatore','tenant_admin','lavoratore','auditor'], mod:['interventi'], grp:'work'},
  {k:'ronde',     t:'Ronde', ico:'route', roles:['pianificatore','tenant_admin','lavoratore','auditor'], mod:['giri'], grp:'work'},
  {k:'consuntivi',t:'Consuntivi', ico:'receipt', roles:['lavoratore','responsabile','tenant_admin','auditor'], mod:['consuntivi'], grp:'work'},
  {k:'turni',     t:'Turni', ico:'clipboard', roles:['pianificatore','tenant_admin','lavoratore','reperibile','auditor'], mod:['workforce'], grp:'work'},
  {k:'agente',    t:'Agente AI', ico:'sliders', roles:['operatore','tenant_admin','pianificatore','responsabile','lavoratore'], mod:['assistant'], aiFeat:'agent', grp:'work'},
  // --- Configurazione generale (non specifica del perimetro sicurezza) ---
  {k:'connettori',t:'Connettori', ico:'sliders', roles:['tenant_admin'], mod:['traccar','thingsboard','goalert','iot'], grp:'cfg'},
  {k:'anagrafiche',t:'Utenti e sedi', ico:'receipt', roles:['tenant_admin'], grp:'cfg'},
  {k:'ai',        t:'AI · youworker.ai', ico:'sliders', roles:['tenant_admin'], mod:['assistant'], grp:'cfg'},
  {k:'moduli',    t:'Moduli', ico:'sliders', roles:['tenant_admin'], grp:'cfg'},
];
const NAV_GROUPS=[['op','Operatività'],['safety','Sicurezza Lavoratore'],['iot','IoT Dashboard'],['work','Lavoro sul campo'],['cfg','Configurazione']];
// Cruscotti IoT attivi (ambienti/casi d'uso applicati al tenant): voci di menu dinamiche sotto
// "IoT Dashboard". Se vuoto, il gruppo (e quindi il menu) non compare affatto.
let SCENARIOS=[];
function scenarioNavItems(){ return (SCENARIOS||[]).map(s=>({
  k:'scn_'+s.code, t:s.name, ico:'home', roles:['operatore','tenant_admin','auditor'], grp:'iot', scenario:s.code })); }
function allNav(){ return NAV.concat(scenarioNavItems()); }
// nav raggruppata: intestazioni di sezione, salta i gruppi vuoti dopo i filtri ruolo/modulo.
// ---- i18n (chrome): IT sorgente, EN opzionale. Le viste restano IT finché migrate. ----
const I18N={ en:{
  app_subtitle:"Client console", lang:"Language", logout:"Sign out",
  login_tenant:"Tenant", login_tenant_host:"(from domain)", login_email:"Email",
  login_password:"Password", login_signin:"Sign in", login_quick:"Quick demo access (password <b>demo</b>):",
  grp_op:"Operations", grp_safety:"Worker Safety", grp_iot:"IoT Dashboard", grp_work:"Field work", grp_cfg:"Configuration",
  "nav_dashboard":"Dashboard","nav_centrale":"Alarm center","nav_miei-allarmi":"My alarms",
  "nav_mappa":"Alarm map","nav_mappa-dispositivi":"Device map","nav_piantine":"Floor plans","nav_cruscotti":"IoT dashboards","nav_report":"Reports",
  "nav_ordini":"Work orders","nav_consuntivi":"Timesheets","nav_turni":"Shifts","nav_agente":"AI agent",
  "nav_dispositivi":"Devices & Apps","nav_trigger":"Safety triggers","nav_profili":"Protection profiles","nav_connettori":"Connectors","nav_gruppi":"Escalation & on-call",
  "nav_anagrafiche":"Users & sites","nav_ai":"AI · youworker.ai","nav_moduli":"Modules",
  // Centrale allarmi
  cen_title:"Alarm center", cen_tab_open:"Open", cen_tab_closed:"Closed", cen_tab_all:"All",
  cen_search:"🔎 Search: type, site, assignee, status, priority, correlation…",
  cen_ackall:"Acknowledge all", cen_closeall:"Close all",
  cen_empty:"No incidents in this view", cen_checkins:"Active check-ins",
  cen_incidents:"incidents", cen_checkins_n:"check-ins", cen_expired:"expired", cen_live:"live",
  col_type:"Type", col_site:"Site", col_assignee:"Assignee", col_status:"Status", col_priority:"Priority", col_correlation:"Correlation",
  col_worker:"Worker", col_due:"Due", pager_showing:"Showing", pager_of:"of", pager_page:"Page", pager_prev:"‹ Prev", pager_next:"Next ›",
  ck_none:"no active check-in",
  // Dispositivi
  dev_title:"Devices", dev_sub:"catalog, fleet", dev_add_guided:"+ Add (guided)", dev_add_manual:"manual",
  dev_search:"🔎 Search: external ID, model, label, assignee, capabilities, last contact, onboarding…",
  dev_count:"devices", dev_empty:"No devices. Use \"+ Add (guided)\".", dev_no_match:"No device matches the search.",
  col_extid:"External ID", col_model:"Model", col_label:"Label", col_caps:"Capabilities", col_lastseen:"Last contact", col_onboarding:"Onboarding",
  // Mappe
  map_from:"From", map_to:"To", map_type:"Type", map_all_critical:"All critical", map_refresh:"Refresh",
  gf_color:"Geofence area color", map_alarms_title:"Alarm map", map_devices_title:"Device map",
  alarms_n:"Alarms", none_period:"No alarm in the period.",
  // Piantine
  fp_floorplan:"Floor plan", fp_place:"Place on floor plan", fp_place_choose:"— choose beacon or device —",
  fp_place_btn:"📍 on the map", fp_config:"⚙ Configure indoor floor plan", fp_none:"— none —"
}};
let LANG='it';
try{ LANG=localStorage.getItem('yw_lang')|| (navigator.language||'it').slice(0,2); }catch(e){}
if(LANG!=='en') LANG='it';
function t(k, itFallback){ if(LANG==='en' && I18N.en[k]!=null) return I18N.en[k]; return itFallback!=null?itFallback:(I18N.it&&I18N.it[k])||k; }
function fmtDT(d){ try{ return new Date(d).toLocaleString(LANG==='en'?'en-GB':'it-IT'); }catch(e){ return ''+d; } }
function fmtD(d){ try{ return new Date(d).toLocaleDateString(LANG==='en'?'en-GB':'it-IT'); }catch(e){ return ''+d; } }
function setLang(l){ LANG=(l==='en')?'en':'it'; try{localStorage.setItem('yw_lang',LANG);}catch(e){} try{document.documentElement.lang=LANG;}catch(e){} location.reload(); }
function langSelect(){ return `<select class="small" onchange="setLang(this.value)" title="${t('lang','Lingua')}" style="width:auto">
  <option value="it" ${LANG==='it'?'selected':''}>IT</option><option value="en" ${LANG==='en'?'selected':''}>EN</option></select>`; }
try{ document.documentElement.lang=LANG; }catch(e){}
function navLabel(n){ return t('nav_'+n.k, n.t); }
function navHtml(){ const items=visibleNav(); let h='';
  for(const [g,label] of NAV_GROUPS){ const gi=items.filter(n=> n.grps ? n.grps.includes(g) : (n.grp||'op')===g); if(!gi.length)continue;
    h+=`<div class="nav-grp">${t('grp_'+g,label)}</div>`+gi.map(n=>`<a data-k="${n.k}"><span class="ico">${ICON[n.ico]}</span>${navLabel(n)}</a>`).join(''); }
  return h; }
const modOk = n => !n.mod || n.mod.some(m=>ACTIVE_MODS.has(m));
const featOk = n => !n.feat || UI_FEAT[n.feat]!==false;
const aiFeatOk = n => !n.aiFeat || AI_FEAT[n.aiFeat]===true;
const visibleNav = ()=>allNav().filter(n=>(!n.roles||n.roles.includes(ME.role)) && modOk(n) && featOk(n) && aiFeatOk(n));
// carica stato moduli + feature flag UI del tenant (voci menu Mappa/Piantine configurabili dall'admin)
let BRANDING={};
async function loadCtx(){
  try{ const M=await api('/modules'); ACTIVE_MODS=new Set((M||[]).filter(m=>m.state==='attivo').map(m=>m.code)); }catch(e){}
  try{ const F=await api('/ui/features'); if(F&&typeof F==='object') UI_FEAT=F; }catch(e){}
  try{ const B=await api('/branding'); if(B&&typeof B==='object'){ BRANDING=B; applyBranding(B); } }catch(e){}
  try{ if(ACTIVE_MODS.has('assistant')){ const A=await api('/ai/features'); AI_FEAT=(A&&A.features)||{}; } }catch(e){ AI_FEAT={}; }
  // cruscotti IoT attivi -> voci di menu dinamiche (vuoto => nessun menu "IoT Dashboard")
  try{ SCENARIOS = await api('/scenarios') || []; }catch(e){ SCENARIOS=[]; }
}
// Branding per-tenant: sovrascrive i colori di base (default globale YouCo) via CSS vars su :root.
function applyBranding(b){
  const r=document.documentElement.style;
  const set=(k,v)=>{ v?r.setProperty(k,v):r.removeProperty(k); };
  set('--brand', b.brand_primary); set('--brand-ink', b.brand_ink);
  set('--brand-soft', b.brand_soft); set('--brand2', b.brand_accent);
}
// Marchio: logo del tenant se caricato, altrimenti il logomark YouWorkforce.
function brandMark(){ return BRANDING.has_logo
  ? `<img src="/api/branding/logo" alt="logo" style="width:100%;height:100%;object-fit:contain;border-radius:inherit">`
  : ICON.logomark; }
function brandName(){ return esc(BRANDING.name||'YouWorkforce'); }

// ---------------- boot ----------------
(async function(){
  try{ ME = await api('/me'); if(ME.is_super||!ME.tenant_id){ME=null;} }catch(e){ ME=null; }
  if(ME){ await loadCtx(); renderShell(); }
  else renderLogin();
})();

// ---------------- login ----------------
function renderLogin(){
  document.body.classList.add('login-bg');
  $('#root').innerHTML = `
  <div style="min-height:100vh;display:grid;place-items:center;padding:20px;background:
     radial-gradient(1200px 600px at 10% -10%, var(--brand-soft), transparent),
     radial-gradient(900px 500px at 110% 110%, var(--info-soft), transparent), var(--bg)">
    <div class="card" style="width:400px;max-width:100%">
      <div class="card-b">
        <div class="row" style="gap:10px;margin-bottom:6px"><div class="logo">${ICON.logomark}</div>
          <div><h1 style="font-size:19px">YouWorkforce</h1><div class="small mut">${t('app_subtitle','Console cliente')}</div></div>
          <span class="tag sim" style="margin-left:auto">DEMO</span></div>
        <div class="divider" style="margin:14px 0 16px"></div>
        <div class="col">
          <div class="field"><label>${t('login_tenant','Tenant')}${store.slugFromHost?' <span class="small mut">'+t('login_tenant_host','(dal dominio)')+'</span>':''}</label><input id="slug" value="${store.slug}" ${store.slugFromHost?'readonly':''}></div>
          <div class="field"><label>${t('login_email','Email')}</label><input id="email" placeholder="operatore@acme.loneworker.eu"></div>
          <div class="field"><label>${t('login_password','Password')}</label><input id="pw" type="password" value="demo"></div>
          <button class="btn block lg" id="go">${t('login_signin','Accedi')}</button>
          <div class="small" id="msg" style="color:var(--bad);min-height:18px"></div>
          <div class="row" style="justify-content:flex-end;margin-top:4px">${langSelect()}</div>
        </div>
        <div class="divider" style="margin:4px 0 12px"></div>
        <div class="small mut" style="margin-bottom:6px">${t('login_quick','Accesso rapido demo (password <b>demo</b>):')}</div>
        <div class="row" style="gap:6px">
          ${['operatore','pianificatore','responsabile','mario','admin'].map(u=>
            `<button class="btn ghost sm" onclick="quick('${u}')">${u}</button>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
  $('#go').onclick=doLogin;
  $('#pw').onkeydown=e=>{if(e.key==='Enter')doLogin();};
}
function quick(u){ $('#email').value = u+'@acme.loneworker.eu'; $('#pw').value='demo'; doLogin(); }
async function doLogin(){
  store.slug=$('#slug').value.trim();
  try{ await api('/login',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#pw').value})});
    ME = await api('/me'); await loadCtx();
    document.body.classList.remove('login-bg'); renderShell();
  }catch(e){ $('#msg').textContent='Credenziali non valide'; }
}
async function logout(){ try{SSE&&SSE.close()}catch(e){} try{await api('/logout',{method:'POST'});}catch(e){} ME=null; location.hash=''; renderLogin(); }
async function stopImpersonate(){ try{SSE&&SSE.close()}catch(e){} try{ await api('/impersonate/stop',{method:'POST'}); }catch(e){ toast(e.message,'bad'); return; }
  location.href='/superadmin.html'; }

// ---------------- shell ----------------
function renderShell(){
  $('#root').innerHTML = `
  <div class="shell">
    <aside class="side" id="side">
      <div class="brand"><div class="logo">${brandMark()}</div>
        <div style="display:flex;flex-direction:column;line-height:1.1">
          <span>${brandName()}</span>
          <span style="font-size:8px;color:var(--faint);font-weight:700;letter-spacing:.03em;margin-top:2px;white-space:nowrap">Powered by YouCo</span>
        </div></div>
      <nav id="nav">${navHtml()}</nav>
      <div class="foot">
        <div class="row"><div class="ava">${initials(ME.email)}</div>
          <div class="grow" style="min-width:0"><div class="small" style="font-weight:650;overflow:hidden;text-overflow:ellipsis">${esc(ME.email.split('@')[0])}</div>
          <div class="chip" style="padding:1px 7px">${esc(ME.role)}</div></div></div>
      </div>
    </aside>
    <div style="display:flex;flex-direction:column;min-width:0">
      <div class="topbar">
        <button class="btn-ico btn ghost navtoggle" title="Menu" aria-label="Menu" onclick="toggleNav()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <strong id="pageTitle">Dashboard</strong>
        <span class="chip">${esc(store.slug)}</span>
        <div class="grow"></div>
        <span id="liveWrap"></span>
        ${langSelect()}
        <button id="themeBtn" class="btn-ico btn ghost" title="Tema" onclick="toggleTheme()">${themeIconHtml()}</button>
        <button class="btn-ico btn ghost" title="${t('logout','Esci')}" onclick="logout()">${ICON.logout}</button>
      </div>
      ${ME.impersonator?`<div style="background:var(--warn-soft);color:#7a5a00;border-bottom:1px solid var(--line);padding:7px 16px;font-size:13px;display:flex;align-items:center;gap:10px">
        <b>👤 Stai impersonando</b> ${brandName()} come <b>${esc(ME.email)}</b> · supporto superadmin (${esc(ME.impersonator)})
        <button class="btn ghost small" style="margin-left:auto" onclick="stopImpersonate()">Esci impersonazione</button></div>`:''}
      <div class="content"><div id="view"></div></div>
    </div>
  </div>
  <button id="fab" class="hide" onclick="toggleAI()" title="Assistente"
    style="position:fixed;right:22px;bottom:22px;z-index:45;width:56px;height:56px;border-radius:50%;border:none;
    background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:var(--sh-lg);cursor:pointer;font-size:22px">✦</button>
  <div id="ai" class="card hide" style="position:fixed;right:22px;bottom:90px;z-index:46;width:min(400px,92vw);max-height:70vh;display:flex;flex-direction:column">
    <div class="card-h"><div class="row" style="gap:8px"><b>Assistente</b><span class="tag sim">${AI_FEAT.assistant?'youworker.ai · sola lettura':'deterministico · sola lettura'}</span></div>
      <button class="btn-ico btn ghost" onclick="toggleAI()">✕</button></div>
    <div id="aiLog" class="card-b" style="overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px">
      <div class="small mut">Chiedi in linguaggio naturale. Es: «check-in scaduti al sito Milano», «ricostruisci l'ultimo allarme», «ordini attivi».</div></div>
    <div class="card-h" style="border-top:1px solid var(--line);border-bottom:none">
      <input id="aiQ" placeholder="Scrivi una domanda…" onkeydown="if(event.key==='Enter')askAI()">
      <button class="btn" onclick="askAI()">Invia</button></div>
  <div id="navScrim" onclick="toggleNav(false)"></div>`;
  $('#nav').onclick=e=>{const a=e.target.closest('a[data-k]'); if(a){location.hash='#/'+a.dataset.k; toggleNav(false);}};
  api('/modules').then(M=>{ if((M||[]).some(m=>m.code==='assistant'&&m.state==='attivo')) $('#fab').classList.remove('hide'); }).catch(()=>{});
  window.onhashchange=route;
  if(can(['operatore','tenant_admin','auditor'])) connectSSE();
  route();
}
// Nav mobile: la barra laterale diventa un drawer a scomparsa sotto 820px.
function toggleNav(force){
  const s=$('#side'), sc=$('#navScrim'); if(!s)return;
  const open = force===undefined ? !s.classList.contains('open') : !!force;
  s.classList.toggle('open',open); if(sc)sc.classList.toggle('open',open);
}
function rebuildNav(){ const n=$('#nav'); if(n) n.innerHTML=navHtml(); }
function setActive(k){ $$('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.k===k));
  const n=allNav().find(x=>x.k===k); if(n&&$('#pageTitle'))$('#pageTitle').textContent=navLabel(n); }

function route(){
  let k=(location.hash.replace('#/','')||'dashboard');
  if(!visibleNav().some(n=>n.k===k)) k=visibleNav()[0].k;
  setActive(k); const v=$('#view'); v.innerHTML='<div class="col"><div class="skel" style="height:90px"></div><div class="skel" style="height:260px"></div></div>';
  // voci dinamiche cruscotto: k = 'scn_<code>' -> dashboard del singolo ambiente
  if(k.startsWith('scn_')){ vScenarioOne(v, k.slice(4)); return; }
  ({dashboard:vDashboard,centrale:vCentrale,'miei-allarmi':vMieiAllarmi,ordini:vOrdini,consuntivi:vConsuntivi,moduli:vModuli,
    dispositivi:vDispositivi,trigger:vTrigger,profili:vProfili,gruppi:vGruppi,anagrafiche:vAnagrafiche,turni:vTurni,ronde:vRonde,connettori:vConnettori,mappa:vMappa,'mappa-dispositivi':vMappaDispositivi,piantine:vPiantine,report:vReport,ai:vAI,agente:vAgente}[k]||vDashboard)(v);
}

// ---------------- SSE ----------------
function connectSSE(){
  try{SSE&&SSE.close()}catch(e){}
  SSE=new EventSource('/api/stream',{withCredentials:true});
  const w=()=>$('#liveWrap');
  SSE.onopen =()=>{ if(w())w().innerHTML='<span class="live on">live</span>'; };
  SSE.onerror=()=>{ if(w())w().innerHTML='<span class="live off">flusso interrotto</span>'; };
  SSE.onmessage=e=>{ let d={};try{d=JSON.parse(e.data)}catch(_){}
    if(d.type==='incident_opened'){ toast('Nuovo incidente: '+(d.etype||'')+' — '+(d.correlation||'').slice(0,8),'bad'); incidentAlert(d); }
    if(d.type==='device_position' && typeof mapLivePos==='function') mapLivePos(d.device_id,d.lat,d.lon);
    const k=location.hash.replace('#/','')||'dashboard';
    if(d.type==='presence' && k==='mappa') route();
    if(k==='centrale'||k==='dashboard') route();
  };
}
// ---- Allarme: suono + popup quando un dispositivo apre un incidente ----
// Suono generato con Web Audio (nessun file esterno, CSP-safe). Il contesto va "sbloccato" da
// un'interazione utente (policy autoplay): lo riattiviamo al primo gesto.
let _almCtx=null;
function _almAudio(){ try{ if(!_almCtx) _almCtx=new (window.AudioContext||window.webkitAudioContext)(); if(_almCtx.state==='suspended')_almCtx.resume(); }catch(e){} return _almCtx; }
document.addEventListener('pointerdown',_almAudio);
function alarmBeep(){ const ctx=_almAudio(); if(!ctx)return;
  try{ const now=ctx.currentTime;
    [0,0.26,0.52].forEach((t,i)=>{ const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='square'; o.frequency.value=(i%2)?660:960; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,now+t); g.gain.exponentialRampToValueAtTime(0.3,now+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,now+t+0.22); o.start(now+t); o.stop(now+t+0.24); });
  }catch(e){} }
// Popup allarme: un solo modale che accumula gli allarmi arrivati mentre è aperto.
function incidentAlert(d){
  alarmBeep();
  const label=(typeof etLab==='function'?etLab(d.etype):d.etype)||'Allarme';
  const corr=(d.correlation||'').slice(0,8);
  let m=document.getElementById('almModal');
  if(!m){
    m=document.createElement('div'); m.id='almModal';
    m.style.cssText='position:fixed;inset:0;z-index:3000;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;background:rgba(0,0,0,.45)';
    m.innerHTML=`<div class="card" style="max-width:460px;width:100%;overflow:hidden;border:2px solid var(--bad);box-shadow:var(--sh-lg,0 10px 40px rgba(0,0,0,.3))">
      <div class="alm-hd" style="background:var(--bad);color:#fff;padding:12px 16px;font-weight:800;display:flex;align-items:center;gap:8px;font-size:15px">
        🚨 <span>NUOVO ALLARME</span><span id="almN" class="chip" style="margin-left:auto;background:#fff;color:var(--bad);border:none"></span></div>
      <div class="card-b"><div id="almList" class="col" style="gap:8px;max-height:48vh;overflow:auto"></div>
        <div class="row" style="gap:8px;justify-content:flex-end;margin-top:12px">
          <button class="btn ghost" onclick="almClose()">Chiudi</button>
          <button class="btn bad" onclick="location.hash='#/centrale';almClose()">Vai alla Centrale</button></div></div></div>`;
    m.addEventListener('mousedown',e=>{ if(e.target===m) almClose(); });
    document.body.appendChild(m);
  }
  const list=m.querySelector('#almList');
  const row=document.createElement('div'); row.className='card pad'; row.style.cssText='border-left:4px solid var(--bad);cursor:pointer';
  row.innerHTML=`<b>${esc(label)}</b><div class="small mut">correlazione ${esc(corr||'—')} · ${new Date().toLocaleTimeString('it-IT')}</div>`;
  if(d.incident_id) row.onclick=()=>{ almClose(); openIncident(d.incident_id); };
  list.prepend(row);
  const n=list.children.length, nb=m.querySelector('#almN'); if(nb)nb.textContent=(n>1?n+' allarmi':'1 allarme');
}
function almClose(){ const m=document.getElementById('almModal'); if(m)m.remove(); }

async function vDashboard(v){
  const jobs=[];
  const incs = can(['operatore','tenant_admin','auditor']) ? api('/incidents').catch(()=>[]) : Promise.resolve(null);
  const ords = can(['pianificatore','tenant_admin','lavoratore','auditor']) ? api('/orders').catch(()=>[]) : Promise.resolve(null);
  const tss  = can(['lavoratore','responsabile','tenant_admin','auditor']) ? api('/timesheets').catch(()=>[]) : Promise.resolve(null);
  const [I,O,T] = await Promise.all([incs,ords,tss]);
  const openInc=(I||[]).filter(x=>x.state!=='chiuso').length;
  const inCorso=(O||[]).filter(x=>x.state==='in_corso'||x.state==='assegnato').length;
  const inRev=(T||[]).filter(x=>x.state==='in_revisione').length;
  const kpis=[];
  if(I)kpis.push(kpi('alert','Incidenti aperti',openInc,openInc?'pri3':''));
  if(O)kpis.push(kpi('clipboard','Ordini attivi',inCorso));
  if(T)kpis.push(kpi('receipt','Consuntivi in revisione',inRev));
  kpis.push(kpi('shield','Ruolo',ME.role,'', true));
  v.innerHTML=`<div class="grid g4" style="margin-bottom:18px">${kpis.join('')}</div>
    <div class="grid g2">
      ${I?card('Incidenti recenti', (I.slice(0,6).map(incRow).join('')||emptyRow('Nessun incidente')), 'centrale'):''}
      ${O?card('Ordini recenti', (O.slice(0,6).map(ordRow).join('')||emptyRow('Nessun ordine')), 'ordini'):''}
    </div>`;

}
function kpi(ico,label,n,cls='',small){return `<div class="kpi"><div class="ico">${ICON[ico]}</div>
  <div class="n ${cls}" style="${small?'font-size:18px':''}">${esc(n)}</div><div class="l">${label}</div></div>`;}
function card(title,inner,gotoK){return `<div class="card"><div class="card-h"><h2>${title}</h2>
  ${gotoK?`<a onclick="location.hash='#/${gotoK}'">apri →</a>`:''}</div>
  <table class="table"><tbody>${inner}</tbody></table></div>`;}
function emptyRow(t){return `<tr><td class="empty" style="padding:26px">${t}</td></tr>`;}
function incRow(i){return `<tr class="clk" data-inc="${i.id}"><td><b>${esc(i.etype)}</b><div class="small mut">${esc(i.site||'—')}</div></td>
  <td>${chip(i.state)}</td></tr>`;}
function ordRow(o){return `<tr class="clk" data-ord="${o.id}"><td><b>${esc(o.title)}</b><div class="small mut">${esc(o.site||'—')} · ${esc(o.assignee||'non assegnato')}</div></td>
  <td>${chip(o.state)}</td></tr>`;}
function bindRows(v){
  $$('[data-inc]',v).forEach(r=>r.onclick=()=>openIncident(r.dataset.inc));
  $$('[data-ord]',v).forEach(r=>r.onclick=()=>openOrder(r.dataset.ord));
  $$('[data-ts]',v).forEach(r=>r.onclick=()=>openTimesheet(r.dataset.ts));
}

// Lista filtrata per tab (aperti = non chiusi) + ricerca full-text, ordinata (aperti per priorità desc).
function cenFiltered(){
  const toks=(CEN.q||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list=CEN.all.filter(i=>{
    const inTab = CEN.tab==='tutti' ? true : CEN.tab==='chiusi' ? i.state==='chiuso' : i.state!=='chiuso';
    if(!inTab) return false;
    if(!toks.length) return true;
    const hay=incHay(i); return toks.every(t=>hay.includes(t));
  });
  if(CEN.tab!=='chiusi') list=list.slice().sort((a,b)=>(b.priority||0)-(a.priority||0));
  return list;
}
function cenCounts(){ const a=CEN.all; return {
  aperti:a.filter(i=>i.state!=='chiuso').length, chiusi:a.filter(i=>i.state==='chiuso').length, tutti:a.length }; }
function cenTab(t){ CEN.tab=t; CEN.page=1; cenRender(); }
function cenPage(d){ CEN.page=Math.max(1,CEN.page+d); cenRender(); }
function cenRender(){
  const tabsEl=$('#cenTabs'); if(!tabsEl) return;
  const c=cenCounts();
  tabsEl.innerHTML=[['aperti',t('cen_tab_open','Aperti'),c.aperti],['chiusi',t('cen_tab_closed','Chiusi'),c.chiusi],['tutti',t('cen_tab_all','Tutti'),c.tutti]]
    .map(([k,lab,n])=>`<button class="seg-btn${CEN.tab===k?' on':''}" onclick="cenTab('${k}')">${lab} <span class="seg-n">${n}</span></button>`).join('');
  const list=cenFiltered();
  const total=list.length, pages=Math.max(1,Math.ceil(total/CEN.size));
  if(CEN.page>pages)CEN.page=pages;
  const start=(CEN.page-1)*CEN.size, pageItems=list.slice(start,start+CEN.size);
  const body=$('#incBody'), empty=$('#incEmpty'), pager=$('#incPager');
  body.innerHTML=pageItems.map(i=>`<tr class="clk${i.state==='aperto'?' inc-live':''}" data-inc="${i.id}">
    <td><b>${esc(i.etype)}</b>${i.attribution_uncertain?' <span title="attribuzione lavoratore da verificare" style="color:var(--warn)">⚠</span>':''}</td><td>${esc(i.site||'—')}</td><td class="small">${esc(i.assignee||'—')}</td><td>${chip(i.state)}</td>
    <td class="sev pri${i.priority}">${'●'.repeat(i.priority||0)}</td>
    <td class="mono small mut">${esc((i.correlation||'').slice(0,8))}</td></tr>`).join('');
  empty.hidden = total>0;
  $$('#incBody [data-inc]').forEach(r=>r.onclick=()=>openIncident(r.dataset.inc));
  if(total===0){ pager.innerHTML=''; return; }
  const from=start+1, to=Math.min(start+CEN.size,total);
  pager.innerHTML=`<span class="small mut">${t('pager_showing','Mostrando')} ${from}–${to} ${t('pager_of','di')} ${total}</span>
    <div class="row" style="gap:6px;align-items:center">
      <button class="btn ghost small" ${CEN.page<=1?'disabled':''} onclick="cenPage(-1)">${t('pager_prev','‹ Prec')}</button>
      <span class="small" style="min-width:74px;text-align:center">${t('pager_page','Pagina')} ${CEN.page} / ${pages}</span>
      <button class="btn ghost small" ${CEN.page>=pages?'disabled':''} onclick="cenPage(1)">${t('pager_next','Succ ›')}</button>
    </div>`;
}
// Testo ricercabile (full-text) di un incidente: tipo (+etichetta), sede, assegnato, stato
// (+sinonimi), priorità (numero + livello) e correlazione (completa e breve).
function incHay(i){
  const pri={1:'bassa',2:'media',3:'alta',4:'critica',5:'critica'};
  const st={aperto:'aperto nuovo',preso_in_carico:'preso in carico ack',chiuso:'chiuso risolto'};
  const parts=[i.etype, (typeof etLab==='function'?etLab(i.etype):''), i.site, i.assignee,
    i.state, (st[i.state]||''), ('priorità '+i.priority), (pri[i.priority]||''),
    i.correlation, (i.correlation||'').slice(0,8)];
  return parts.filter(Boolean).join(' ').toLowerCase();
}

async function openIncident(id){

  const canOp=can(['operatore','tenant_admin']);
  const acts = (i.state==='aperto'&&canResp)?`<button class="btn block" onclick="incAck('${id}')">Prendi in carico</button>`
    :(i.state==='preso_in_carico'&&canResp)?`<button class="btn ok block" onclick="incClose('${id}')">Chiudi con esito</button>`
    :`<div class="chip">${esc(i.outcome||'nessuna azione disponibile')}</div>`;
  const ops=users.filter(u=>['operatore','tenant_admin','reperibile'].includes(u.role));

    <div class="row" style="gap:6px;margin-top:4px"><select id="asgSel" class="grow">

      ${ops.map(u=>`<option value="${u.id}" ${u.id===i.assigned_user?'selected':''}>${esc(u.email)}</option>`).join('')}

    <div class="row" style="gap:6px;margin-top:4px"><input id="noteInp" class="grow" placeholder="es. chiamato, risponde">
      <button class="btn ghost" onclick="incNote('${id}')">Salva</button></div>`:'';
  drawer(`Incidente · ${esc(i.etype)}`, `
    <div class="row" style="margin-bottom:10px">${chip(i.state)}<span class="chip">prio ${i.priority}</span><span class="chip">${esc(i.site||'—')}</span>${i.assignee?`<span class="chip" title="operatore assegnato">🧑‍💼 ${esc(i.assignee)}</span>`:''}</div>

// Timeline leggibile per operatori non tecnici: etichette in italiano, niente JSON grezzo.
const TL_LAB={
  notify_requested:'📣 Allarme in uscita verso la reperibilità',
  goalert_notify:'📣 Allarme in uscita verso la reperibilità',
  goalert_sent:'✅ Consegnato al sistema di reperibilità',
  goalert_closed:'🟢 Allarme rientrato (chiuso)',
  human_ack:'🙋 Preso in carico',
  transition:'🔁 Cambio stato',
  assegnazione:'👤 Assegnazione',
  note:'📝 Nota',
  notify_failed:'⛔ Notifica non riuscita — ritentativo in corso',
};
function tlTitle(k){ return TL_LAB[k] || esc(String(k||'').replace(/_/g,' ')); }
function fmtDetail(k,d){ if(!d) return '';
  switch(k){
    case 'notify_requested': case 'goalert_notify':
      return d.by?('attivato da '+esc(d.by)):'';
    case 'goalert_sent':
      return (d.status>=200&&d.status<300)?'notifica ricevuta dal sistema di reperibilità'
             :('invio non riuscito'+(d.status?(' (codice '+esc(String(d.status))+')'):''));
    case 'goalert_closed': return 'allarme rientrato, reperibilità avvisata';
    case 'human_ack': return d.by?('da '+esc(d.by)):'';
    case 'transition':
      return [d.to?('→ '+esc(d.to)):'', d.outcome?('esito: '+esc(d.outcome)):'', d.by?('da '+esc(d.by)):''].filter(Boolean).join(' · ');
    case 'note': return d.body?esc(d.body):'';
    case 'assegnazione': return (d.to||d.user||d.body)?esc(d.to||d.user||d.body):'';
    case 'notify_failed': return d.reason?('motivo: '+esc(d.reason)):'';
    default:
      if(d.body) return esc(d.body);
      if(d.outcome) return 'esito: '+esc(d.outcome);
      return ''; // mai JSON grezzo in UI
  }
}

  if(_alarmHiT){ clearInterval(_alarmHiT); }
  _alarmHi=L.circleMarker([lat,lon],{radius:10,color:'#2563eb',weight:3,opacity:.95,fill:false,interactive:false}).addTo(MAP);
  let r=10, grow=true, ticks=0;

// Strumenti di disegno geofence (Geoman) — riusabili su mappa outdoor (geo) e indoor (xy).
// onSave opzionale: se assente, salva una geofence outdoor via /geofences.
function setupGeofenceTools(map, opts){
  opts=opts||{};
  if(!map.pm){ toast('Strumenti di disegno non caricati (serve connessione)','bad'); return; }
  if(map.pm){
    map.pm.addControls({position:'topleft', drawCircle:true, drawRectangle:true, drawPolygon:true,
      drawMarker:false, drawPolyline:false, drawCircleMarker:false, drawText:false,
      editMode:true, dragMode:true, cutPolygon:false, removalMode:true, rotateMode:false});
    map.pm.setGlobalOptions({snappable:true, templineStyle:{color:'#2563eb'}, hintlineStyle:{color:'#2563eb',dashArray:'5,5'}});
    map.off('pm:create');
    map.on('pm:create', async (e)=>{
      const geom=geomFromLayer(e.layer, e.shape, opts); map.removeLayer(e.layer);
      if(!geom){ toast('Forma non valida','bad'); return; }
      const name=await askPrompt('Nome della geofence?'); if(!name){ return; }
      const kind = geom.radius!=null ? 'circle':'polygon';
      if(opts.onSave){ opts.onSave(name, kind, geom); return; }
      try{ await api('/geofences',{method:'POST',body:JSON.stringify({name,kind,geom,color:window._gfColor||'#16a34a'})}); toast('Geofence creata','ok'); route(); }
      catch(err){ toast(err.message,'bad'); }
    });
  }
}
function geomFromLayer(layer, shape, opts){
  const xy = opts && opts.xy;                 // indoor: coordinate immagine (lat=y, lng=x)
  const pt = ll => xy ? [ll.lng, ll.lat] : [ll.lat, ll.lng];
  if(shape==='Circle'){ const c=layer.getLatLng(), r=layer.getRadius();
    return xy ? {cx:c.lng, cy:c.lat, radius:r} : {lat:c.lat, lon:c.lng, radius:Math.round(r)}; }
  const ll=(layer.getLatLngs&&layer.getLatLngs()[0])||[]; const pts=ll.map(pt);
  if(pts.length<3) return null; return {points:pts};
}
let FH=null;
function toggleFreehand(btn){
  if(FH){ endFreehand(); return; }
  if(!MAP){ return; } btn.classList.add('ok'); MAP.dragging.disable(); MAP.getContainer().style.cursor='crosshair';
  let pts=[], line=null, drawing=false, last=null;
  const far=(a,b)=>{ const p1=MAP.latLngToContainerPoint(a), p2=MAP.latLngToContainerPoint(b); return p1.distanceTo(p2)>6; };
  const onDown=(e)=>{ drawing=true; pts=[e.latlng]; last=e.latlng; if(line)MAP.removeLayer(line);
    line=L.polyline(pts,{color:'#2563eb',weight:2}).addTo(MAP); };
  const onMove=(e)=>{ if(!drawing)return; if(last&&!far(last,e.latlng))return; pts.push(e.latlng); last=e.latlng; line.setLatLngs(pts); };
  const onUp=async()=>{ if(!drawing)return; drawing=false; if(line)MAP.removeLayer(line);
    if(pts.length>=3){ const geom={points:pts.map(p=>[p.lat,p.lng])}; const name=await askPrompt('Nome della geofence (mano libera)?');
      if(name){ try{ await api('/geofences',{method:'POST',body:JSON.stringify({name,kind:'polygon',geom,color:window._gfColor||'#16a34a'})}); toast('Geofence creata','ok'); route(); }catch(e){toast(e.message,'bad');} } }
    endFreehand();
  };
  FH={onDown,onMove,onUp}; MAP.on('mousedown',onDown); MAP.on('mousemove',onMove); MAP.on('mouseup',onUp);
  toast('Tieni premuto e traccia il perimetro con il mouse','ok');
}

function imgDims(file){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{res({w:img.naturalWidth,h:img.naturalHeight}); URL.revokeObjectURL(img.src);}; img.onerror=()=>rej(new Error('immagine non valida')); img.src=URL.createObjectURL(file); }); }
async function pdfToPng(file){
  if(!window.pdfjsLib){ throw new Error('libreria PDF non caricata'); }
  try{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const page=await pdf.getPage(1);
  const scale=Math.min(3, 2000/page.getViewport({scale:1}).width);
  const viewport=page.getViewport({scale:Math.max(1,scale)});
  const canvas=document.createElement('canvas'); canvas.width=Math.round(viewport.width); canvas.height=Math.round(viewport.height);
  await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  return {blob, w:canvas.width, h:canvas.height};
}
// Upload parametrico: nome + sede (dai dati del tenant) + file. Niente prompt.
async function doUploadFloorplan(name, siteId, file){
  if(!name||!name.trim()){ toast('Dai un nome alla piantina','bad'); return false; }
  if(!file){ toast('Scegli un file (immagine o PDF)','bad'); return false; }
  let blob, w, h, ct;
  if(file.type==='application/pdf'){ const r=await pdfToPng(file); blob=r.blob; w=r.w; h=r.h; ct='image/png'; }
  else { const dim=await imgDims(file); w=dim.w; h=dim.h; blob=file; ct=file.type||'image/png'; }
  if(!w||!h){ toast('Dimensioni immagine non leggibili','bad'); return false; }
  const q=new URLSearchParams({name:name.trim(), width:w, height:h}); if(siteId) q.set('site_id',siteId);
  const res=await fetch('/api/floorplans?'+q.toString(),{method:'POST',credentials:'include',
    headers:{'x-tenant-slug':store.slug,'x-csrf-token':csrfToken(),'content-type':ct}, body:blob});
  if(!res.ok){ const t=await res.text().catch(()=>''); toast('Upload fallito ('+res.status+') '+t,'bad'); return null; }
  const j=await res.json().catch(()=>({})); toast('Piantina caricata','ok'); return j.id||true;
}

function mapLivePos(id,lat,lon){
  if(!MAP||typeof L==='undefined')return;
  if(MARK[id]) MARK[id].setLatLng([lat,lon]);
  else { const m=L.marker([lat,lon]); MARK[id]=m; (CLUSTER||MAP).addLayer(m); }

// Replay percorso: marker che scorre lungo la polyline con slider play/pausa.
function setupReplay(line){
  const bar=$('#replayBar'); if(!bar)return;
  if(REPLAY){ clearInterval(REPLAY.timer); if(REPLAY.marker)MAP.removeLayer(REPLAY.marker); REPLAY=null; }
  bar.classList.remove('hide');
  bar.innerHTML=`<button class="btn ghost small" id="rpPlay">▶ Replay</button>
    <input id="rpSlider" type="range" min="0" max="${line.length-1}" value="0" style="flex:1">
    <span id="rpIdx" class="small mut">1/${line.length}</span>
    <button class="btn-ico btn ghost" id="rpClose">${ICON.x}</button>`;
  const marker=L.circleMarker(line[0],{radius:7,color:'#dc2626',fillColor:'#dc2626',fillOpacity:1}).addTo(MAP);
  REPLAY={marker,timer:null,line};
  const show=i=>{ marker.setLatLng(line[i]); $('#rpSlider').value=i; $('#rpIdx').textContent=(i+1)+'/'+line.length; };
  $('#rpSlider').oninput=e=>show(+e.target.value);
  $('#rpPlay').onclick=()=>{ if(REPLAY.timer){ clearInterval(REPLAY.timer); REPLAY.timer=null; $('#rpPlay').textContent='▶ Replay'; return; }
    $('#rpPlay').textContent='⏸ Pausa';
    REPLAY.timer=setInterval(()=>{ let i=(+$('#rpSlider').value)+1; if(i>=line.length){ clearInterval(REPLAY.timer); REPLAY.timer=null; $('#rpPlay').textContent='▶ Replay'; return; } show(i); MAP.panTo(line[i]); },500); };
  $('#rpClose').onclick=()=>{ clearInterval(REPLAY.timer); MAP.removeLayer(marker); REPLAY=null; bar.classList.add('hide'); bar.innerHTML=''; };
}

let _sigDraw=false;
function ordSigInit(){ const c=$('#ordSig'); if(!c)return; const ctx=c.getContext('2d'); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#111';
  const pos=e=>{ const r=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return [ (t.clientX-r.left)*(c.width/r.width), (t.clientY-r.top)*(c.height/r.height) ]; };
  const down=e=>{ _sigDraw=true; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); e.preventDefault(); };
  const move=e=>{ if(!_sigDraw)return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); e.preventDefault(); };
  const up=()=>{ _sigDraw=false; };
  c.onmousedown=down; c.onmousemove=move; window.addEventListener('mouseup',up);
  c.ontouchstart=down; c.ontouchmove=move; c.ontouchend=up;
}
function ordSigClear(){ const c=$('#ordSig'); if(c)c.getContext('2d').clearRect(0,0,c.width,c.height); }

    try{ const res=await fetch('/api/orders/'+id+'/attachments?'+new URLSearchParams({kind:'signature',filename:'firma.png'}).toString(),{method:'POST',credentials:'include',
        headers:{'x-tenant-slug':store.slug,'x-csrf-token':csrfToken(),'content-type':'image/png'},body:blob});
      if(!res.ok) throw new Error('HTTP '+res.status); toast('Firma salvata','ok'); ordSigClear(); ordAttLoad(id);
    }catch(e){ toast(e.message,'bad'); } }, 'image/png');

async function openModuleConfig(code,name){
  let tools; try{ tools=await api('/modules/'+code+'/tools'); }
  catch(e){ drawer(esc(name), `<div class="small" style="color:var(--bad)">${esc(e.message)}</div>`); return; }
  if(!tools.length){ drawer(esc(name), '<div class="small mut">Nessuno strumento configurabile disponibile per questo tenant.</div>'); return; }
  const body = tools.map(t=>{
    const fields=((t.schema&&t.schema.fields)||[]).map(f=>{
      const val=(t.config&&t.config[f.key]!==undefined)?t.config[f.key]:'';
      const id=`cf_${code}_${t.tool_code}_${f.key}`;
      let input;
      if(f.type==='enum'){ input=`<select id="${id}" ${t.editable?'':'disabled'}>${(f.options||[]).map(o=>`<option ${o==val?'selected':''}>${esc(o)}</option>`).join('')}</select>`; }
      else if(f.type==='int'){ input=`<input id="${id}" type="number" value="${esc(String(val))}" ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} ${t.editable?'':'disabled'}>`; }
      else { input=`<input id="${id}" value="${esc(String(val))}" ${t.editable?'':'disabled'}>`; }
      return `<label class="small mut" style="display:block;margin-top:8px">${esc(f.label||f.key)}${f.min!=null||f.max!=null?` <span class="tag">${f.min??''}–${f.max??''}</span>`:''}<div style="margin-top:3px">${input}</div></label>`;
    }).join('');
    const save=t.editable?`<button class="btn" style="margin-top:10px" onclick="saveToolConfig('${esc(code)}','${esc(t.tool_code)}',this)">Salva</button>`:'<div class="small mut" style="margin-top:8px">sola lettura</div>';
    return `<div class="card pad" data-tool="${esc(t.tool_code)}" style="margin-bottom:12px"><b>${esc(t.name)}</b>
      <div class="small mut">${esc(t.description||'')}</div>${fields}
      <div class="cfg-msg small" style="margin-top:6px"></div>${save}</div>`;
  }).join('');
  drawer(esc(name)+' · strumenti', body);
}

function devHay(d){

  const e=$('#devEmpty'); if(e) e.hidden = !(tot>0 && n===0);

async function wizardSave(model_code){

    return x?x.id:null; };
  let uid=null, aid=null, bad=null;
  if(k==='user'){ const t=$('#wzUser').value; uid=resolve(t,WZOPTS.users,'email'); if(t&&!uid)bad='lavoratore non trovato: '+t; }

function fmtNum(x){ return (Math.round(x*10)/10).toString(); }
let _sparkId=0;
function spark(series,color){ if(!series||series.length<2)return'';
  const vs=series.map(p=>typeof p.v==='number'?p.v:parseFloat(p.v)).filter(x=>!isNaN(x)); if(vs.length<2)return'';

  const area=`M0,${H} `+xy.map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')+` L${W},${H} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="40" preserveAspectRatio="none" style="margin-top:8px;display:block">

// Gauge radiale (semicerchio) stile cruscotto IoT: traccia + arco valore + tacca soglia.
function arcGauge(w,num,col){
  const min=w.min,max=w.max,thr=w.threshold; const n=num==null?0:Math.max(0,Math.min(1,(num-min)/((max-min)||1)));
  const cx=95,cy=98,r=74; const pt=(f,rr)=>{const a=Math.PI*(1-f);return [cx+(rr||r)*Math.cos(a),cy-(rr||r)*Math.sin(a)];};
  const arc=(f0,f1)=>{const steps=Math.max(1,Math.round(Math.abs(f1-f0)*54));let d='';for(let i=0;i<=steps;i++){const f=f0+(f1-f0)*i/steps;const p=pt(f);d+=(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1);}return d;};
  let thrMark=''; if(thr!=null){const tf=Math.max(0,Math.min(1,(thr-min)/((max-min)||1)));const a=pt(tf,r-12),b=pt(tf,r+4);thrMark=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="var(--mut)" stroke-width="2.5"/>`;}
  return `<svg viewBox="0 0 190 112" width="100%" height="118" style="display:block">
    <path d="${arc(0,1)}" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round"/>
    ${num!=null?`<path d="${arc(0,n)}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"/>`:''}
    ${thrMark}

}

function gnum(mv){ if(!mv||mv.value==null)return null; const v=mv.value; return typeof v==='number'?v:(isNaN(parseFloat(v))?null:parseFloat(v)); }
function siloMetricRow(lbl,mv){ if(!mv)return''; const v=gnum(mv); const bad=mv.tripped;

function siloTrend(silos,label){

  const mn=Math.min(...all),mx=Math.max(...all),rg=(mx-mn)||1,W=600,H=140; let paths='',leg='';
  S.forEach((s,i)=>{ const vs=s.primary_series.map(p=>+p.v).filter(x=>!isNaN(x)); if(vs.length<2)return;

    const c=cols[i%cols.length]; paths+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
    leg+=`<span class="small" style="margin-right:12px"><span style="display:inline-block;width:10px;height:10px;background:${c};border-radius:2px;margin-right:4px"></span>${esc(s.label||s.external_id)}</span>`; });

FORWARD_URL=${esc(r.forward.env.FORWARD_URL)}
FORWARD_ENABLE=true</pre>

// Trigger di sicurezza (Worker Safety): catalogo trigger critici + config aggregata del perimetro.
async function vTrigger(v){
  const d=await api('/safety/triggers').catch(e=>({error:e.message}));
  if(d.error){ v.innerHTML=`<div class="page-h"><h1>Trigger di sicurezza</h1></div><div class="card pad">${esc(d.error)}</div>`; return; }
  const c=d.config||{};
  const badge=t=>t?'<span class="tag" style="background:#fee2e2;color:#b91c1c">critico → incidente</span>':'<span class="tag mut">solo registrato</span>';
  const rows=(d.triggers||[]).map(x=>`<tr>
     <td><b>${esc(x.label)}</b><div class="small mut">${esc(x.desc||'')}</div></td>
     <td class="small">${(x.sources||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join(' ')}</td>
     <td>${badge(x.critical)}</td></tr>`).join('');
  v.innerHTML=`<div class="page-h"><div><h1>Trigger di sicurezza</h1>
      <div class="mut">quali eventi del lavoratore generano un allarme, e come sono configurati</div></div></div>
    <div class="card pad" style="margin-bottom:12px;background:var(--brand-soft)"><div class="small">
      Questo è il <b>perimetro di sicurezza del lavoratore</b>: ogni trigger critico apre un incidente in <b>Centrale allarmi</b>
      e avvia l'<b>escalation</b> verso i reperibili. La mappatura sorgente→evento dipende dai dispositivi/connettori configurati.</div></div>
    <div class="card pad" style="margin-bottom:12px">
      <table class="tbl"><thead><tr><th>Trigger</th><th>Sorgenti</th><th>Esito</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="card pad"><h2 style="margin-bottom:10px">Configurazione trigger</h2>
      <div class="grid g2">
        <label class="col small" style="gap:4px">SOS instradato come
          <select id="tg_sos_as" class="small">
            <option value="sos" ${c.sos_as==='sos'?'selected':''}>SOS (antipanico)</option>
            <option value="man_down" ${c.sos_as==='man_down'?'selected':''}>Uomo a terra</option></select></label>
        <label class="col small" style="gap:4px">Priorità SOS
          <select id="tg_sos_prio" class="small">
            <option value="alta" ${c.sos_priority!=='media'?'selected':''}>Alta</option>
            <option value="media" ${c.sos_priority==='media'?'selected':''}>Media</option></select></label>
        <label class="col small" style="gap:4px">Immobilità da "dispositivo fermo"
          <select id="tg_stopped" class="small">
            <option value="si" ${c.stopped_as_immobilita?'selected':''}>Sì (alza allarme)</option>
            <option value="no" ${!c.stopped_as_immobilita?'selected':''}>No (ignora)</option></select></label>
        <label class="col small" style="gap:4px">Ripetizione notifica SOS (secondi, 0=una volta)
          <input id="tg_repeat" type="number" min="0" max="3600" value="${c.sos_repeat_seconds||0}" class="small"></label>
        <label class="col small" style="gap:4px">Check-in: minuti default
          <input id="tg_chk_def" type="number" min="1" max="1440" value="${c.checkin_default_minutes||30}" class="small"></label>
        <label class="col small" style="gap:4px">Check-in: minuti massimi
          <input id="tg_chk_max" type="number" min="1" max="1440" value="${c.checkin_max_minutes||120}" class="small"></label>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn" onclick="safetyTriggersSave(this)">Salva configurazione</button></div>
      <div class="cfg-msg small" style="margin-top:6px"></div></div>`;
}
async function safetyTriggersSave(btn){
  const m=document.querySelector('.cfg-msg'); if(m){m.textContent='…';m.style.color='var(--mut)';}
  const body={
    sos_as:$('#tg_sos_as').value, sos_priority:$('#tg_sos_prio').value,
    stopped_as_immobilita:$('#tg_stopped').value==='si',
    sos_repeat_seconds:parseInt($('#tg_repeat').value||'0',10),
    checkin_default_minutes:parseInt($('#tg_chk_def').value||'30',10),
    checkin_max_minutes:parseInt($('#tg_chk_max').value||'120',10)
  };
  try{ await api('/safety/triggers',{method:'POST',body:JSON.stringify(body)}); toast('Trigger aggiornati','ok'); if(m){m.textContent='Salvato';m.style.color='var(--ok)';} }
  catch(e){ toast(e.message,'bad'); if(m){m.textContent=e.message;m.style.color='var(--bad)';} }

const PROF_TRIGGERS=[['sos','SOS'],['man_down','Uomo a terra'],['immobilita','Immobilità'],['mancato_checkin','Check-in mancato'],['geofence','Fuori area']];
async function vProfili(v){
  const [D,users]=await Promise.all([api('/safety/profiles').catch(e=>({error:e.message})),api('/users').catch(()=>[])]);
  if(D.error){ v.innerHTML=`<div class="page-h"><h1>Profili di protezione</h1></div><div class="card pad">${esc(D.error)}</div>`; return; }
  v._users=users; v._groups=D.groups||[];
  const groupOpts=(sel)=>`<option value="">— nessuno (routing globale) —</option>`+(D.groups||[]).map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${esc(g.name)}</option>`).join('');
  const card=(p)=>{
    const tg=p.triggers||{};
    const trg=PROF_TRIGGERS.map(([k,lab])=>`<label class="tag" style="cursor:pointer;display:inline-flex;gap:4px;align-items:center">
        <input type="checkbox" data-trg="${k}" ${tg[k]!==false&&tg[k]!==undefined?(tg[k]?'checked':''):(k==='geofence'?'':'checked')}> ${esc(lab)}</label>`).join(' ');
    const mem=(p.members||[]).map(m=>`<div class="row small" style="justify-content:space-between;margin-top:4px">
        <span>${esc(m.email)} <span class="mut">· ${m.devices} device</span></span>
        <button class="btn-ico btn ghost" onclick="profRm('${p.id}','${m.id}')">${ICON.x}</button></div>`).join('')||'<div class="small mut">nessun lavoratore assegnato</div>';
    return `<div class="card pad" style="margin-bottom:12px" data-prof="${p.id}">
      <div class="spread"><div class="row" style="gap:8px;align-items:center">
        <input class="small" data-f="name" value="${esc(p.name)}" style="font-weight:600;min-width:160px">
        <label class="small row" style="gap:4px;align-items:center"><input type="checkbox" data-f="enabled" ${p.enabled?'checked':''}> attivo</label></div>
        <button class="btn-ico btn ghost" onclick="profDel('${p.id}')">${ICON.x}</button></div>
      <input class="small" data-f="descr" value="${esc(p.descr||'')}" placeholder="descrizione" style="width:100%;margin-top:6px">
      <div class="grid g2" style="margin-top:8px">
        <label class="col small" style="gap:4px">Policy escalation (gruppo reperibili)
          <select data-f="group" class="small">${groupOpts(p.escalation_group_id)}</select></label>
        <label class="col small" style="gap:4px">Check-in atteso (minuti, vuoto=default tenant)
          <input data-f="checkin" type="number" min="1" max="1440" value="${p.checkin_minutes||''}" class="small"></label>
      </div>
      <div class="small mut" style="margin:8px 0 4px">Trigger abilitati</div><div>${trg}</div>
      <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px">
        <div class="spread"><b class="small">Lavoratori (${(p.members||[]).length}) · ${p.devices_covered} device coperti</b></div>
        ${mem}
        <div class="row" style="gap:6px;margin-top:8px"><select id="pSel_${p.id}" class="grow small">${users.map(u=>`<option value="${u.id}">${esc(u.email)}</option>`).join('')}</select>
          <button class="btn ghost small" onclick="profAdd('${p.id}')">+ lavoratore</button></div></div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="profSave('${p.id}',this)">Salva profilo</button>
        <span class="prof-msg small" style="margin-left:10px"></span></div></div>`;
  };
  v.innerHTML=`<div class="page-h"><div><h1>Profili di protezione</h1>
      <div class="mut">il punto unico di configurazione del perimetro: lavoratori + trigger + policy di escalation</div></div>
    <button class="btn" onclick="profNew()">+ Nuovo profilo</button></div>
    <div class="card pad" style="margin-bottom:12px;background:var(--brand-soft)"><div class="small">
      Un <b>profilo di protezione</b> lega un gruppo di <b>lavoratori</b> a una <b>policy di escalation</b>, ai <b>trigger</b> attivi e al <b>check-in</b>.
      I <b>device coperti</b> sono quelli assegnati ai lavoratori del profilo. Se è impostato un gruppo, gli incidenti di quei lavoratori
      vengono instradati a <b>quel gruppo</b> con precedenza sul routing globale per-evento.</div></div>
    ${(D.profiles||[]).map(card).join('')||'<div class="card pad mut">Nessun profilo. Creane uno per iniziare.</div>'}`;
}
async function profNew(){
  const name=await askPrompt('Nome del nuovo profilo di protezione'); if(!name)return;
  try{ await api('/safety/profiles',{method:'POST',body:JSON.stringify({name})}); toast('Profilo creato','ok'); route(); }
  catch(e){ toast(e.message,'bad'); }
}
async function profSave(id,btn){
  const box=document.querySelector(`[data-prof="${id}"]`); if(!box)return;
  const m=box.querySelector('.prof-msg'); if(m){m.textContent='…';m.style.color='var(--mut)';}
  const g=box.querySelector('[data-f="group"]').value;
  const chk=box.querySelector('[data-f="checkin"]').value;
  const triggers={}; box.querySelectorAll('[data-trg]').forEach(c=>triggers[c.dataset.trg]=c.checked);
  const body={ name:box.querySelector('[data-f="name"]').value.trim(), descr:box.querySelector('[data-f="descr"]').value.trim(),
    escalation_group_id:g||null, triggers, checkin_minutes:chk?parseInt(chk,10):null,
    enabled:box.querySelector('[data-f="enabled"]').checked };
  try{ await api('/safety/profiles/'+id,{method:'PUT',body:JSON.stringify(body)}); toast('Profilo salvato','ok'); if(m){m.textContent='Salvato';m.style.color='var(--ok)';} }
  catch(e){ toast(e.message,'bad'); if(m){m.textContent=e.message;m.style.color='var(--bad)';} }
}
async function profDel(id){
  if(!await askConfirm('Eliminare questo profilo di protezione?'))return;
  try{ await api('/safety/profiles/'+id,{method:'DELETE'}); toast('Profilo eliminato','ok'); route(); }
  catch(e){ toast(e.message,'bad'); }
}
async function profAdd(id){

}
async function profRm(id,uid){
  try{ await api('/safety/profiles/'+id+'/members/'+uid,{method:'DELETE'}); toast('Lavoratore rimosso','ok'); route(); }

}

// Tab della pagina Escalation: mostra un pannello per volta (handler/ID invariati).
function escTab(k){
  $$('#escTabs .seg-btn').forEach(b=>b.classList.toggle('on', b.dataset.et===k));
  $$('.esc-tab').forEach(p=>{ p.hidden = p.dataset.et!==k; });
}
// Sotto-tab per-gruppo (Copertura/Policy/Label/Playbook/Assegnazioni/Turni): un pannello per
// volta; ri-click chiude. Lazy-load dei pannelli che lo richiedono.
function grpSub(gid,k){
  const sel='[data-g="'+gid+'"]';
  const strip=document.querySelector('.gsub'+sel);
  const btn=strip?strip.querySelector('.gsub-b[data-k="'+k+'"]'):null;
  const already=btn&&btn.classList.contains('on');
  if(strip) strip.querySelectorAll('.gsub-b').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.gsub-p'+sel).forEach(p=>{ p.hidden=true; });
  if(already) return;
  if(btn) btn.classList.add('on');
  const p=document.querySelector('.gsub-p'+sel+'[data-k="'+k+'"]'); if(p)p.hidden=false;
  if(k==='policy')grpPolicyLoad(gid);
  else if(k==='playbook')grpHandoffLoad(gid);
  else if(k==='assign')grpAssignLoad(gid);
  else if(k==='shifts')grpShiftsLoad(gid);
}

    // Recapiti NATIVI: telefono dell'utente + stato verifica (OTP via SMS). Nessun GoAlert.
    out.innerHTML = (r.members||[]).map(m=>`<div style="border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px">

    const cms=(r.methods||[]).map(c=>`<div class="row small" style="gap:6px;align-items:center;margin-bottom:3px">
      <span class="tag">${esc(c.kind)}</span> <span>${esc(c.value)}</span>${c.label?` <span class="mut">(${esc(c.label)})</span>`:''}
      ${c.disabled?'<span style="color:var(--bad)">⛔</span>':(c.verified?'<span style="color:var(--ok,green)">✓</span>':`<button class="btn ghost small" onclick="ocCmV('${uid}','${c.id}')">verifica</button>`)}

    const cmOpts=(r.methods||[]).map(c=>`<option value="${c.id}">${esc(c.kind)} ${esc(c.value)}</option>`).join('');

function ocAbsEdit(o){ window._absEditId=o.id;

async function ocAbsAdd(gid){
  const rem=$('#absRem').value, add=$('#absAdd').value, s=$('#absS').value, e=$('#absE').value;
  if(!s||!e){ toast('indica le date','bad'); return; }
  if(!rem&&!add){ toast('indica assente e/o sostituto','bad'); return; }
  if(window._absEditId){ const id=window._absEditId; window._absEditId=null;
    try{ await api('/oncall-overrides/update',{method:'POST',body:JSON.stringify({id,start:s+'T00:00:00Z',end:e+'T23:59:59Z',remove_user_id:rem||null,add_user_id:add||null})}); toast('Override aggiornato','ok'); ocAbsences(); }catch(err){ toast(err.message,'bad'); } return; }
  const body={group_id:gid, start:s+'T00:00:00Z', end:e+'T23:59:59Z', remove_user_id:rem||null, add_user_id:add||null};
  try{ await api('/oncall-overrides',{method:'POST',body:JSON.stringify(body)}); toast('Assenza registrata','ok'); ocAbsences(); }
  catch(err){ toast(err.message,'bad'); }

async function syncGoalert(btn){
  const out=$('#gaSyncOut'); if(btn){btn.disabled=true;btn.textContent='Sincronizzo…';}
  try{ const r=await api('/alarm/sync-goalert',{method:'POST'});
    const tr=r.transport||{}; const trTxt=`trasporto: ${tr.sms?'SMS✓':'SMS✗'} ${tr.email?'email✓':'email✗'}`;
    if(out) out.innerHTML=`<span style="color:var(--ok,green)">✓ Sincronizzato</span> · ${r.groups_synced} gruppi · ${r.rotations||0} turni · ${r.users_created} utenti · ${r.contact_methods_created} recapiti · ${r.routes} routing · ${trTxt} · repeat ${r.repeat_seconds}s (step ${r.step_delay_minutes}m ×${r.ep_repeat})${r.groups_skipped_no_members?` · ${r.groups_skipped_no_members} gruppi senza membri`:''}`
      +(r.warning?`<div style="color:var(--warn,#b45309);margin-top:4px">⚠ ${esc(r.warning)}</div>`:'');
    toast('GoAlert sincronizzato','ok');
  }catch(e){ if(out) out.innerHTML='<span style="color:var(--bad)">'+esc(e.message)+'</span>'; toast(e.message,'bad'); }
  finally{ if(btn){btn.disabled=false;btn.textContent='🔄 Sincronizza con GoAlert';} }
}

window._shf={}; // gid -> {shifts, view, user}
async function grpShiftsLoad(gid){ const out=$('#shf_'+gid); out.innerHTML='<span class="mut">Calcolo…</span>';
  try{ const r=await api('/groups/'+gid+'/shifts?days=30');
    window._shf[gid]={shifts:r.shifts||[], view:(window._shf[gid]||{}).view||'list', user:(window._shf[gid]||{}).user||''};
    grpShiftsRender(gid);
  }catch(e){ out.innerHTML='<span style="color:var(--bad)">'+esc(e.message)+'</span>'; } }
function grpShiftsRender(gid){
  const S=window._shf[gid]||{shifts:[],view:'list',user:''};
  let shifts=S.shifts; if(S.user) shifts=shifts.filter(s=>(s.oncall||[]).includes(S.user));
  const users=[...new Set(S.shifts.flatMap(s=>s.oncall||[]))].sort();
  const ctrl=`<div class="row small" style="gap:6px;align-items:center;margin-bottom:6px">
    <button class="btn ghost small" onclick="grpShiftsView('${gid}','list')" ${S.view==='list'?'style="font-weight:700"':''}>lista</button>
    <button class="btn ghost small" onclick="grpShiftsView('${gid}','cal')" ${S.view==='cal'?'style="font-weight:700"':''}>calendario</button>
    <select class="small" onchange="grpShiftsUser('${gid}',this.value)"><option value="">tutti</option>${users.map(u=>`<option value="${u}" ${S.user===u?'selected':''}>${esc(u)}</option>`).join('')}</select></div>`;
  let body;
  if(S.view==='cal'){ body=grpShiftsCalendar(shifts); }
  else { body=shifts.map(s=>`<div class="row small" style="gap:6px;border-bottom:1px solid var(--line);padding:3px 0">
      <span style="min-width:200px">${new Date(s.start).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} → ${new Date(s.end).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
      <span>${(s.oncall||[]).map(esc).join(', ')}</span></div>`).join('')||'<div class="mut">nessun turno</div>'; }
  $('#shf_'+gid).innerHTML=ctrl+body;
}
function grpShiftsView(gid,v){ (window._shf[gid]=window._shf[gid]||{}).view=v; grpShiftsRender(gid); }
function grpShiftsUser(gid,u){ (window._shf[gid]=window._shf[gid]||{}).user=u; grpShiftsRender(gid); }
function grpShiftsCalendar(shifts){
  // nomi on-call per giorno (chi è reperibile in quel giorno)
  const byDay={};
  shifts.forEach(s=>{ let d=new Date(s.start); d.setHours(0,0,0,0); const end=new Date(s.end);
    for(let t=new Date(d); t<end; t.setDate(t.getDate()+1)){ const k=t.toISOString().slice(0,10); byDay[k]=byDay[k]||new Set(); (s.oncall||[]).forEach(e=>byDay[k].add(e)); } });
  const days=Object.keys(byDay).sort(); if(!days.length) return '<div class="mut">nessun turno</div>';
  // griglia a settimane (lun-dom) dal primo all'ultimo giorno
  const first=new Date(days[0]+'T00:00:00'); const last=new Date(days[days.length-1]+'T00:00:00');
  const startGrid=new Date(first); startGrid.setDate(first.getDate()-((first.getDay()+6)%7)); // lunedì
  let html='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">'+['Lu','Ma','Me','Gi','Ve','Sa','Do'].map(d=>`<div class="small mut" style="text-align:center">${d}</div>`).join('');
  for(let t=new Date(startGrid); t<=last; t.setDate(t.getDate()+1)){ const k=t.toISOString().slice(0,10); const names=byDay[k]?[...byDay[k]]:[];
    const inrange=t>=first; html+=`<div style="border:1px solid var(--line);border-radius:6px;padding:3px;min-height:48px;${inrange?'':'opacity:.4'}">
      <div class="small mut">${t.getDate()}</div><div style="font-size:11px;line-height:1.2">${names.map(n=>esc(n.split('@')[0])).join('<br>')}</div></div>`; }
  return html+'</div>';
}

async function asgAdd(gid){ let days=''; for(let i=0;i<7;i++){ days+=($('#asgd_'+gid+'_'+i)?.checked)?'1':'0'; }
  const body={label:$('#asgL_'+gid).value||'', cov_days:days, cov_start:$('#asgS_'+gid).value||null, cov_end:$('#asgE_'+gid).value||null,
    mode:$('#asgMode_'+gid).value, oncall_type:$('#asgType_'+gid).value};
  try{ await api('/groups/'+gid+'/assignments',{method:'POST',body:JSON.stringify(body)}); grpAssignLoad(gid); }catch(e){ toast(e.message,'bad'); } }
async function grpCalendar(gid,rotate){ try{ const r=await api('/groups/'+gid+'/calendar/url'+(rotate?'?rotate=1':'')); const full=location.origin+r.url;
  $('#gcal_'+gid).innerHTML=`<code>${esc(full)}</code>
    <button class="btn ghost small" onclick="navigator.clipboard.writeText('${full}');toast('Copiato','ok')">copia</button>
    <button class="btn ghost small" onclick="grpCalRotate('${gid}')">↻ ruota</button>
    <button class="btn ghost small" onclick="grpCalendarRevoke('${gid}')">🗑 revoca</button>`;
  if(rotate) toast('Token ruotato','ok'); }catch(e){ toast(e.message,'bad'); } }
async function grpCalRotate(gid){ if(await askConfirm('Rigenerare il token del gruppo? Il vecchio URL smetterà di funzionare.')) grpCalendar(gid,1); }
async function grpCalendarRevoke(gid){ if(!await askConfirm('Revocare il feed del gruppo? L\'URL attuale smetterà di funzionare.'))return;
  try{ await api('/groups/'+gid+'/calendar',{method:'DELETE'}); $('#gcal_'+gid).innerHTML='<span class="small mut">Feed revocato.</span>'; toast('Feed revocato','ok'); }catch(e){ toast(e.message,'bad'); } }
async function asgDel(gid,aid){ if(!await askConfirm('Eliminare l\'assegnazione?'))return; try{ await api('/assignments/'+aid,{method:'DELETE'}); grpAssignLoad(gid); }catch(e){ toast(e.message,'bad'); } }
async function asgMemAdd(gid,aid){ const uid=$('#asgm_'+aid).value; if(!uid)return; try{ await api('/assignments/'+aid+'/members',{method:'POST',body:JSON.stringify({user_id:uid,position:1})}); grpAssignLoad(gid); }catch(e){ toast(e.message,'bad'); } }
async function asgMemRm(gid,aid,uid){ try{ await api('/assignments/'+aid+'/members/'+uid,{method:'DELETE'}); grpAssignLoad(gid); }catch(e){ toast(e.message,'bad'); } }
async function routeSet(etype,gid){ try{await api('/routing',{method:'POST',body:JSON.stringify({etype,group_id:gid||null})}); toast('Routing aggiornato','ok');}catch(e){toast(e.message,'bad');} }

// ---------------- Policy escalation multi-step (nativo) ----------------
window._pol={}; // gid -> {steps:[{delay_min,channel}], repeat}
const POL_CH=[['sms','SMS'],['voice','Voce'],['email','Email'],['slack','Slack']];
const POL_TGT=[['oncall','on-call del gruppo'],['group','altro gruppo'],['user','persona'],['slack','canale Slack']];
async function grpPolicyLoad(gid){
  try{ const r=await api('/groups/'+gid+'/policy');
    window._pol[gid]={steps:(r.steps||[]).map(s=>({delay_min:s.delay_min,channel:s.channel,target_kind:s.target_kind||'oncall',target_group_id:s.target_group_id||'',target_user_id:s.target_user_id||'',target_slack:s.target_slack||''})), repeat:r.repeat||0};
    grpPolicyRender(gid);
  }catch(e){ $('#pol_'+gid).innerHTML='<span style="color:var(--bad)">'+esc(e.message)+'</span>'; }
}
function polTargetPicker(gid,i,s){
  const P=`window._pol['${gid}'].steps[${i}]`;
  const kinds=`<select class="small" onchange="${P}.target_kind=this.value;grpPolicyRender('${gid}')">${POL_TGT.map(t=>`<option value="${t[0]}" ${s.target_kind===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select>`;
  let extra='';
  if(s.target_kind==='group') extra=`<select class="small" onchange="${P}.target_group_id=this.value"><option value="">—</option>${(window._groupsCache||[]).map(g=>`<option value="${g.id}" ${s.target_group_id===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select>`;
  else if(s.target_kind==='user') extra=`<select class="small" onchange="${P}.target_user_id=this.value"><option value="">—</option>${(window._users||[]).map(u=>`<option value="${u.id}" ${s.target_user_id===u.id?'selected':''}>${esc(u.email)}</option>`).join('')}</select>`;
  else if(s.target_kind==='slack') extra=`<input class="small" placeholder="ID canale Slack" value="${esc(s.target_slack||'')}" style="width:120px" onchange="${P}.target_slack=this.value">`;
  return kinds+' '+extra;
}
function grpPolicyRender(gid){
  const p=window._pol[gid]||{steps:[],repeat:0};
  const rows=p.steps.map((s,i)=>`<div class="row small" style="gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap">
    <b>#${i+1}</b>
    <select class="small" onchange="window._pol['${gid}'].steps[${i}].channel=this.value">${POL_CH.map(c=>`<option value="${c[0]}" ${s.channel===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select>
    → ${polTargetPicker(gid,i,s)}
    attesa <input type="number" min="0" max="1440" value="${s.delay_min}" style="width:56px" onchange="window._pol['${gid}'].steps[${i}].delay_min=+this.value"> min
    <button class="btn-ico btn ghost" title="su" onclick="grpPolMove('${gid}',${i},-1)">↑</button>
    <button class="btn-ico btn ghost" title="giù" onclick="grpPolMove('${gid}',${i},1)">↓</button>
    <button class="btn-ico btn ghost" onclick="grpPolRm('${gid}',${i})">${ICON.x}</button></div>`).join('')
    ||'<div class="small mut">Nessuno step personalizzato → usa la ladder derivata (SMS→Voce) verso l\'on-call del gruppo.</div>';
  $('#pol_'+gid).innerHTML=`${rows}
    <div class="row small" style="gap:6px;align-items:center;margin-top:6px">
      <button class="btn ghost small" onclick="grpPolAdd('${gid}')">+ step</button>
      ripeti <input type="number" min="0" max="10" value="${p.repeat||0}" style="width:50px" onchange="window._pol['${gid}'].repeat=+this.value"> volte
      <button class="btn small" onclick="grpPolSave('${gid}')">Salva policy</button></div>
    <div class="small faint" style="margin-top:3px">Ogni step notifica il <b>target</b> scelto (on-call del gruppo, un altro gruppo, una persona o un canale Slack) sul canale indicato, poi aspetta i minuti prima del successivo. Dopo l'ultimo, ripete N volte finché non c'è presa in carico.</div>`;
}
function grpPolAdd(gid){ (window._pol[gid]=window._pol[gid]||{steps:[],repeat:0}).steps.push({delay_min:5,channel:'sms',target_kind:'oncall',target_group_id:'',target_user_id:'',target_slack:''}); grpPolicyRender(gid); }
function grpPolRm(gid,i){ window._pol[gid].steps.splice(i,1); grpPolicyRender(gid); }
function grpPolMove(gid,i,d){ const a=window._pol[gid].steps; const j=i+d; if(j<0||j>=a.length)return; [a[i],a[j]]=[a[j],a[i]]; grpPolicyRender(gid); }
async function grpPolSave(gid){ const p=window._pol[gid]||{steps:[],repeat:0};
  const steps=p.steps.map(s=>({delay_min:+s.delay_min||0, channel:s.channel, target_kind:s.target_kind||'oncall',
    target_group_id:(s.target_kind==='group'&&s.target_group_id)?s.target_group_id:null,
    target_user_id:(s.target_kind==='user'&&s.target_user_id)?s.target_user_id:null,
    target_slack:(s.target_kind==='slack'&&s.target_slack)?s.target_slack:null}));
  try{ await api('/groups/'+gid+'/policy',{method:'POST',body:JSON.stringify({steps,repeat:+p.repeat||0})}); toast('Policy salvata','ok'); }
  catch(e){ toast(e.message,'bad'); } }
async function grpLabelsSave(gid){
  const txt=$('#lbl_'+gid).value||''; const labels={};
  txt.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{ const i=l.indexOf('='); if(i>0) labels[l.slice(0,i).trim()]=l.slice(i+1).trim(); });
  try{ await api('/groups/'+gid+'/labels',{method:'POST',body:JSON.stringify({labels})}); toast('Label salvate','ok'); }
  catch(e){ toast(e.message,'bad'); } }
async function grpPlaybookSave(gid){ try{ await api('/groups/'+gid+'/playbook',{method:'POST',body:JSON.stringify({playbook:$('#pb_'+gid).value||''})}); toast('Playbook salvato','ok'); }catch(e){ toast(e.message,'bad'); } }
async function grpHandoffLoad(gid){
  const out=$('#ho_'+gid); out.innerHTML='<span class="mut">Carico…</span>';
  try{ const r=await api('/groups/'+gid+'/handoff-notes');
    const list=(r.notes||[]).map(n=>`<div class="row small" style="justify-content:space-between;border:1px solid var(--line);border-radius:6px;padding:4px 6px;margin-bottom:3px">
      <span><b>${esc(n.author)}</b> · ${new Date(n.at).toLocaleString('it-IT')}<br>${esc(n.body)}</span>
      <button class="btn-ico btn ghost" onclick="grpHandoffDel('${gid}','${n.id}')">${ICON.x}</button></div>`).join('')||'<div class="mut">nessuna nota</div>';
    out.innerHTML=`<b>Note di passaggio turno</b>${list}
      <div class="row small" style="gap:4px;align-items:center;margin-top:4px">
        <input id="hob_${gid}" placeholder="nota per il turno entrante" style="flex:1">
        <button class="btn ghost small" onclick="grpHandoffAdd('${gid}')">+ nota</button></div>`;
  }catch(e){ out.innerHTML='<span style="color:var(--bad)">'+esc(e.message)+'</span>'; } }
async function grpHandoffAdd(gid){ const body=$('#hob_'+gid).value.trim(); if(!body){toast('scrivi la nota','bad');return;}
  try{ await api('/groups/'+gid+'/handoff-notes',{method:'POST',body:JSON.stringify({body})}); grpHandoffLoad(gid); }catch(e){ toast(e.message,'bad'); } }
async function grpHandoffDel(gid,id){ try{ await api('/handoff-notes/'+id,{method:'DELETE'}); grpHandoffLoad(gid); }catch(e){ toast(e.message,'bad'); } }

async function userCreate(){

}
async function userEdit(u){
  const scoped=['operatore','lavoratore','reperibile'].includes(u.role);
  let sites=[], cur=[];
  if(scoped){ try{ sites=await api('/sites'); cur=(await api('/users/'+u.id+'/sites')).site_ids||[]; }catch(e){} }
  const siteBox = scoped ? `<div class="small mut" style="margin-top:6px">Sedi visibili (vuoto = tutte)</div>
    <div style="max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:4px">
    ${sites.map(s=>`<label class="row small" style="gap:8px"><input type="checkbox" class="uSite" value="${s.id}" ${cur.includes(s.id)?'checked':''}> ${esc(s.name)}</label>`).join('')||'<span class="mut">nessuna sede</span>'}</div>` : '';
  drawer('Utente · '+esc(u.email),`<div class="col" style="gap:10px">
    <label class="small mut">Ruolo<select id="uRo2">${ROLES.map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select></label>
    <label class="small mut">Nuova password (opzionale)<input id="uPw2" placeholder="lascia vuoto per non cambiare"></label>
    <label class="small mut">Telefono (E.164, per notifiche SMS/voce GoAlert)<input id="uPhone" placeholder="+393331234567" value="${esc(u.phone||'')}"></label>
    ${siteBox}
    <div class="row" style="gap:8px"><button class="btn grow" onclick="userSave('${u.id}',${scoped})">Salva</button>
      <button class="btn ghost" onclick="userDel('${u.id}')">Elimina</button></div><div class="cfg-msg small"></div></div>`);
}
async function userSave(id,scoped){
  const b={role:$('#uRo2').value, phone:$('#uPhone').value.trim()}; const p=$('#uPw2').value; if(p)b.password=p;
  const m=$('.cfg-msg');
  try{await api('/users/'+id,{method:'POST',body:JSON.stringify(b)});
    if(scoped){ const ids=[...document.querySelectorAll('.uSite:checked')].map(c=>c.value);
      await api('/users/'+id+'/sites',{method:'POST',body:JSON.stringify({site_ids:ids})}); }
    toast('Salvato','ok'); closeDrawer(); route();}
  catch(e){m.textContent=e.message;m.style.color='var(--bad)';}
}
async function userDel(id){ if(!await askConfirm('Eliminare utente?'))return;
  try{await api('/users/'+id,{method:'DELETE'}); toast('Eliminato','ok'); closeDrawer(); route();}catch(e){toast(e.message,'bad');} }

async function siteDel(id){ if(!await askConfirm('Eliminare sede?'))return;

// ---------------- Turni (pianificazione) ----------------
function dtLocal(iso){ const d=new Date(iso); return d.toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function toISO(localVal){ if(!localVal)return null; const d=new Date(localVal); return isNaN(d)?null:d.toISOString(); }
async function vTurni(v){
  const planner=can(['pianificatore','tenant_admin']);
  const [P,OC,users,sites]=await Promise.all([
    api('/shift-plans').catch(()=>[]), api('/oncall').catch(()=>[]),
    planner?api('/users').catch(()=>[]):Promise.resolve([]), planner?api('/sites').catch(()=>[]):Promise.resolve([])]);
  v._users=users; v._sites=sites;
  const stChip=s=>`<span class="chip ${s==='confermato'?'s-attivo':''}">${s}</span>`;
  const planRows=P.map(p=>{
    const mine=p.user_id===ME.user_id||ME.email===p.email;
    const acts=[];
    if(p.state==='pianificato'&&mine) acts.push(`<button class="btn ghost small" onclick="spAct('${p.id}','confirm')">conferma</button>`);
    if(planner&&p.state!=='annullato') acts.push(`<button class="btn ghost small" onclick="spAct('${p.id}','cancel')">annulla</button>`);
    if(planner) acts.push(`<button class="btn-ico btn ghost" onclick="spDel('${p.id}')">${ICON.x}</button>`);
    return `<tr><td>${esc(p.email)}</td><td>${esc(p.site||'—')}</td>
      <td class="small">${dtLocal(p.starts_at)} → ${dtLocal(p.ends_at)}</td><td>${stChip(p.state)}</td>
      <td style="text-align:right">${acts.join(' ')}</td></tr>`;}).join('')
    ||`<tr><td colspan="5" class="empty">Nessun turno pianificato</td></tr>`;
  const createBtn=planner?`<button class="btn" onclick="spNew()">+ Pianifica turno</button>`:'';
  const oncallCard=`<div class="card" style="margin-top:16px"><div class="card-h"><h2>Reperibilità</h2>
    ${planner?`<a onclick="ocNew()">+ aggiungi</a>`:''}</div>
    <table class="table"><thead><tr><th>Utente</th><th>Dalle</th><th>Alle</th><th>Nota</th><th></th></tr></thead>
    <tbody>${OC.map(o=>`<tr><td>${esc(o.email)}</td><td class="small">${dtLocal(o.starts_at)}</td><td class="small">${dtLocal(o.ends_at)}</td>
      <td class="small mut">${esc(o.note||'—')}</td><td style="text-align:right">${planner?`<button class="btn-ico btn ghost" onclick="ocDel('${o.id}')">${ICON.x}</button>`:''}</td></tr>`).join('')
      ||`<tr><td colspan="5" class="empty">Nessuna reperibilità</td></tr>`}</tbody></table></div>`;
  v.innerHTML=`<div class="page-h"><div><h1>Turni</h1><div class="mut">${P.length} turni pianificati${planner?'':' (i tuoi)'}</div></div>${createBtn}</div>
  <div class="card"><table class="table"><thead><tr><th>Lavoratore</th><th>Sede</th><th>Quando</th><th>Stato</th><th></th></tr></thead>
    <tbody>${planRows}</tbody></table></div>${oncallCard}`;
}
function spNew(){
  const v=$('#view'); const users=v._users||[], sites=v._sites||[];
  const workers=users.filter(u=>['lavoratore','reperibile','operatore'].includes(u.role));
  drawer('Pianifica turno',`<div class="col" style="gap:10px">
    <label class="small mut">Lavoratore<select id="spU">${workers.map(u=>`<option value="${u.id}">${esc(u.email)}</option>`).join('')}</select></label>
    <label class="small mut">Sede<select id="spS"><option value="">—</option>${sites.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>
    <label class="small mut">Inizio<input id="spA" type="datetime-local"></label>
    <label class="small mut">Fine<input id="spZ" type="datetime-local"></label>
    <label class="small mut">Nota<input id="spN"></label>
    <button class="btn" onclick="spSave()">Pianifica</button><div class="cfg-msg small"></div></div>`);
}
async function spSave(){
  const m=$('.cfg-msg');
  const b={user_id:$('#spU').value,site_id:$('#spS').value||null,starts_at:toISO($('#spA').value),ends_at:toISO($('#spZ').value),note:$('#spN').value||null};
  if(!b.user_id||!b.starts_at||!b.ends_at){m.textContent='compila lavoratore, inizio e fine';m.style.color='var(--bad)';return;}
  try{await api('/shift-plans',{method:'POST',body:JSON.stringify(b)}); toast('Turno pianificato','ok'); closeDrawer(); route();}
  catch(e){m.textContent=e.message;m.style.color='var(--bad)';}
}
async function spAct(id,action){ try{await api('/shift-plans/'+id,{method:'POST',body:JSON.stringify({action})}); toast(action==='confirm'?'Turno confermato':'Turno annullato','ok'); route();}catch(e){toast(e.message,'bad');} }
async function spDel(id){ if(!await askConfirm('Eliminare il turno?'))return; try{await api('/shift-plans/'+id,{method:'DELETE'}); toast('Eliminato','ok'); route();}catch(e){toast(e.message,'bad');} }
function ocNew(){
