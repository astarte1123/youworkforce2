<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Lavoratore · YouWorkforce</title>
<link rel="icon" href="/youworkforce.webp" type="image/webp">
<link rel="apple-touch-icon" href="/youworkforce.webp">
<link rel="manifest" href="/worker/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
<style>
  /* App usata SOLO da telefono (verificata a 360px). FE-13: spaziature/colori dai token di app.css; restano
     in px solo misure senza token (raggi, pulsante SOS, miniature). Il rosso SOS è volutamente fisso
     (identico in tema chiaro e scuro): definito una volta qui sotto.
     FE-15: bersagli tattili >= 44px, righe che vanno a capo, aree sicure dei telefoni con notch.
     FE-16: focus visibile, finestre con ruolo dialog, Esc chiude. */
  :root{--sos:#d81e36;--sos-hi:#ff5468}
  body{background:var(--bg)}
  .wrap{max-width:460px;margin:0 auto;padding:var(--s-14) var(--s-14) calc(30px + env(safe-area-inset-bottom))}
  .wrap.w-login{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
  .whead{position:sticky;top:0;z-index:10;background:var(--bg);padding:var(--s-12) var(--s-14);padding-top:max(var(--s-12),env(safe-area-inset-top));
    display:flex;align-items:center;gap:var(--s-10);border-bottom:1px solid var(--line)}
  .whead strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .logo.logo-sm{width:26px;height:26px}
  .w-title{font-size:18px}
  .btn{min-height:44px} .btn-ico{width:44px;height:44px}
  .btn.mini{padding:0 var(--s-6);min-width:40px;min-height:40px;justify-content:center}
  .spread{flex-wrap:wrap}
  .sosbtn{width:100%;min-height:88px;border:none;border-radius:var(--r-lg);background:linear-gradient(160deg,var(--sos-hi),var(--sos));color:#fff;
    padding:26px;font-size:22px;font-weight:800;letter-spacing:.02em;cursor:pointer;box-shadow:0 10px 30px rgba(216,30,54,.4);
    display:flex;align-items:center;justify-content:center;gap:var(--s-12)}
  .sosbtn:active{transform:scale(.98)}
  .sosbtn svg{width:30px;height:30px}
  .sos-note{margin-top:calc(-1 * var(--s-6))}
  .count{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .act{display:flex;align-items:center;gap:var(--s-12);width:100%;padding:var(--s-16);border:1px solid var(--line);background:var(--surface);
    border-radius:var(--r);font:inherit;font-weight:600;cursor:pointer;color:var(--fg);text-align:left}
  .act:active{background:var(--surface2)} .act svg{width:22px;height:22px;color:var(--brand-ink)}
  .act .ic{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;flex:none}
  .tag.warn{background:var(--warn-soft);color:var(--warn)}
  .chip.warn{background:var(--warn-soft);color:var(--warn)}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(2,6,23,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:460px;background:var(--surface);border-radius:18px 18px 0 0;padding:var(--s-16) var(--s-16) calc(26px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);max-height:88vh;overflow:auto}
  .sheet:focus{outline:none}
  .sheet textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);padding:var(--s-10);font:inherit;resize:vertical}
  #micBtn.on{background:var(--bad);color:#fff;border-color:transparent}
  .scan-ov{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center}
  .scan-box{position:relative;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:var(--s-12);padding:var(--s-16)}
  .scan-box video{width:100%;max-height:70vh;border-radius:12px;object-fit:cover;background:#111}
  .scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:62%;aspect-ratio:1;border:3px solid var(--ok);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.25);pointer-events:none}
  .scan-cancel{max-width:460px}
  /* SOS non consegnato + preavviso immobilità */
  .sos-pend{position:fixed;left:var(--s-12);right:var(--s-12);bottom:calc(var(--s-12) + env(safe-area-inset-bottom));z-index:50;background:var(--sos);color:#fff;
    border-radius:16px;padding:var(--s-14);box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .sos-pend .msg{margin:var(--s-6) 0 var(--s-10);font-size:14px}
  .sos-call{display:block;text-align:center;background:#fff;color:var(--sos);border-radius:12px;padding:var(--s-12);min-height:44px;font-weight:700;text-decoration:none}
  .imm-ov{position:fixed;inset:0;z-index:60;background:rgba(216,30,54,.96);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--s-24);text-align:center}
  .imm-t{font-size:30px;font-weight:800;margin-bottom:var(--s-10)}
  .imm-d{font-size:16px;margin-bottom:var(--s-24)}
  .imm-ok{width:100%;max-width:360px;min-height:64px;padding:22px;border:none;border-radius:18px;background:#fff;color:var(--sos);font:inherit;font-size:22px;font-weight:800;cursor:pointer}
  /* intervento, ronde, diario */
  .sec-h{margin:var(--s-4) var(--s-2) var(--s-10)}
  .nav-link{display:inline-flex;align-items:center;min-height:40px;margin-bottom:var(--s-8)}
  .access-note{background:var(--warn-soft);border-left:3px solid var(--warn);margin:var(--s-6) 0}
  .cp-item{border:1px solid var(--line);border-radius:8px;padding:var(--s-8);gap:var(--s-8)}
  .cl-item{gap:var(--s-8);margin:var(--s-2) 0;min-height:40px}
  .mat-item{display:flex;gap:var(--s-6);align-items:center}
  .att-thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;margin:var(--s-2)}
  .ta-60{width:100%;height:60px}
  .flbl{font-size:13px;font-weight:inherit;color:var(--mut)} /* etichetta di campo con l'aspetto di .small.mut */
  .lbl{font-size:12.5px;font-weight:600;color:var(--mut)}
  .msg-err{color:var(--bad);min-height:var(--s-16)}
  .t-bad{color:var(--bad)} .t-ok{color:var(--ok)} .t-warn{color:var(--warn)}
  .mt-2{margin-top:var(--s-2)} .mt-4{margin-top:var(--s-4)} .mt-6{margin-top:var(--s-6)} .mt-8{margin-top:var(--s-8)}
  .mt-10{margin-top:var(--s-10)} .mt-12{margin-top:var(--s-12)}
  .mb-2{margin-bottom:var(--s-2)} .mb-6{margin-bottom:var(--s-6)} .mb-8{margin-bottom:var(--s-8)} .mb-10{margin-bottom:var(--s-10)} .mb-18{margin-bottom:var(--s-18)}
  .my-4{margin-top:var(--s-4);margin-bottom:var(--s-4)} .my-6{margin-top:var(--s-6);margin-bottom:var(--s-6)}
  .my-8{margin-top:var(--s-8);margin-bottom:var(--s-8)} .my-10{margin-top:var(--s-10);margin-bottom:var(--s-10)} .my-14{margin-top:var(--s-14);margin-bottom:var(--s-14)}
  .gap-4{gap:var(--s-4)} .gap-6{gap:var(--s-6)} .gap-8{gap:var(--s-8)} .gap-10{gap:var(--s-10)} .gap-16{gap:var(--s-16)}
  .jc-center{justify-content:center} .jc-end{justify-content:flex-end} .blk{display:block} .flex-0{flex:0} .minw-0{min-width:0}
  .w-60{width:60px} .w-90{width:90px} .fs-12{font-size:12px}
  /* FE-16: focus sempre visibile da tastiera / lettore di schermo */
  .btn:focus-visible,.act:focus-visible,a:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .sosbtn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
  .imm-ok:focus-visible,.sos-call:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style></head><body>
<div id="root"></div>
<script src="/app.js"></script>
<script src="/i18n-en.js"></script><script src="/i18n.js"></script>
<script>
let ME=null, CI=null, CITimer=null, ORDERS=[], AIVOICE=false, AIAGENT=false, MODS=new Set();
async function loadMods(){ try{ const M=await api('/modules'); MODS=new Set((M||[]).filter(m=>m.state==='attivo').map(m=>m.code)); }catch(e){ MODS=new Set(); } }
// P1/P4: la PWA mostra solo le funzioni dei moduli ATTIVI sul tenant. Senza loneworker non
// compaiono SOS/check-in/tracking (altrimenti creerebbero allarmi che nessuna Centrale vedrebbe);
// il diario appare solo con un modulo Campo (workforce/interventi) attivo.
function safetyWorker(){ return MODS.has('loneworker'); }
function fieldDiary(){ return MODS.has('workforce')||MODS.has('interventi'); }
(async function(){ try{ME=await api('/me'); if(ME.is_super||!ME.tenant_id)ME=null;}catch(e){ME=null;}
  if(ME){ await loadMods(); try{ const A=await api('/ai/features'); AIVOICE=!!(A&&A.features&&A.features.voice_diary); AIAGENT=!!(A&&A.features&&A.features.agent); }catch(e){ AIVOICE=false; AIAGENT=false; } }
  ME?app():login(); })();

// FE-16: finestra a scheda (bottom-sheet) accessibile: ruolo dialog, fuoco dentro la scheda, Esc chiude.
function wDialog(m,label,onEsc){
  const sh=m.querySelector('.sheet')||m;
  sh.setAttribute('role','dialog'); sh.setAttribute('aria-modal','true'); sh.setAttribute('aria-label',label); sh.tabIndex=-1;
  if(onEsc) m.addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.preventDefault(); onEsc(); } });
  setTimeout(()=>{ if(!sh.contains(document.activeElement)) try{ sh.focus(); }catch(e){} },0);
}

function login(){
  $('#root').innerHTML=`<main class="wrap w-login">
    <div class="row gap-10 jc-center mb-18"><div class="logo">${ICON.logomark}</div>
      <h1 class="w-title">App lavoratore</h1>${ywI18n.select()}</div>
    <div class="card"><div class="card-b col">
      <div class="field"><label for="slug">Tenant${store.slugFromHost?' <span class="small mut">(dal dominio)</span>':''}</label><input id="slug" value="${esc(store.slug)}" autocapitalize="none" spellcheck="false" aria-describedby="slugHint">
        ${store.slugFromHost?`<div class="small mut" id="slugHint">L'azienda è indicata dall'indirizzo. Per un'altra azienda scrivi il suo nome e premi Accedi.</div>`:''}</div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="nome@azienda.it"></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
      <button class="btn block lg" id="go">Accedi</button>
      <div class="small center msg-err" id="msg" role="alert"></div>
    </div></div></main>`;
  $('#go').onclick=async()=>{ const want=$('#slug').value.trim().toLowerCase();
    if(store.slugFromHost && want && want!==store.slug){ // tenant dal sottodominio: si apre l'indirizzo dell'altra azienda
      if(!/^[a-z0-9][a-z0-9-]{0,39}$/.test(want)){ toast('Nome dell\'azienda non valido','bad'); return; }
      location.href=location.protocol+'//'+want+'.'+location.host.split('.').slice(1).join('.')+location.pathname; return; }
    store.slug=want; try{
    await api('/login',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#pw').value})});
    ME=await api('/me'); await loadMods();
    try{ const A=await api('/ai/features'); AIVOICE=!!(A&&A.features&&A.features.voice_diary); AIAGENT=!!(A&&A.features&&A.features.agent); }catch(e){}
    app(); }catch(e){ $('#msg').textContent=loginErrorText(e); } };
  $('#pw').onkeydown=e=>{ if(e.key==='Enter') $('#go').click(); };
  // FE-12: credenziali di prova precompilate SOLO in ambiente demo/dev (default: produzione, campi vuoti).
  loginInfo().then(li=>{ if(!li.demo) return; const em=$('#email'), pw=$('#pw');
    if(em&&!em.value) em.value='mario@acme.loneworker.eu'; if(pw&&!pw.value) pw.value='demo'; });
}

function app(){
  $('#root').innerHTML=`
  <header class="whead"><div class="logo logo-sm">${ICON.logomark}</div>
    <strong class="grow">Ciao, ${esc(ME.email.split('@')[0])}</strong>
    ${ywI18n.select()}
    <button class="btn-ico btn ghost" onclick="toggleTheme()" title="Tema" aria-label="Cambia tema chiaro/scuro">${ICON.moon}</button>
    <button class="btn-ico btn ghost" onclick="out()" title="Esci" aria-label="Esci">${ICON.logout}</button></header>
  <main class="wrap col gap-16">
    ${safetyWorker()?`<button type="button" class="sosbtn" onclick="sos()" aria-label="SOS: invia una richiesta di soccorso alla centrale" aria-describedby="sosNote">${ICON.sos} SOS</button>
    <div class="small mut center sos-note" id="sosNote">Il canale SOS è indipendente da dettatura e documenti.</div>

    <section class="card" aria-label="Condivisione posizione"><div class="card-b" id="trackBox"></div></section>

    <section class="card" aria-label="Check-in sicurezza"><div class="card-b" id="ciBox"></div></section>`:''}

    ${MODS.has('workforce')?`<section><h3 class="sec-h">Turno</h3><div class="card"><div class="card-b" id="shiftBox" aria-live="polite"></div></div></section>`:''}
    ${MODS.has('workforce')?`<section><h3 class="sec-h">Turni pianificati</h3><div id="plansBox" class="col"></div></section>`:''}

    ${MODS.has('interventi')?`<section><h3 class="sec-h">Oggi · ordini assegnati</h3><div id="orders" class="col"></div></section>`:''}

    <section id="patrolsSec" style="display:none"><h3 class="sec-h">Ronde</h3><div id="patrols" class="col"></div></section>

    ${fieldDiary()?`<section><h3 class="sec-h">Azioni</h3><div class="col gap-10">
      <button type="button" class="act" onclick="openNote()"><span class="ic" aria-hidden="true">${ICON.mic}</span>
        <span class="grow">Detta una nota di lavoro</span><span class="tag" id="noteBadge"></span></button>
      ${AIAGENT?`<button type="button" class="act" onclick="openAgent()"><span class="ic" aria-hidden="true">✦</span>
        <span class="grow">Assistente AI sul campo</span><span class="tag">agente</span></button>`:''}
    </div>
    <div class="small mut center mt-8">Input manuale sempre disponibile. La dettatura usa il riconoscimento vocale del browser; se assente o negato, scrivi a mano.</div>
    <div id="diaryList" class="col gap-8 mt-10" aria-live="polite"></div></section>`:''}
  </main>`;
  if(safetyWorker()){ renderCheckin(); renderTracking(); restoreCI(); immPoll(); hbTick(); }
  if(MODS.has('interventi')) loadOrders();
  if(MODS.has('workforce')){ renderShift(); loadPlans(); } // turno nell'app solo con Gestione turni (PO 25/11)
  if(fieldDiary()){ loadDiary(); flushNotes(); }
  loadPatrols();
  // ripristina la condivisione posizione se era attiva (solo se safety attivo)
  if(safetyWorker()){ let want=false; try{ want=localStorage.getItem('yw_track')==='1'; }catch(e){}
    if(want) startTracking(true); }
}
// CA-22: stati e tipi con etichette leggibili (mai codici grezzi)
const PLAN_ST_LAB={pianificato:'Pianificato (da confermare)',confermato:'Confermato',annullato:'Annullato',svolto:'Svolto',completato:'Svolto'};
const CP_KIND_LAB={qr:'QR',nfc:'NFC',beacon:'Beacon',gps:'GPS'};
async function loadPlans(){
  const b=$('#plansBox'); if(!b)return;
  let P; try{ P=await api('/shift-plans'); }catch(e){ b.innerHTML=errorBox(e,'loadPlans()'); return; }
  const fut=P.filter(p=>p.state!=='annullato').slice(0,6);
  if(!fut.length){ b.innerHTML='<div class="card"><div class="card-b small mut">Nessun turno pianificato</div></div>'; return; }
  const dt=iso=>new Date(iso).toLocaleString(ywI18n.locale(),{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  b.innerHTML=fut.map(p=>`<div class="card"><div class="card-b">
    <div class="spread"><b>${dt(p.starts_at)} → ${new Date(p.ends_at).toLocaleTimeString(ywI18n.locale(),{hour:'2-digit',minute:'2-digit'})}</b>
      <span class="chip ${p.state==='confermato'?'s-attivo':''}">${esc(PLAN_ST_LAB[p.state]||humanizeCode(p.state))}</span></div>
    <div class="small mut mt-4">${esc(p.site||'—')}${p.note?' · '+esc(p.note):''}</div>
    ${p.state==='pianificato'?`<button class="btn block mt-10" onclick="planConfirm('${p.id}')">Conferma turno</button>`:''}
  </div></div>`).join('');
}
async function planConfirm(id){ try{ await api('/shift-plans/'+id,{method:'POST',body:JSON.stringify({action:'confirm'})}); toast('Turno confermato','ok'); loadPlans(); }catch(e){toast(e,'bad');} }

async function out(){ try{ await api('/logout',{method:'POST'}); }catch(e){} location.reload(); }

// ---- SOS (SL-10) ----
// Ogni pressione ha una chiave stabile: l'SOS resta in coda (anche se l'app viene chiusa o ricaricata)
// e viene ritentato finché la centrale non lo riceve; il server riconosce i ritentativi (stesso SOS,
// nessun doppione). Finché non è consegnato compare un avviso con la chiamata di emergenza.
const SOS_KEY='yw_sos_pending', EMERGENCY_NUMBER='112';
let SOS_TIMER=null;
function sosPending(){ try{ return JSON.parse(localStorage.getItem(SOS_KEY)||'null'); }catch(e){ return null; } }
function sosSave(p){ try{ p?localStorage.setItem(SOS_KEY,JSON.stringify(p)):localStorage.removeItem(SOS_KEY); }catch(e){} }
// FE-16: avviso con ruolo alertdialog (non modale: l'app resta usabile); al primo comparire il fuoco va
// sul pulsante di chiamata. I ritentativi aggiornano solo il contatore, senza ricreare l'avviso.
function sosBanner(p){
  let b=document.getElementById('sosPend');
  if(!p){ if(b) b.remove(); return; }
  if(!b){ b=document.createElement('div'); b.id='sosPend'; b.className='sos-pend';
    b.setAttribute('role','alertdialog'); b.setAttribute('aria-modal','false');
    b.setAttribute('aria-labelledby','sosPendT'); b.setAttribute('aria-describedby','sosPendD');
    b.innerHTML=`<b id="sosPendT">SOS non ancora consegnato</b><div class="msg" id="sosPendD">Riprovo in automatico (tentativo <span id="sosTries">${p.tries||1}</span>). Se sei in pericolo chiama subito i soccorsi.</div>
    <a class="sos-call" href="tel:${EMERGENCY_NUMBER}">Chiama ${EMERGENCY_NUMBER}</a>`;
    document.body.appendChild(b); const a=b.querySelector('.sos-call'); if(a) try{ a.focus(); }catch(e){} }
  else { const t=document.getElementById('sosTries'); if(t) t.textContent=p.tries||1; }
}
async function sosSend(){
  const p=sosPending(); if(!p) return;
  try{ await api('/sos',{method:'POST',body:JSON.stringify(p.body)});
    sosSave(null); sosBanner(null); clearTimeout(SOS_TIMER); SOS_TIMER=null;
    toast('SOS inviato → centrale allertata','bad');
  }catch(e){
    // rifiuto definitivo (es. SOS non attivo per l'azienda, 400/403): ritentare non serve, si dice
    // chiaramente di chiamare i soccorsi. Rete assente, server giù o sessione da rinnovare: si ritenta.
    if(e && (e.status===400 || e.status===403)){ sosSave(null); clearTimeout(SOS_TIMER); SOS_TIMER=null; sosRefused(e); return; }
    p.tries=(p.tries||1)+1; sosSave(p); sosBanner(p);
    clearTimeout(SOS_TIMER); SOS_TIMER=setTimeout(sosSend, Math.min(30000, 3000*p.tries));
  }
}
function sosRefused(e){
  let b=document.getElementById('sosPend'); if(b) b.remove();
  b=document.createElement('div'); b.id='sosPend'; b.className='sos-pend';
  b.setAttribute('role','alertdialog'); b.setAttribute('aria-modal','false');
  b.setAttribute('aria-labelledby','sosPendT'); b.setAttribute('aria-describedby','sosPendD');
  b.innerHTML=`<b id="sosPendT">SOS non inviato</b><div class="msg" id="sosPendD">${esc(friendlyError(e))}. Se sei in pericolo chiama subito i soccorsi.</div>
    <a class="sos-call" href="tel:${EMERGENCY_NUMBER}">Chiama ${EMERGENCY_NUMBER}</a>
    <button class="btn ghost block mt-10" onclick="this.closest('#sosPend').remove()">Chiudi</button>`;
  document.body.appendChild(b); const a=b.querySelector('.sos-call'); if(a) try{ a.focus(); }catch(x){}
}
async function sos(){
  if(sosPending()){ sosSend(); return; }           // già in coda: nessun secondo SOS, si ritenta subito
  const key=(crypto.randomUUID?crypto.randomUUID():(Date.now()+'-'+Math.random().toString(16).slice(2)));
  const body={client_key:key};
  sosSave({body,tries:1});                           // salvato PRIMA della posizione: niente persi
  sosBanner(sosPending());
  try{ const p=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000,enableHighAccuracy:true}));
    Object.assign(body,{lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy}); sosSave({body,tries:1}); }catch(e){}
  sosSend();
}
// ---- Immobilità (SL-2): preavviso «Stai bene?» prima dell'allarme ----
let IMM_TIMER=null, IMM_SHOWN=false;
function immBeep(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(), g=c.createGain();
  o.frequency.value=880; o.connect(g); g.connect(c.destination); g.gain.value=0.25; o.start(); o.stop(c.currentTime+0.4); }catch(e){} }
function immShow(sec){
  let m=document.getElementById('immModal');
  if(!m){ m=document.createElement('div'); m.id='immModal'; m.className='imm-ov';
    m.setAttribute('role','alertdialog'); m.setAttribute('aria-modal','true');
    m.setAttribute('aria-labelledby','immT'); m.setAttribute('aria-describedby','immD');
    m.innerHTML=`<div class="imm-t" id="immT">Stai bene?</div>

let WATCH=null, LASTSENT=0;
function trackingOn(){ return WATCH!==null; }
function startTracking(auto){
  if(WATCH!==null) return;
  if(!navigator.geolocation){ if(!auto)toast('Geolocalizzazione non disponibile','warn'); renderTracking(); return; }
  WATCH=navigator.geolocation.watchPosition(async p=>{
    const t=Date.now(); if(t-LASTSENT<15000) return;  // max ~1 invio/15s
    LASTSENT=t;
    const body={lat:p.coords.latitude,lon:p.coords.longitude,speed:p.coords.speed||null};
    try{ await api('/worker/position',{method:'POST',body:JSON.stringify(body)}); }catch(e){}
  }, e=>{ /* negato/errore: lascia il toggle, l'utente riprova */ }, {enableHighAccuracy:true,maximumAge:10000,timeout:20000});
  try{ localStorage.setItem('yw_track','1'); }catch(e){}
  renderTracking();
  if(!auto) toast('Condivisione posizione attiva','ok');
}
function stopTracking(manual){
  if(WATCH!==null){ try{navigator.geolocation.clearWatch(WATCH);}catch(e){} WATCH=null; }
  if(manual){ try{localStorage.setItem('yw_track','0');}catch(e){} }
  renderTracking();
}
function toggleTracking(){ trackingOn()?stopTracking(true):startTracking(false); }
function renderTracking(){
  const b=$('#trackBox'); if(!b)return;
  const on=trackingOn();
  b.innerHTML=`<div class="spread"><b>Condivisione posizione</b>
    <span class="chip ${on?'s-attivo':''}" role="status">${on?'attiva':'spenta'}</span></div>
    <div class="small mut mt-6 mb-10">${on?'La centrale vede la tua posizione in tempo reale durante il lavoro.':'Attivala per farti localizzare in caso di emergenza.'}</div>

}

async function doPunch(cid,kind){
  const body={checkpoint_id:cid};
  if(kind==='gps'){
    if(!navigator.geolocation){ toast('GPS non disponibile','bad'); return; }
    toast('Rilevo posizione…','warn');
    try{ const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:10000}));
      body.lat=pos.coords.latitude; body.lon=pos.coords.longitude; }catch(e){ toast('Posizione negata','bad'); return; }
  } else {
    // CA-2: l'app dichiara COME ha ottenuto il codice; il digitato a mano resta tale (e il percorso
    // può non ammetterlo). Il codice atteso non arriva mai qui.
    let code=null, entry='manuale';
    if(kind==='qr'){ code=await scanQR(); if(code!==null) entry='scansione'; }
    else if(kind==='nfc'){ code=await scanNFC(); if(code!==null) entry='nfc'; }
    if(code===null){
      if(PATROL_ROUND.manual_code_allowed===false){ toast('Su questo percorso serve la scansione: '+(kind==='nfc'?'avvicina il tag NFC':'inquadra il codice QR'),'bad'); return; }
      code=await askPrompt('Scansione non riuscita: digita il codice scritto sul punto di controllo (verrà registrato come inserimento manuale)');
    }
    if(!code)return; body.code=code; body.entry=entry;
    // posizione come prova aggiuntiva, se disponibile in fretta (non blocca la punzonatura)
    if(navigator.geolocation){ try{ const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:4000,maximumAge:30000}));
      body.lat=pos.coords.latitude; body.lon=pos.coords.longitude; }catch(e){} }
  }
  try{ const r=await api('/patrol-rounds/'+PATROL_ROUND.id+'/punch',{method:'POST',body:JSON.stringify(body)});
    PATROL_ROUND=r.round; toast(r.ok?'Punzonatura registrata':('Punzonatura non riuscita: '+(r.reason||'codice non valido')), r.ok?'ok':'bad'); renderRound(); }catch(e){toast(e,'bad');}
}
// Scanner QR nativo (BarcodeDetector + camera). null = non disponibile/annullato -> fallback manuale.
async function scanQR(){
  if(!('BarcodeDetector' in window) || !navigator.mediaDevices?.getUserMedia) return null;
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
  catch(e){ return null; }
  const det=new BarcodeDetector({formats:['qr_code','code_128','ean_13','data_matrix']});
  return await new Promise(resolve=>{
    const ov=document.createElement('div'); ov.className='scan-ov';
    ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','Inquadra il codice QR del punto di controllo');
    ov.innerHTML='<div class="scan-box"><video playsinline aria-label="Anteprima della fotocamera"></video><div class="scan-frame" aria-hidden="true"></div><button class="btn block ghost scan-cancel">Annulla / digita</button></div>';
    document.body.appendChild(ov);
    const video=ov.querySelector('video'); video.srcObject=stream; video.play();
    let done=false;
    const finish=v=>{ if(done)return; done=true; try{stream.getTracks().forEach(t=>t.stop());}catch(e){} ov.remove(); resolve(v); };
    ov.querySelector('.scan-cancel').onclick=()=>finish(null);
    ov.addEventListener('keydown',e=>{ if(e.key==='Escape') finish(null); });
    try{ ov.querySelector('.scan-cancel').focus(); }catch(e){}
    const tick=async()=>{ if(done)return;
      try{ const codes=await det.detect(video); if(codes&&codes.length){ return finish(codes[0].rawValue); } }catch(e){}
      requestAnimationFrame(tick); };
    video.onloadedmetadata=()=>tick();
    setTimeout(()=>finish(null),30000); // timeout di sicurezza
  });
}
// Scanner NFC nativo (Web NFC / NDEFReader, Android Chrome). null = non disponibile -> fallback.
async function scanNFC(){
  if(!('NDEFReader' in window)) return null;
  try{ const r=new NDEFReader(); await r.scan();
    toast('Avvicina il tag NFC…','warn');
    return await new Promise(resolve=>{
      const to=setTimeout(()=>resolve(null),15000);
      r.onreading=ev=>{ clearTimeout(to);
        let txt=ev.serialNumber||'';
        try{ for(const rec of ev.message.records){ const d=new TextDecoder().decode(rec.data); if(d){txt=d;break;} } }catch(e){}
        resolve(txt||null); };
      r.onreadingerror=()=>{ clearTimeout(to); resolve(null); };
    });
  }catch(e){ return null; }
}

async function exSave(id,send){ const body=exCollect();
  try{ await api('/orders/'+id+'/report',{method:'POST',body:JSON.stringify(body)});
    try{ localStorage.removeItem('yw_draft_'+id); }catch(e){}
    if(send){ const o=(ORDERS||[]).find(x=>x.id===id)||{}; try{ await api('/orders/'+id+'/complete',{method:'POST',body:JSON.stringify({version:o.version,outcome:body.outcome_kind||'completato'})}); toast('Rapporto inviato','ok'); }catch(e){ toast('Salvato, chiusura: '+friendlyError(e),'warn'); } }
    else toast('Bozza salvata (server)','ok');
    const m=document.querySelector('.modal'); if(m)m.remove(); loadOrders();
  }catch(e){ // offline: conserva SOLO i dati testuali (no foto/doc)
    try{ localStorage.setItem('yw_draft_'+id, JSON.stringify(body)); }catch(_){}
    toast('Offline: bozza in attesa (le foto restano online)','warn'); const m=document.querySelector('.modal'); if(m)m.remove(); loadOrders(); } }
async function flushDrafts(){ for(const o of (ORDERS||[])){ const k='yw_draft_'+o.id; let d=null; try{ d=localStorage.getItem(k); }catch(e){}
  if(d){ try{ await api('/orders/'+o.id+'/report',{method:'POST',body:d}); localStorage.removeItem(k); }catch(e){} } } }
async function exAttLoad(id){ const el=$('#exAtt'); if(!el)return; try{ const A=await api('/orders/'+id+'/attachments');
  el.innerHTML=(A||[]).filter(a=>a.kind!=='signature').map(a=>`<a href="/api/orders/attachments/${a.id}" target="_blank" ${a.content_type&&a.content_type.startsWith('image/')?'':'aria-label="Documento allegato"'}>${a.content_type&&a.content_type.startsWith('image/')?`<img src="/api/orders/attachments/${a.id}" class="att-thumb" alt="Foto allegata">`:'📄'}</a>`).join('')||'<span class="small mut">nessuna</span>'; }catch(e){ el.textContent='—'; } }
async function exPhoto(id){ const f=$('#exFile'); const file=f&&f.files&&f.files[0]; if(!file){ toast('Scegli una foto','bad'); return; }
  try{ const res=await fetch('/api/orders/'+id+'/attachments?'+new URLSearchParams({kind:'photo',filename:file.name}),{method:'POST',credentials:'include',headers:{'x-tenant-slug':store.slug,'x-csrf-token':csrfToken(),'content-type':file.type||'image/jpeg'},body:file});
    if(!res.ok) throw new Error('HTTP '+res.status); f.value=''; toast('Foto caricata','ok'); exAttLoad(id);
  }catch(e){ toast('Foto: '+friendlyError(e),'bad'); } }
// Prompt non-bloccante (window.prompt è bloccato in alcune webview): bottom-sheet con Promise.
function askPrompt(msg,val){ return new Promise(res=>{
  const m=document.createElement('div'); m.className='modal';
  m.onclick=e=>{ if(e.target===m){ try{m.remove();}catch(x){} res(null); } };
  m.innerHTML=`<div class="sheet"><b id="_wpMsg">${esc(msg)}</b>
    <input id="_wpIn" value="${esc(val||'')}" class="my-10" aria-labelledby="_wpMsg">
    <div class="row gap-8 jc-end"><button class="btn ghost" data-no>Annulla</button><button class="btn" data-yes>OK</button></div></div>`;
  const inp=m.querySelector('#_wpIn'); const done=v=>{ try{m.remove();}catch(e){} res(v); };
  m.querySelector('[data-no]').onclick=()=>done(null); m.querySelector('[data-yes]').onclick=()=>done(inp.value);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')done(inp.value); if(e.key==='Escape')done(null); });
  document.body.appendChild(m); wDialog(m,msg); inp.focus(); inp.select();
}); }
async function oComplete(id,v){ const o=await askPrompt('Esito intervento?','completato'); if(o==null)return;
  try{ await api('/orders/'+id+'/complete',{method:'POST',body:JSON.stringify({version:v,outcome:o})}); toast('Completato','ok'); loadOrders(); }catch(e){toast(e,'bad');} }

// ---- Prompt 8: turni (server-confirmed) ----
async function renderShift(){
  const b=$('#shiftBox'); if(!b)return; let s=null; try{ s=await api('/shifts/current'); }catch(e){}
  if(s&&s.active){
    const t=new Date(s.started_at).toLocaleTimeString(ywI18n.locale(),{hour:'2-digit',minute:'2-digit'});
    const el=s.elapsed_minutes||0, h=Math.floor(el/60), m=el%60;
    const warn=s.over_max?`<div class="small t-bad mt-6" role="alert">⚠ Oltre il massimo di ${s.max_hours}h — considera la chiusura</div>`:'';
    b.innerHTML=`<div class="spread"><b>Turno in corso</b><span class="chip ${s.over_max?'':'s-attivo'}">${s.over_max?'oltre soglia':'confermato dal server'}</span></div>
      <div class="small mut mt-6 mb-2">Iniziato alle ${t} · ${h}h ${m}m (max ${s.max_hours}h)</div>${warn}<div id="hbNote">${hbNote()}</div>
      <button class="btn block mt-12" onclick="shiftEnd()"><span aria-hidden="true">${ICON.stop}</span> Termina turno</button>`;
  } else {
    b.innerHTML=`<div class="spread"><b>Turno</b><span class="chip">non iniziato</span></div>
      <button class="btn block mt-10" onclick="shiftStart()"><span aria-hidden="true">${ICON.play}</span> Inizia turno</button>`;
  }
}
async function shiftStart(){ try{ const r=await api('/shifts/start',{method:'POST',body:'{}'});
  toast(r.reused?'Turno già in corso':'Turno iniziato (confermato dal server)','ok'); renderShift();
  startTracking(true); if(safetyWorker()) hbTick(); }catch(e){toast(e,'bad');} }
async function shiftEnd(){ try{ await api('/shifts/end',{method:'POST'}); toast('Turno terminato (confermato dal server)','ok'); renderShift();
  stopTracking(true); }catch(e){toast(e,'bad');} }

// ---- Prompt 8: nota di lavoro (dettatura browser + fallback offline) ----
let REC=null, dictationUsed=false;
function openNote(){
  dictationUsed=false;
  const opts=(ORDERS||[]).map(o=>`<option value="${o.id}">${esc(o.title)}</option>`).join('');
  const m=document.createElement('div'); m.className='modal'; m.id='noteModal';
  m.onclick=(e)=>{ if(e.target===m) closeNote(); };
  m.innerHTML=`<div class="sheet">
    <div class="spread"><b>Nota di lavoro</b><button class="btn-ico btn ghost" onclick="closeNote()" title="Chiudi" aria-label="Chiudi">✕</button></div>
    <div class="field mt-8"><label for="noteBody">Testo (voce o manuale)</label>
      <textarea id="noteBody" rows="4" placeholder="Scrivi o usa il microfono…"></textarea></div>
    <div class="row gap-8 mb-6">
      <button class="btn ghost" id="micBtn" onclick="toggleDictation()"><span aria-hidden="true">${ICON.mic}</span> Detta</button>
      ${AIVOICE?`<button class="btn ghost" id="srvBtn" onclick="toggleServerRec()"><span aria-hidden="true">${ICON.mic}</span> Detta (AI)</button>`:''}
      <span class="small mut grow" id="micState" role="status" aria-live="polite"></span></div>
    ${(ORDERS||[]).length?`<div class="field"><label for="noteOrder">Collega a ordine (opzionale)</label><select id="noteOrder"><option value="">—</option>${opts}</select></div>`:''}
    <button class="btn block lg mt-10" onclick="saveNote()">Salva nota</button>
  </div>`;
  document.body.appendChild(m); wDialog(m,'Nota di lavoro',closeNote);
}
function closeNote(){ stopDictation(); const m=$('#noteModal'); if(m)m.remove(); }
// Agente AI sul campo: analizza e registra (diario/consuntivo). Sensibili -> conferma.
function openAgent(){
  const m=document.createElement('div'); m.className='modal'; m.id='agModal';
  m.onclick=(e)=>{ if(e.target===m) m.remove(); };
  m.innerHTML=`<div class="sheet">
    <div class="spread"><b>Assistente AI</b><button class="btn-ico btn ghost" onclick="document.getElementById('agModal').remove()" title="Chiudi" aria-label="Chiudi">✕</button></div>
    <div class="field mt-8"><label for="agGoal">Cosa ti serve?</label>
      <textarea id="agGoal" rows="3" placeholder="es. «registra nota: impianto verificato, tutto ok», «quanti miei ordini sono aperti?»"></textarea></div>
    <button class="btn block lg" onclick="agentGo(this)">✦ Esegui</button>
    <div id="agOut" class="mt-10" aria-live="polite"></div></div>`;
  document.body.appendChild(m); wDialog(m,'Assistente AI',()=>m.remove());
}
async function agentGo(btn){
  const goal=($('#agGoal').value||'').trim(); if(!goal)return toast('Scrivi una richiesta','warn');
  const box=$('#agOut'); btn.disabled=true; box.innerHTML='<div class="small mut">L\'agente lavora…</div>';
  try{ const r=await api('/ai/agent',{method:'POST',body:JSON.stringify({goal})});
    let h=''; if(r.answer) h+=`<div class="card pad mb-8">${esc(r.answer)}</div>`;
    (r.actions||[]).forEach(a=>{ h+=`<div class="small">${a.error?'⚠ ':'✓ '}${esc(a.name)}${a.wrote?' — salvato':''}${a.error?' ('+esc(a.error)+')':''}</div>`; });
    (r.pending||[]).forEach(p=>{ h+=`<div class="card pad mt-6"><div class="small">Confermi: <b>${esc(p.name)}</b>?</div>
      <button class="btn block" onclick='agentConf(this,${jattr(p)})'>Conferma</button></div>`; });
    box.innerHTML=h||'<div class="small mut">Nessuna azione.</div>'; loadDiary();
  }catch(e){ box.innerHTML=`<div class="small t-bad" role="alert">${esc(friendlyError(e))}</div>`; }
  finally{ btn.disabled=false; }
}
async function agentConf(btn,p){ btn.disabled=true;
  try{ await api('/ai/agent/confirm',{method:'POST',body:JSON.stringify({name:p.name,args:p.args})}); toast('Fatto','ok'); btn.outerHTML='<span class="small">✓ salvato</span>'; loadDiary(); }
  catch(e){ btn.disabled=false; toast(e,'bad'); } }
function toggleDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const st=$('#micState');
  if(!SR){ st.textContent='Riconoscimento vocale non disponibile — scrivi a mano'; return; }
  if(REC){ stopDictation(); return; }
  REC=new SR(); REC.lang=ywI18n.locale(); REC.interimResults=true; REC.continuous=true;
  const ta=$('#noteBody'); const base=ta.value;
  REC.onresult=(e)=>{ let txt=''; for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript; ta.value=(base?base+' ':'')+txt; dictationUsed=true; };
  REC.onerror=(e)=>{ st.textContent='Microfono: '+e.error+' — scrivi a mano'; stopDictation(); };
  REC.onend=()=>{ const b=$('#micBtn'); if(b)b.classList.remove('on'); };
  try{ REC.start(); $('#micBtn').classList.add('on'); st.textContent='In ascolto…'; }
  catch(e){ st.textContent='Microfono non avviabile'; REC=null; }
}
function stopDictation(){ if(REC){ try{REC.stop();}catch(e){} REC=null; } const b=$('#micBtn'); if(b)b.classList.remove('on'); const s=$('#micState'); if(s&&s.textContent==='In ascolto…')s.textContent=''; }
// Dettatura server-side: registra audio e trascrive via youworker.ai (STT). Fallback = scrivere a mano.
let MR=null, CHUNKS=[], MRStream=null;
async function toggleServerRec(){
  const st=$('#micState'), b=$('#srvBtn');
  if(MR){ try{MR.stop();}catch(e){} return; }
  if(!navigator.mediaDevices||!window.MediaRecorder){ st.textContent='Registrazione non disponibile — scrivi a mano'; return; }
  try{ MRStream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ st.textContent='Microfono negato — scrivi a mano'; return; }
  CHUNKS=[]; MR=new MediaRecorder(MRStream);
  MR.ondataavailable=e=>{ if(e.data&&e.data.size)CHUNKS.push(e.data); };
  MR.onstop=async()=>{ if(b)b.classList.remove('on'); if(MRStream){MRStream.getTracks().forEach(t=>t.stop());MRStream=null;}
    const blob=new Blob(CHUNKS,{type:(MR&&MR.mimeType)||'audio/webm'}); MR=null;
    if(!blob.size){ st.textContent=''; return; }
    st.textContent='Trascrivo (youworker.ai)…';
    try{ const r=await fetch('/api/diary/transcribe',{method:'POST',headers:{'content-type':blob.type,'x-tenant-slug':store.slug||'','x-csrf-token':csrfToken()},body:blob});
      if(!r.ok){ throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status)); }
      const j=await r.json(); const ta=$('#noteBody'); ta.value=(ta.value?ta.value+' ':'')+(j.text||''); dictationUsed=true; st.textContent='Trascritta — rivedi e salva'; }
    catch(e){ st.textContent='Trascrizione non riuscita: '+friendlyError(e)+' — scrivi a mano'; } };
  MR.start(); if(b)b.classList.add('on'); st.textContent='Registrazione… premi di nuovo per fermare';
}
async function saveNote(){
  const ta=$('#noteBody'); const body=(ta.value||'').trim(); if(!body){ toast('Nota vuota','warn'); return; }
  const sel=$('#noteOrder'); const wo=sel&&sel.value?sel.value:null;
  const note={ body, work_order_id:wo, source:dictationUsed?'voce':'manuale',
    idem_key:'n-'+Date.now()+'-'+Math.random().toString(36).slice(2,7) };
  closeNote(); await sendNote(note);
}
async function sendNote(note){
  try{ const r=await api('/diary',{method:'POST',body:JSON.stringify(note)});
    toast(r.deduplicated?'Nota già registrata':'Nota salvata (server)','ok'); loadDiary();
  }catch(e){ queueNote(note); toast('Offline: nota salvata sul dispositivo, invio appena possibile','warn'); loadDiary(); }
}
function pend(){ try{return JSON.parse(localStorage.getItem('yw_notes')||'[]');}catch(e){return [];} }
function setPend(a){ try{localStorage.setItem('yw_notes',JSON.stringify(a));}catch(e){} }
function queueNote(n){ const a=pend(); a.push(n); setPend(a); }
async function flushNotes(){ let a=pend(); if(!a.length)return; const keep=[];
  for(const n of a){ try{ await api('/diary',{method:'POST',body:JSON.stringify(n)}); }catch(e){ keep.push(n); } }
  setPend(keep); loadDiary(); }
function updateNoteBadge(){ const b=$('#noteBadge'); if(!b)return; const n=pend().length; b.textContent=n?n+' offline':''; b.className='tag'+(n?' warn':''); }
async function loadDiary(){
  const box=$('#diaryList'); if(!box)return;
  // le note offline restano sempre visibili; se il server non risponde lo si dice
  let server=[], srvErr=null; try{ server=await api('/diary'); }catch(e){ srvErr=e; }
  const off=pend().map(n=>`<div class="card pad"><div class="spread"><span class="small">${esc(n.body.slice(0,60))}</span><span class="chip warn">in attesa (offline)</span></div></div>`).join('');
  const sv=server.slice(0,5).map(e=>`<div class="card pad"><div class="spread"><span class="small">${esc(e.body.slice(0,60))}</span><span class="chip ${e.source==='voce'?'s-attivo':''}">${e.source} · salvata</span></div></div>`).join('');
  box.innerHTML=off+(srvErr?errorBox(srvErr,'loadDiary()'):sv); updateNoteBadge();
}
window.addEventListener('online', flushNotes);

if('serviceWorker' in navigator) navigator.serviceWorker.register('/worker/sw.js').catch(()=>{});
</script>
