<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Lavoratore · YouWorkforce</title>
<link rel="icon" href="/youworkforce.webp" type="image/webp">
<link rel="apple-touch-icon" href="/youworkforce.webp">
<link rel="manifest" href="/worker/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
<style>
  body{background:var(--bg)}
  .wrap{max-width:460px;margin:0 auto;padding:14px 14px 30px}
  .whead{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .sosbtn{width:100%;border:none;border-radius:20px;background:linear-gradient(160deg,#ff5468,#d81e36);color:#fff;
    padding:26px;font-size:22px;font-weight:800;letter-spacing:.02em;cursor:pointer;box-shadow:0 10px 30px rgba(216,30,54,.4);
    display:flex;align-items:center;justify-content:center;gap:12px}
  .sosbtn:active{transform:scale(.98)}
  .sosbtn svg{width:30px;height:30px}
  .count{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .act{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border:1px solid var(--line);background:var(--surface);
    border-radius:14px;font-weight:600;cursor:pointer;color:var(--fg);text-align:left}
  .act:active{background:var(--surface2)} .act svg{width:22px;height:22px;color:var(--brand-ink)}
  .act .ic{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;flex:none}
  .tag.warn{background:rgba(245,158,11,.18);color:#b45309}
  .chip.warn{background:rgba(245,158,11,.18);color:#b45309}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(2,6,23,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:460px;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px 26px;
    border-top:1px solid var(--line);max-height:88vh;overflow:auto}
  .sheet textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);padding:10px;font:inherit;resize:vertical}
  #micBtn.on{background:var(--bad);color:#fff;border-color:transparent}
</style></head><body>
<div id="root"></div>
<script src="/app.js"></script>
<script>
let ME=null, CI=null, CITimer=null, ORDERS=[], AIVOICE=false, AIAGENT=false;
(async function(){ try{ME=await api('/me'); if(ME.is_super||!ME.tenant_id)ME=null;}catch(e){ME=null;}
  if(ME){ try{ const A=await api('/ai/features'); AIVOICE=!!(A&&A.features&&A.features.voice_diary); AIAGENT=!!(A&&A.features&&A.features.agent); }catch(e){ AIVOICE=false; AIAGENT=false; } }
  ME?app():login(); })();

function login(){
  $('#root').innerHTML=`<div class="wrap" style="min-height:100vh;display:flex;flex-direction:column;justify-content:center">
    <div class="row" style="gap:10px;justify-content:center;margin-bottom:18px"><div class="logo">${ICON.logomark}</div>
      <strong style="font-size:18px">App lavoratore</strong></div>
    <div class="card"><div class="card-b col">
      <div class="field"><label>Tenant${store.slugFromHost?' <span class="small mut">(dal dominio)</span>':''}</label><input id="slug" value="${store.slug}" ${store.slugFromHost?'readonly':''}></div>
      <div class="field"><label>Email</label><input id="email" value="mario@acme.loneworker.eu"></div>
      <div class="field"><label>Password</label><input id="pw" type="password" value="demo"></div>
      <button class="btn block lg" id="go">Accedi</button>
      <div class="small center" id="msg" style="color:var(--bad);min-height:16px"></div>
    </div></div></div>`;
  $('#go').onclick=async()=>{ store.slug=$('#slug').value.trim(); try{
    await api('/login',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#pw').value})});
    ME=await api('/me'); app(); }catch(e){ $('#msg').textContent='Credenziali non valide'; } };
}

function app(){
  $('#root').innerHTML=`
  <div class="whead"><div class="logo" style="width:26px;height:26px">${ICON.logomark}</div>
    <strong class="grow">Ciao, ${esc(ME.email.split('@')[0])}</strong>
    <button class="btn-ico btn ghost" onclick="toggleTheme()">${ICON.moon}</button>
    <button class="btn-ico btn ghost" onclick="out()">${ICON.logout}</button></div>
  <div class="wrap col" style="gap:16px">
    <button class="sosbtn" onclick="sos()">${ICON.sos} SOS</button>
    <div class="small mut center" style="margin-top:-6px">Il canale SOS è indipendente da dettatura e documenti.</div>

    <div class="card"><div class="card-b" id="trackBox"></div></div>

    <div class="card"><div class="card-b" id="ciBox"></div></div>

    <div><h3 style="margin:4px 2px 10px">Turno</h3><div class="card"><div class="card-b" id="shiftBox"></div></div></div>

    <div><h3 style="margin:4px 2px 10px">Turni pianificati</h3><div id="plansBox" class="col"></div></div>

    <div><h3 style="margin:4px 2px 10px">Oggi · ordini assegnati</h3><div id="orders" class="col"></div></div>

    <div><h3 style="margin:4px 2px 10px">Azioni</h3><div class="col" style="gap:10px">
      <button class="act" onclick="openNote()"><span class="ic">${ICON.mic}</span>
        <span class="grow">Detta una nota di lavoro</span><span class="tag" id="noteBadge"></span></button>
      ${AIAGENT?`<button class="act" onclick="openAgent()"><span class="ic">✦</span>
        <span class="grow">Assistente AI sul campo</span><span class="tag">agente</span></button>`:''}
    </div>
    <div class="small mut center" style="margin-top:8px">Input manuale sempre disponibile. La dettatura usa il riconoscimento vocale del browser; se assente o negato, scrivi a mano.</div>
    <div id="diaryList" class="col" style="gap:8px;margin-top:10px"></div></div>
  </div>`;
  renderCheckin(); loadOrders(); renderShift(); loadPlans(); loadDiary(); flushNotes();
  renderTracking();
  // ripristina la condivisione posizione se era attiva (o se è in corso un turno)
  let want=false; try{ want=localStorage.getItem('yw_track')==='1'; }catch(e){}
  if(want) startTracking(true);
}
async function loadPlans(){
  const b=$('#plansBox'); if(!b)return;
  const P=await api('/shift-plans').catch(()=>[]);
  const fut=P.filter(p=>p.state!=='annullato').slice(0,6);
  if(!fut.length){ b.innerHTML='<div class="card"><div class="card-b small mut">Nessun turno pianificato</div></div>'; return; }
  const dt=iso=>new Date(iso).toLocaleString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  b.innerHTML=fut.map(p=>`<div class="card"><div class="card-b">
    <div class="spread"><b>${dt(p.starts_at)} → ${new Date(p.ends_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</b>
      <span class="chip ${p.state==='confermato'?'s-attivo':''}">${p.state}</span></div>
    <div class="small mut" style="margin-top:4px">${esc(p.site||'—')}${p.note?' · '+esc(p.note):''}</div>
    ${p.state==='pianificato'?`<button class="btn block" style="margin-top:10px" onclick="planConfirm('${p.id}')">Conferma turno</button>`:''}
  </div></div>`).join('');
}
async function planConfirm(id){ try{ await api('/shift-plans/'+id,{method:'POST',body:JSON.stringify({action:'confirm'})}); toast('Turno confermato','ok'); loadPlans(); }catch(e){toast(e.message,'bad');} }

async function out(){ try{ await api('/logout',{method:'POST'}); }catch(e){} location.reload(); }

// ---- SOS ----
async function sos(){
  let pos={}; try{ const p=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000,enableHighAccuracy:true}));
    pos={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy}; }catch(e){}
  try{ const r=await api('/sos',{method:'POST',body:JSON.stringify(pos)});
    toast('SOS inviato → centrale allertata','bad'); }catch(e){ toast('SOS errore: '+e.message,'bad'); }
}

// ---- Tracking posizione (watchPosition) legato al turno; bind sessione↔device lato server ----
let WATCH=null, LASTSENT=0;
function trackingOn(){ return WATCH!==null; }
function startTracking(auto){
  if(WATCH!==null) return;
  if(!navigator.geolocation){ if(!auto)toast('Geolocalizzazione non disponibile','warn'); renderTracking(); return; }
  WATCH=navigator.geolocation.watchPosition(async p=>{
    const t=Date.now(); if(t-LASTSENT<15000) return;  // max ~1 invio/15s
    LASTSENT=t;
    const body={lat:p.coords.latitude,lon:p.coords.longitude,speed:p.coords.speed||null};
    try{ await api('/worker/position',{method:'POST',body:JSON.stringify(body)}); }catch(e){}
  }, e=>{ /* negato/errore: lascia il toggle, l'utente riprova */ }, {enableHighAccuracy:true,maximumAge:10000,timeout:20000});
  try{ localStorage.setItem('yw_track','1'); }catch(e){}
  renderTracking();
  if(!auto) toast('Condivisione posizione attiva','ok');
}
function stopTracking(manual){
  if(WATCH!==null){ try{navigator.geolocation.clearWatch(WATCH);}catch(e){} WATCH=null; }
  if(manual){ try{localStorage.setItem('yw_track','0');}catch(e){} }
  renderTracking();
}
function toggleTracking(){ trackingOn()?stopTracking(true):startTracking(false); }
function renderTracking(){
  const b=$('#trackBox'); if(!b)return;
  const on=trackingOn();
  b.innerHTML=`<div class="spread"><b>Condivisione posizione</b>
    <span class="chip ${on?'s-attivo':''}">${on?'attiva':'spenta'}</span></div>
    <div class="small mut" style="margin:6px 0 10px">${on?'La centrale vede la tua posizione in tempo reale durante il lavoro.':'Attivala per farti localizzare in caso di emergenza.'}</div>
    <button class="btn ${on?'ghost':''} block" onclick="toggleTracking()">${on?'Interrompi condivisione':ICON.shield+' Condividi posizione'}</button>`;
}

// ---- check-in ----
function renderCheckin(){
  const b=$('#ciBox');
  if(!CI){ b.innerHTML=`<div class="spread" style="margin-bottom:10px"><b>Check-in sicurezza</b>${ICON.shield}</div>
    <div class="row"><div class="field grow"><label>Scadenza (min)</label><input id="min" type="number" value="5" min="1"></div>
      <div class="field" style="flex:0"><label>&nbsp;</label><button class="btn" onclick="startCI()">Avvia</button></div></div>`;
    return; }
  b.innerHTML=`<div class="spread"><b>Check-in attivo</b><span class="chip s-attivo">in corso</span></div>
    <div class="center" style="margin:14px 0"><div class="count" id="cd">--:--</div><div class="small mut">tempo rimanente</div></div>
    <button class="btn ok block" onclick="confirmCI()">${ICON.check} Conferma presenza</button>`;
  tickCI();
}
async function startCI(){ try{ const r=await api('/checkins',{method:'POST',body:JSON.stringify({minutes:Number($('#min').value)})});
  CI={id:r.id,due:new Date(r.due_at).getTime()}; renderCheckin(); toast('Check-in avviato','ok');
}catch(e){ toast(e.message,'bad'); } }
function tickCI(){ clearInterval(CITimer); CITimer=setInterval(()=>{ if(!CI)return clearInterval(CITimer);
  let s=Math.max(0,Math.round((CI.due-Date.now())/1000)); const cd=$('#cd'); if(!cd)return clearInterval(CITimer);
  cd.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  cd.style.color = s<=30 ? 'var(--bad)' : (s<=60?'var(--warn)':'var(--fg)');
  if(s<=0){ clearInterval(CITimer); cd.textContent='SCADUTO'; cd.style.color='var(--bad)'; toast('Check-in scaduto: incidente aperto','bad'); } },1000); }
async function confirmCI(){ if(!CI)return; try{ const r=await api('/checkins/'+CI.id+'/confirm',{method:'POST'});
  if(r.ok) toast('Presenza confermata','ok'); else toast('Già scaduto','warn');
  CI=null; clearInterval(CITimer); renderCheckin(); }catch(e){ toast(e.message,'bad'); } }

// ---- orders ----
async function loadOrders(){
  const box=$('#orders'); const O=await api('/orders').catch(()=>[]); ORDERS=O;
  const mine=O.filter(o=>['assegnato','in_corso'].includes(o.state));
  if(!mine.length){ box.innerHTML='<div class="card pad mut center">Nessun ordine per oggi</div>'; return; }
  const sched=o=>o.scheduled_start?new Date(o.scheduled_start).toLocaleString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):null;
  box.innerHTML=mine.map(o=>`<div class="card pad">
    <div class="spread"><b>${esc(o.title)}</b>${chip(o.state)}</div>
    ${sched(o)?`<div class="small" style="margin-top:4px">🕑 ${sched(o)}${o.priority>=3?' · <b style="color:var(--bad,#c0392b)">priorità alta</b>':''}</div>`:''}
    <div class="small mut" style="margin:4px 0 10px">${esc(o.site||'—')} ${o.instructions?'· '+esc(o.instructions):''}</div>
    ${o.state==='assegnato'?`<button class="btn block" onclick="oAct('${o.id}','start',${o.version})">${ICON.play} Avvia intervento</button>`:''}
    ${o.state==='in_corso'?`<button class="btn ok block" onclick="oComplete('${o.id}',${o.version})">${ICON.check} Completa</button>`:''}
  </div>`).join('');
}
async function oAct(id,act,v){ try{ await api('/orders/'+id+'/'+act,{method:'POST',body:JSON.stringify({version:v})}); toast('Avviato','ok'); loadOrders(); }catch(e){toast(e.message,'bad');} }
// Prompt non-bloccante (window.prompt è bloccato in alcune webview): bottom-sheet con Promise.
function askPrompt(msg,val){ return new Promise(res=>{
  const m=document.createElement('div'); m.className='modal';
  m.onclick=e=>{ if(e.target===m) res(null); };
  m.innerHTML=`<div class="sheet"><b>${esc(msg)}</b>
    <input id="_wpIn" value="${esc(val||'')}" style="width:100%;margin:10px 0">
    <div class="row" style="gap:8px;justify-content:flex-end"><button class="btn ghost" data-no>Annulla</button><button class="btn" data-yes>OK</button></div></div>`;
  const inp=m.querySelector('#_wpIn'); const done=v=>{ try{m.remove();}catch(e){} res(v); };
  m.querySelector('[data-no]').onclick=()=>done(null); m.querySelector('[data-yes]').onclick=()=>done(inp.value);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')done(inp.value); if(e.key==='Escape')done(null); });
  document.body.appendChild(m); inp.focus(); inp.select();
}); }
async function oComplete(id,v){ const o=await askPrompt('Esito intervento?','completato'); if(o==null)return;
  try{ await api('/orders/'+id+'/complete',{method:'POST',body:JSON.stringify({version:v,outcome:o})}); toast('Completato','ok'); loadOrders(); }catch(e){toast(e.message,'bad');} }

// ---- Prompt 8: turni (server-confirmed) ----
async function renderShift(){
  const b=$('#shiftBox'); if(!b)return; let s=null; try{ s=await api('/shifts/current'); }catch(e){}
  if(s&&s.active){
    const t=new Date(s.started_at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    const el=s.elapsed_minutes||0, h=Math.floor(el/60), m=el%60;
    const warn=s.over_max?`<div class="small" style="color:var(--bad,#c0392b);margin:6px 0 0">⚠ Oltre il massimo di ${s.max_hours}h — considera la chiusura</div>`:'';
    b.innerHTML=`<div class="spread"><b>Turno in corso</b><span class="chip ${s.over_max?'':'s-attivo'}">${s.over_max?'oltre soglia':'confermato dal server'}</span></div>
      <div class="small mut" style="margin:6px 0 2px">Iniziato alle ${t} · ${h}h ${m}m (max ${s.max_hours}h)</div>${warn}
      <button class="btn block" style="margin-top:12px" onclick="shiftEnd()">${ICON.stop} Termina turno</button>`;
  } else {
    b.innerHTML=`<div class="spread"><b>Turno</b><span class="chip">non iniziato</span></div>
      <button class="btn block" style="margin-top:10px" onclick="shiftStart()">${ICON.play} Inizia turno</button>`;
  }
}
async function shiftStart(){ try{ const r=await api('/shifts/start',{method:'POST',body:'{}'});
  toast(r.reused?'Turno già in corso':'Turno iniziato (confermato dal server)','ok'); renderShift();
  startTracking(true); }catch(e){toast(e.message,'bad');} }
async function shiftEnd(){ try{ await api('/shifts/end',{method:'POST'}); toast('Turno terminato (confermato dal server)','ok'); renderShift();
  stopTracking(true); }catch(e){toast(e.message,'bad');} }

// ---- Prompt 8: nota di lavoro (dettatura browser + fallback offline) ----
let REC=null, dictationUsed=false;
function openNote(){
  dictationUsed=false;
  const opts=(ORDERS||[]).map(o=>`<option value="${o.id}">${esc(o.title)}</option>`).join('');
  const m=document.createElement('div'); m.className='modal'; m.id='noteModal';
  m.onclick=(e)=>{ if(e.target===m) closeNote(); };
  m.innerHTML=`<div class="sheet">
    <div class="spread"><b>Nota di lavoro</b><button class="btn-ico btn ghost" onclick="closeNote()">✕</button></div>
    <div class="field" style="margin-top:8px"><label>Testo (voce o manuale)</label>
      <textarea id="noteBody" rows="4" placeholder="Scrivi o usa il microfono…"></textarea></div>
    <div class="row" style="gap:8px;align-items:center;margin-bottom:6px">
      <button class="btn ghost" id="micBtn" onclick="toggleDictation()">${ICON.mic} Detta</button>
      ${AIVOICE?`<button class="btn ghost" id="srvBtn" onclick="toggleServerRec()">${ICON.mic} Detta (AI)</button>`:''}
      <span class="small mut grow" id="micState"></span></div>
    ${(ORDERS||[]).length?`<div class="field"><label>Collega a ordine (opzionale)</label><select id="noteOrder"><option value="">—</option>${opts}</select></div>`:''}
    <button class="btn block lg" style="margin-top:10px" onclick="saveNote()">Salva nota</button>
  </div>`;
  document.body.appendChild(m);
}
function closeNote(){ stopDictation(); const m=$('#noteModal'); if(m)m.remove(); }
// Agente AI sul campo: analizza e registra (diario/consuntivo). Sensibili -> conferma.
function openAgent(){
  const m=document.createElement('div'); m.className='modal'; m.id='agModal';
  m.onclick=(e)=>{ if(e.target===m) m.remove(); };
  m.innerHTML=`<div class="sheet">
    <div class="spread"><b>Assistente AI</b><button class="btn-ico btn ghost" onclick="document.getElementById('agModal').remove()">✕</button></div>
    <div class="field" style="margin-top:8px"><label>Cosa ti serve?</label>
      <textarea id="agGoal" rows="3" placeholder="es. «registra nota: impianto verificato, tutto ok», «quanti miei ordini sono aperti?»"></textarea></div>
    <button class="btn block lg" onclick="agentGo(this)">✦ Esegui</button>
    <div id="agOut" style="margin-top:10px"></div></div>`;
  document.body.appendChild(m);
}
async function agentGo(btn){
  const goal=($('#agGoal').value||'').trim(); if(!goal)return toast('Scrivi una richiesta','warn');
  const box=$('#agOut'); btn.disabled=true; box.innerHTML='<div class="small mut">L\'agente lavora…</div>';
  try{ const r=await api('/ai/agent',{method:'POST',body:JSON.stringify({goal})});
    let h=''; if(r.answer) h+=`<div class="card pad" style="margin-bottom:8px">${esc(r.answer)}</div>`;
    (r.actions||[]).forEach(a=>{ h+=`<div class="small">${a.error?'⚠ ':'✓ '}${esc(a.name)}${a.wrote?' — salvato':''}${a.error?' ('+esc(a.error)+')':''}</div>`; });
    (r.pending||[]).forEach(p=>{ h+=`<div class="card pad" style="margin-top:6px"><div class="small">Confermi: <b>${esc(p.name)}</b>?</div>
      <button class="btn block" onclick='agentConf(this,${JSON.stringify(p).replace(/'/g,"&#39;")})'>Conferma</button></div>`; });
    box.innerHTML=h||'<div class="small mut">Nessuna azione.</div>'; loadDiary();
  }catch(e){ box.innerHTML=`<div class="small" style="color:var(--bad)">${esc(e.message)}</div>`; }
  finally{ btn.disabled=false; }
}
async function agentConf(btn,p){ btn.disabled=true;
  try{ await api('/ai/agent/confirm',{method:'POST',body:JSON.stringify({name:p.name,args:p.args})}); toast('Fatto','ok'); btn.outerHTML='<span class="small">✓ salvato</span>'; loadDiary(); }
  catch(e){ btn.disabled=false; toast(e.message,'bad'); } }
function toggleDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const st=$('#micState');
  if(!SR){ st.textContent='Riconoscimento vocale non disponibile — scrivi a mano'; return; }
  if(REC){ stopDictation(); return; }
  REC=new SR(); REC.lang='it-IT'; REC.interimResults=true; REC.continuous=true;
  const ta=$('#noteBody'); const base=ta.value;
  REC.onresult=(e)=>{ let txt=''; for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript; ta.value=(base?base+' ':'')+txt; dictationUsed=true; };
  REC.onerror=(e)=>{ st.textContent='Microfono: '+e.error+' — scrivi a mano'; stopDictation(); };
  REC.onend=()=>{ const b=$('#micBtn'); if(b)b.classList.remove('on'); };
  try{ REC.start(); $('#micBtn').classList.add('on'); st.textContent='In ascolto…'; }
  catch(e){ st.textContent='Microfono non avviabile'; REC=null; }
}
function stopDictation(){ if(REC){ try{REC.stop();}catch(e){} REC=null; } const b=$('#micBtn'); if(b)b.classList.remove('on'); const s=$('#micState'); if(s&&s.textContent==='In ascolto…')s.textContent=''; }
// Dettatura server-side: registra audio e trascrive via youworker.ai (STT). Fallback = scrivere a mano.
let MR=null, CHUNKS=[], MRStream=null;
async function toggleServerRec(){
  const st=$('#micState'), b=$('#srvBtn');
  if(MR){ try{MR.stop();}catch(e){} return; }
  if(!navigator.mediaDevices||!window.MediaRecorder){ st.textContent='Registrazione non disponibile — scrivi a mano'; return; }
  try{ MRStream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ st.textContent='Microfono negato — scrivi a mano'; return; }
  CHUNKS=[]; MR=new MediaRecorder(MRStream);
  MR.ondataavailable=e=>{ if(e.data&&e.data.size)CHUNKS.push(e.data); };
  MR.onstop=async()=>{ if(b)b.classList.remove('on'); if(MRStream){MRStream.getTracks().forEach(t=>t.stop());MRStream=null;}
    const blob=new Blob(CHUNKS,{type:(MR&&MR.mimeType)||'audio/webm'}); MR=null;
    if(!blob.size){ st.textContent=''; return; }
    st.textContent='Trascrivo (youworker.ai)…';
    try{ const r=await fetch('/api/diary/transcribe',{method:'POST',headers:{'content-type':blob.type,'x-tenant-slug':store.slug||'','x-csrf-token':csrfToken()},body:blob});
      if(!r.ok){ throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status)); }
      const j=await r.json(); const ta=$('#noteBody'); ta.value=(ta.value?ta.value+' ':'')+(j.text||''); dictationUsed=true; st.textContent='Trascritta — rivedi e salva'; }
    catch(e){ st.textContent='Trascrizione non riuscita: '+e.message+' — scrivi a mano'; } };
  MR.start(); if(b)b.classList.add('on'); st.textContent='Registrazione… premi di nuovo per fermare';
}
async function saveNote(){
  const ta=$('#noteBody'); const body=(ta.value||'').trim(); if(!body){ toast('Nota vuota','warn'); return; }
  const sel=$('#noteOrder'); const wo=sel&&sel.value?sel.value:null;
  const note={ body, work_order_id:wo, source:dictationUsed?'voce':'manuale',
    idem_key:'n-'+Date.now()+'-'+Math.random().toString(36).slice(2,7) };
  closeNote(); await sendNote(note);
}
async function sendNote(note){
  try{ const r=await api('/diary',{method:'POST',body:JSON.stringify(note)});
    toast(r.deduplicated?'Nota già registrata':'Nota salvata (server)','ok'); loadDiary();
  }catch(e){ queueNote(note); toast('Offline: nota salvata sul dispositivo, invio appena possibile','warn'); loadDiary(); }
}
function pend(){ try{return JSON.parse(localStorage.getItem('yw_notes')||'[]');}catch(e){return [];} }
function setPend(a){ try{localStorage.setItem('yw_notes',JSON.stringify(a));}catch(e){} }
function queueNote(n){ const a=pend(); a.push(n); setPend(a); }
async function flushNotes(){ let a=pend(); if(!a.length)return; const keep=[];
  for(const n of a){ try{ await api('/diary',{method:'POST',body:JSON.stringify(n)}); }catch(e){ keep.push(n); } }
  setPend(keep); loadDiary(); }
function updateNoteBadge(){ const b=$('#noteBadge'); if(!b)return; const n=pend().length; b.textContent=n?n+' offline':''; b.className='tag'+(n?' warn':''); }
async function loadDiary(){
  const box=$('#diaryList'); if(!box)return;
  const server=await api('/diary').catch(()=>[]);
  const off=pend().map(n=>`<div class="card pad"><div class="spread"><span class="small">${esc(n.body.slice(0,60))}</span><span class="chip warn">in attesa (offline)</span></div></div>`).join('');
  const sv=server.slice(0,5).map(e=>`<div class="card pad"><div class="spread"><span class="small">${esc(e.body.slice(0,60))}</span><span class="chip ${e.source==='voce'?'s-attivo':''}">${e.source} · salvata</span></div></div>`).join('');
  box.innerHTML=off+sv; updateNoteBadge();
}
window.addEventListener('online', flushNotes);

if('serviceWorker' in navigator) navigator.serviceWorker.register('/worker/sw.js').catch(()=>{});
</script>
</body></html>
