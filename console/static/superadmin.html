<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Superadmin · YouWorkforce</title><link rel="icon" href="/youworkforce.webp" type="image/webp"><link rel="apple-touch-icon" href="/youworkforce.webp"><link rel="stylesheet" href="/app.css"></head><body>
<div id="root"></div>
<style>
  .ct-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px;align-items:start}
  .ct-grid .span2{grid-column:span 2}
  .ct-grid .span3{grid-column:span 3}
  @media(max-width:760px){.ct-grid{grid-template-columns:1fr}.ct-grid .span2,.ct-grid .span3{grid-column:auto}}
  .ct-brand{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:stretch;margin-top:14px}
  @media(max-width:760px){.ct-brand{grid-template-columns:1fr}}
  .dz{display:flex;flex-direction:column;justify-content:center;gap:4px;border:2px dashed var(--line);border-radius:10px;
      padding:16px;text-align:center;cursor:pointer;transition:border-color .12s,background .12s;background:var(--bg2,#f7f7f8);min-height:84px}
  .dz:hover{border-color:var(--brand)} .dz.over{border-color:var(--brand);background:var(--brand-soft)}
  .dz input{display:none} .dz-t{font-size:13px;color:#6b7280} .dz-name{font-weight:600;font-size:13px}
  .colorset{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;align-content:flex-end}
  .chkline{display:inline-flex;gap:8px;align-items:center;white-space:nowrap;height:36px}
  .ct-foot{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-top:14px}
  /* cruscotto superadmin */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface,#fff)}
  .kpi .v{font-size:24px;font-weight:800;line-height:1.1}
  .kpi .k{font-size:11.5px;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
  .kpi.bad .v{color:var(--bad,#dc2626)} .kpi.warn .v{color:#b45309} .kpi.ok .v{color:#16a34a}
  .sa-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .fchip{border:1px solid var(--line);background:var(--surface,#fff);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
  .fchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* riga tenant compatta */
  .trow{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface,#fff);overflow:hidden}
  .trow-h{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
  .trow-h:hover{background:var(--bg2,#f7f7f8)}
  .trow-meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-left:auto}
  .tstat{font-size:12.5px;color:#6b7280;white-space:nowrap}
  .tstat b{color:var(--ink,#1a1a1a);font-size:13.5px}
  .tchev{transition:transform .15s;color:#9ca3af} .trow.open .tchev{transform:rotate(90deg)}
  .tdetail{padding:0 14px 14px;border-top:1px solid var(--line)}
  /* schede */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .tab{padding:10px 16px;cursor:pointer;font-weight:600;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand)}
  .pane{display:none} .pane.on{display:block}
  /* stato sistema */
  .sys-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .sys-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface,#fff)}
  .sys-card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:#6b7280}
  .meter{height:8px;border-radius:999px;background:#eceef1;overflow:hidden;margin:6px 0}
  .meter>i{display:block;height:100%;background:#16a34a}
  .meter.warn>i{background:#d97706} .meter.bad>i{background:#dc2626}
  .srow{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0}
  .srow .k{color:#6b7280} .srow .v{font-weight:600}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .dot.ok{background:#16a34a} .dot.warn{background:#d97706} .dot.bad{background:#dc2626}
  .alert-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:13.5px}
</style>
<script src="/app.js"></script>
<script>
let TENANTS=[];
(async function(){ try{ const me=await api('/me'); if(me.is_super) return shell(); }catch(e){} login(); })();

function login(){
  $('#root').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px;background:
    radial-gradient(1000px 500px at 50% -10%, var(--brand-soft), transparent), var(--bg)">
    <div class="card" style="width:380px;max-width:100%"><div class="card-b">
      <div class="row" style="gap:10px;margin-bottom:14px"><div class="logo">${ICON.logomark}</div>
        <div><h1 style="font-size:18px">Piano di controllo</h1><div class="small mut">tenants.loneworker.eu</div></div></div>
      <div class="col">
        <div class="field"><label>Email</label><input id="email" value="admin@loneworker.eu"></div>
        <div class="field"><label>Password</label><input id="pw" type="password" value="admin"></div>
        <button class="btn block lg" id="go">Accedi</button>
        <div class="small" id="msg" style="color:var(--bad);min-height:16px"></div>
      </div></div></div></div>`;
  $('#go').onclick=async()=>{ try{ await api('/superadmin/login',{method:'POST',
    body:JSON.stringify({email:$('#email').value,password:$('#pw').value})}); shell();
  }catch(e){ $('#msg').textContent='Credenziali non valide'; } };
  $('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click();};
}

async function shell(){
  $('#root').innerHTML=`
  <div class="topbar"><div class="logo" style="width:26px;height:26px">${ICON.logomark}</div><strong>Piano di controllo</strong>
    <span class="chip">superadmin</span><div class="grow"></div>
    <button id="themeBtn" class="btn-ico btn ghost" title="Tema" onclick="toggleTheme()">${themeIconHtml()}</button>
    <button class="btn-ico btn ghost" onclick="out()">${ICON.logout}</button></div>
  <div class="content">
    <div class="tabs">
      <div class="tab on" data-t="panoramica" onclick="saTab('panoramica')">Panoramica</div>
      <div class="tab" data-t="tenant" onclick="saTab('tenant')">Tenant</div>
      <div class="tab" data-t="sistema" onclick="saTab('sistema')">Sistema</div>
    </div>

    <div class="pane on" id="pane-panoramica">
      <div id="kpis" class="kpis"></div>
      <div class="card" style="margin-bottom:16px"><div class="card-h"><h2 id="sysOverall">Stato sistema</h2>
        <button class="btn ghost small" onclick="loadSystem()">↻ aggiorna</button></div>
        <div class="card-b" id="sysSummary"><div class="small mut">Carico…</div></div></div>
      <div class="card"><div class="card-h"><h2>Alert recenti</h2>
        <button class="btn ghost small" onclick="saTab('sistema')">vedi tutti</button></div>
        <div class="card-b" id="sysAlertsMini"><div class="small mut">—</div></div></div>
    </div>

    <div class="pane" id="pane-tenant">
      <div class="sa-toolbar">
        <h2 style="margin:0;margin-right:auto">Tenant</h2>
        <div class="fchip on" data-f="all" onclick="setFilter('all',this)">Tutti</div>
        <div class="fchip" data-f="operativo" onclick="setFilter('operativo',this)">Operativi</div>
        <div class="fchip" data-f="daconfig" onclick="setFilter('daconfig',this)">Da configurare</div>
        <div class="fchip" data-f="sospeso" onclick="setFilter('sospeso',this)">Sospesi</div>
        <input id="t_search" placeholder="🔎 cerca per nome o slug" oninput="tenantFilter()" style="min-width:200px">
        <button class="btn" onclick="toggleCreate()" id="c_toggle">+ Nuovo tenant</button>
      </div>
      <div id="createCard" style="display:none">
      <div class="card" style="margin-bottom:18px"><div class="card-h"><h2>Crea tenant</h2></div><div class="card-b">
      <div class="ct-grid">
        <div class="field"><label>Slug</label><input id="c_slug" placeholder="acme2" oninput="slugPrev()">
          <div id="c_slugprev" class="small mut">indirizzo: —</div></div>
        <div class="field"><label>Nome</label><input id="c_name" placeholder="Acme 2 Srl"></div>
        <div class="field"><label>Admin email</label><input id="c_email" placeholder="admin@acme2.eu"></div>

        <div class="field span2"><label>Attivazione admin</label>
          <select id="c_mode" onchange="modePw()">
            <option value="invite">Invito monouso (consigliato — nessuna password nota)</option>
            <option value="password">Imposta password (demo/dev)</option>
          </select></div>
        <div class="field" id="c_pwwrap" style="display:none"><label>Password (min 8)</label><input id="c_pw" type="text" placeholder="min 8 caratteri"></div>

        <div class="field"><label>Pacchetto (moduli attivati subito)</label>
          <select id="c_plan" onchange="planPrev()"><option value="">— nessuno (attiva dopo) —</option></select>
          <div id="c_planprev" class="small mut"></div></div>
        <div class="field"><label>Licenze app mobile</label><input id="c_lic_m" type="number" min="0" placeholder="illimitato"></div>
        <div class="field"><label>Licenze IoT</label><input id="c_lic_i" type="number" min="0" placeholder="illimitato"></div>

        <div class="field span2"><label>Scenario / caso d'uso (opzionale)</label>
          <select id="c_scn"><option value="">— nessuno —</option></select></div>
        <div class="field"><label>&nbsp;</label><label class="chkline"><input type="checkbox" id="c_scn_demo"> con dati demo</label></div>
      </div>

      <div class="ct-brand">
        <div class="field"><label>Logo <span class="small mut">(PNG, JPEG o WebP; PNG trasparente consigliato, 256×256px, max 512&nbsp;KB)</span></label>
          <label class="dz" id="c_logo_dz">
            <input id="c_logo" type="file" accept="image/png,image/jpeg,image/webp"
              onchange="document.getElementById('c_logo_name').textContent=this.files[0]?this.files[0].name:''">
            <div class="dz-t">⬆ Trascina qui il logo, oppure clicca per sfogliare</div>
            <div class="dz-name" id="c_logo_name"></div>
          </label></div>
        <div class="field"><label>Colori brand <span class="small mut">(vuoto = default YouCo)</span></label>
          <div class="colorset">${cColor('c_cp','Primario')}${cColor('c_ca','Accento')}${cColor('c_ck','Hover')}${cColor('c_cs','Soft')}</div></div>
      </div>

      <div class="ct-foot">
        <div class="small mut">Con l'invito, l'admin imposta da solo la password (valido 7 giorni). Logo/colori modificabili anche dopo da ⚙ Amministrazione.</div>
        <button class="btn" id="c_go">Crea tenant</button>
      </div>
      <div id="c_created"></div>
    </div></div>
      </div>
      <div id="list" class="col"></div>
    </div>

    <div class="pane" id="pane-sistema">
      <div class="card" style="margin-bottom:16px"><div class="card-h"><h2 id="sysOverall2">Stato sistema</h2>
        <button class="btn ghost small" onclick="loadSystem()">↻ aggiorna</button></div>
        <div class="card-b" id="sysDetail"><div class="small mut">Carico…</div></div></div>
      <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Configurazione monitoring</h2></div>
        <div class="card-b">
          <div class="small mut" style="margin-bottom:10px">Soglie di allerta e destinatari delle notifiche. Campo vuoto = usa il default.</div>
          <div class="ct-grid">
            <div class="field"><label>Soglia disco %</label><input id="ss_disk" type="number" min="1" max="100"></div>
            <div class="field"><label>Soglia memoria %</label><input id="ss_mem" type="number" min="1" max="100"></div>
            <div class="field"><label>Soglia CPU %</label><input id="ss_cpu" type="number" min="1" max="100"></div>
            <div class="field"><label>Worker fermo oltre (secondi)</label><input id="ss_worker" type="number" min="10" max="86400"></div>
            <div class="field span2"><label>Email destinatari alert <span class="small mut">(una o più, separate da virgola)</span></label><input id="ss_email" placeholder="ops@azienda.it, noc@azienda.it"></div>
            <div class="field"><label>Telefono SMS <span class="small mut">(E.164)</span></label><input id="ss_phone" placeholder="+39..."></div>
          </div>
          <div class="ct-foot"><div class="small mut">Le notifiche partono su email/SMS/webhook configurati. I canali esterni richiedono le relative credenziali lato prodotto.</div>
            <button class="btn" onclick="sysSettingsSave()">Salva configurazione</button></div>
          <div id="ss_msg" class="small" style="margin-top:6px"></div>
        </div></div>
      <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Dispositivi rifiutati</h2>
        <button class="btn ghost small" onclick="loadAttempts()">↻ aggiorna</button></div>
        <div class="card-b"><div class="small mut" style="margin-bottom:8px">Badge che provano a collegarsi (Teltonika, porta TCP) e vengono rifiutati: IMEI non censito, censito in più aziende, o azienda senza modulo dispositivi. Il badge riprova da solo: quando il problema è risolto la riga sparisce al collegamento successivo. Righe ferme da 30 giorni vengono cancellate.</div>
        <div id="sysAttempts"><div class="small mut">—</div></div></div></div>
      <div class="card"><div class="card-h"><h2>Storico alert</h2></div>
        <div class="card-b" id="sysAlerts"><div class="small mut">—</div></div></div>
    </div>
  </div>`;
  $('#c_go').onclick=create; ['c_cp','c_ca','c_ck','c_cs'].forEach(syncPair); slugPrev(); loadPlans(); load(); loadSystem();
}
function saTab(k){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===k));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+k));
  if(k==='sistema') loadSystem();
}
function toggleCreate(){ const c=$('#createCard'); const open=c.style.display==='none'; c.style.display=open?'':'none';
  $('#c_toggle').textContent=open?'× Chiudi':'+ Nuovo tenant'; if(open) $('#c_slug').focus(); }
// ===== Stato sistema (monitoring) =====
let SYS=null;
function fmtBytes(n){ if(n==null)return '—'; const u=['B','KB','MB','GB','TB']; let i=0,v=Number(n); while(v>=1024&&i<u.length-1){v/=1024;i++;} return v.toFixed(v<10&&i>0?1:0)+' '+u[i]; }
function fmtDur(s){ if(s==null||s<0)return '—'; s=Number(s); const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return (d?d+'g ':'')+(h?h+'h ':'')+m+'m'; }
function meter(pct,max){ pct=Number(pct)||0; max=Number(max)||100; const sev=pct>=max?'bad':(pct>=max-10?'warn':''); return `<div class="meter ${sev}"><i style="width:${Math.min(100,pct)}%"></i></div>`; }
function sevLabel(s){ return s==='bad'?'critico':(s==='warn'?'attenzione':'ok'); }
async function loadSystem(){
  try{ SYS=await api('/superadmin/system'); }catch(e){ SYS=null; }
  renderSysSummary(); renderSysDetail();
  let al=[]; try{ al=await api('/superadmin/system/alerts'); }catch(e){}
  renderSysAlerts(al);
  loadSysSettings();
  loadAttempts();
}
async function loadAttempts(){ const box=$('#sysAttempts'); if(!box) return;
  let rows=[]; try{ rows=await api('/superadmin/device-attempts'); }catch(e){ box.innerHTML=`<div class="small" style="color:var(--bad)">${esc(e.message)}</div>`; return; }
  if(!rows.length){ box.innerHTML='<div class="small mut">Nessun tentativo rifiutato.</div>'; return; }
  const fmt=t=>new Date(t).toLocaleString('it-IT');
  box.innerHTML=`<table class="table"><thead><tr><th>IMEI</th><th>Motivo</th><th>Aziende in cui è censito</th><th>Tentativi</th><th>Ultimo</th><th>Da</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td class="mono">${esc(r.identity)}</td><td>${esc(r.reason_label)}</td><td>${esc(r.tenants||'—')}</td><td>${r.attempts}</td>
      <td class="small">${esc(fmt(r.last_at))}<div class="mut">primo ${esc(fmt(r.first_at))}</div></td><td class="small mono">${esc(r.peer||'—')}</td></tr>`).join('')}</tbody></table>`; }
async function loadSysSettings(){
  let d; try{ d=await api('/superadmin/system/settings'); }catch(e){ return; }
  const st=d.stored||{}, df=d.defaults||{};
  const set=(id,v,ph)=>{ const el=$('#'+id); if(!el)return; el.value=(v==null?'':v); if(ph!=null) el.placeholder='default: '+ph; };
  set('ss_disk',st.disk_max_pct,df.disk_max_pct); set('ss_mem',st.mem_max_pct,df.mem_max_pct);
  set('ss_cpu',st.cpu_max_pct,df.cpu_max_pct); set('ss_worker',st.worker_stale_secs,df.worker_stale_secs);
  set('ss_email',st.alert_email); set('ss_phone',st.alert_phone);
}
async function sysSettingsSave(){
  const m=$('#ss_msg'); m.textContent=''; m.style.color='';
  const num=id=>{ const v=$('#'+id).value.trim(); return v===''?null:parseInt(v,10); };
  const body={ disk_max_pct:num('ss_disk'), mem_max_pct:num('ss_mem'), cpu_max_pct:num('ss_cpu'),
    worker_stale_secs:num('ss_worker'), alert_email:$('#ss_email').value.trim()||null, alert_phone:$('#ss_phone').value.trim()||null };
  try{ await api('/superadmin/system/settings',{method:'POST',body:JSON.stringify(body)});
    toast('Configurazione salvata','ok'); m.style.color='var(--ok,green)'; m.textContent='✓ salvato'; loadSystem();
  }catch(e){ m.style.color='var(--bad)'; m.textContent=e.message; }
}
function sysGridHtml(){
  const s=SYS, sv=s.server||{}, th=s.thresholds||{}, db=s.db||{}, q=s.queues||{}, w=s.worker||{}, app=s.app||{};
  return `<div class="sys-grid">
    <div class="sys-card"><h3>Server</h3>
      <div class="srow"><span class="k">Host</span><span class="v">${esc(sv.host||'—')}</span></div>
      <div class="srow"><span class="k">OS</span><span class="v">${esc((sv.os||'—')+' '+(sv.arch||''))}</span></div>
      <div class="srow"><span class="k">CPU (${sv.cpus||'?'} core)</span><span class="v">${sv.cpu_pct??'—'}%</span></div>${meter(sv.cpu_pct,th.cpu_max_pct)}
      <div class="srow"><span class="k">Memoria</span><span class="v">${fmtBytes(sv.mem_used)} / ${fmtBytes(sv.mem_total)} (${sv.mem_pct??'—'}%)</span></div>${meter(sv.mem_pct,th.mem_max_pct)}
      <div class="srow"><span class="k">Disco</span><span class="v">${fmtBytes(sv.disk_used)} / ${fmtBytes(sv.disk_total)} (${sv.disk_pct??'—'}%)</span></div>${meter(sv.disk_pct,th.disk_max_pct)}</div>
    <div class="sys-card"><h3>Applicazione &amp; DB</h3>
      <div class="srow"><span class="k">Versione core</span><span class="v">${esc(app.version||'—')}</span></div>
      <div class="srow"><span class="k">Uptime</span><span class="v">${fmtDur(app.uptime_secs)}</span></div>
      <div class="srow"><span class="k">Test clock</span><span class="v">${app.test_clock?'attivo':'no'}</span></div>
      <div class="srow"><span class="k">Database</span><span class="v">${db.reachable?'<span class="dot ok"></span>online':'<span class="dot bad"></span>offline'}</span></div>
      <div class="srow"><span class="k">Dimensione DB</span><span class="v">${fmtBytes(db.size_bytes)}</span></div>
      <div class="srow"><span class="k">Connessioni DB</span><span class="v">${db.connections??'—'}/${db.max_connections||'?'}</span></div>
      <div class="srow"><span class="k">Worker</span><span class="v">${(w.heartbeat_age_secs>=0)?(w.heartbeat_age_secs+'s fa'):'<span class="dot bad"></span>fermo'}</span></div></div>
    <div class="sys-card"><h3>Consegna allarmi</h3>
      <div class="srow"><span class="k">Modo</span><span class="v">${(s.delivery||{}).mode==='reale'?'<span class="dot ok"></span>reale':((s.delivery||{}).mode==='prova'?'<span class="dot warn"></span>di prova':'<span class="dot bad"></span>simulata')}</span></div>
      <div class="srow"><span class="k">SMS e chiamate</span><span class="v">${esc((s.delivery||{}).sms_voice||'—')}</span></div>
      <div class="srow"><span class="k">Email</span><span class="v">${esc((s.delivery||{}).email||'—')}</span></div>
      <div class="srow"><span class="k">Slack</span><span class="v">${esc((s.delivery||{}).slack||'—')}</span></div>
      <div class="small mut" style="margin-top:6px">${esc((s.delivery||{}).label||'')}</div></div>
    <div class="sys-card"><h3>Code &amp; carico</h3>
      <div class="srow"><span class="k">Tenant</span><span class="v">${q.tenants??'—'}</span></div>
      <div class="srow"><span class="k">Utenti</span><span class="v">${q.users??'—'}</span></div>
      <div class="srow"><span class="k">Dispositivi</span><span class="v">${q.devices??'—'}</span></div>
      <div class="srow"><span class="k">Incidenti aperti</span><span class="v">${q.incidents_open??'—'}</span></div>
      <div class="srow"><span class="k">Outbox in coda</span><span class="v">${q.outbox_pending??'—'}</span></div>
      <div class="srow"><span class="k">Outbox in errore</span><span class="v" style="${(q.outbox_error>0)?'color:var(--bad)':''}">${q.outbox_error??'—'}</span></div>
      <div class="srow"><span class="k">Sessioni</span><span class="v">${q.sessions??'—'}</span></div></div></div>`;
}
function renderSysSummary(){ const el=$('#sysSummary'); if(!el)return;
  if(!SYS){ el.innerHTML='<div class="small" style="color:var(--bad)">sistema non raggiungibile</div>'; const o=$('#sysOverall'); if(o)o.textContent='Stato sistema'; return; }
  const o=$('#sysOverall'); if(o) o.innerHTML=`<span class="dot ${SYS.status}"></span>Stato sistema — ${sevLabel(SYS.status)}`;

function askSuspend(name){ return new Promise(res=>{
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)';
  const def=new Date(Date.now()+7*864e5); def.setMinutes(0,0,0);
  const loc=new Date(def.getTime()-def.getTimezoneOffset()*6e4).toISOString().slice(0,16);
  m.innerHTML=`<div class="card" style="padding:16px;max-width:480px;width:92%">
    <h3 style="margin:0 0 8px">Sospendere «${esc(name)}»?</h3>
    <div class="small" style="margin-bottom:10px">Da sospeso il tenant <b>non riceve e non inoltra più allarmi</b> (SOS, uomo a terra, perdita di contatto, check-in): dispositivi e app vengono ignorati, i reperibili non sono avvisati, gli utenti sono disconnessi e non possono accedere.</div>
    <label class="row" style="gap:6px;align-items:center;margin:4px 0"><input type="radio" name="_sw" value="now"> Subito</label>
    <label class="row" style="gap:6px;align-items:center;margin:4px 0"><input type="radio" name="_sw" value="at" checked> Alla data <input type="datetime-local" data-at value="${loc}" style="margin-left:6px"></label>
    <div class="small mut" style="margin:2px 0 10px">Fino alla data l'amministratore del tenant vede un avviso con la data e le limitazioni.</div>
    <label class="small">Motivo / limitazioni (mostrati all'amministratore)<textarea data-note style="width:100%;height:60px;margin-top:4px" maxlength="500"></textarea></label>
    <div class="row" style="gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn ghost" data-no>Annulla</button><button class="btn" data-yes style="background:var(--bad)">Sospendi</button></div></div>`;
  const done=v=>{ try{m.remove();}catch(e){} res(v); };
  m.addEventListener('click',e=>{ if(e.target===m) done(null); });
  m.querySelector('[data-no]').onclick=()=>done(null);
  m.querySelector('[data-yes]').onclick=()=>{
    const when=m.querySelector('input[name=_sw]:checked').value;
    const note=m.querySelector('[data-note]').value.trim()||null;
    if(when==='now') return done({at:null,note});
    const v=m.querySelector('[data-at]').value; const d=v?new Date(v):null;
    if(!d||isNaN(d)||d<=new Date()){ toast('Scegli una data futura, oppure «Subito»','bad'); return; }
    done({at:d.toISOString(),note});
  };
  document.body.appendChild(m);
}); }

      <label class="small mut">Licenze dispositivi IoT <span class="chip">${t.iot_used} in uso</span><br><input id="li_${tid}" type="number" min="0" value="${t.iot_device_licenses??''}" placeholder="illimitato" style="width:140px"></label>
    </div>
    <h3 style="margin:16px 0 8px">Identità visiva</h3>
    <div class="small mut" style="margin-bottom:8px">Logo e colori principali dell'app per questo tenant. Vuoto = default globale YouCo (rosso/rosa).</div>
    <div class="row" style="gap:18px;align-items:flex-start;flex-wrap:wrap">
      <div><div class="small mut" style="margin-bottom:4px">Logo</div>
        <div style="width:64px;height:64px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden">
          ${t.has_logo?`<img src="/api/superadmin/tenants/${tid}/logo?ts=${Date.now()}" style="width:100%;height:100%;object-fit:contain">`:'<span class="small faint">nessuno</span>'}</div>
        <div class="row" style="gap:6px;margin-top:6px"><input id="logo_${tid}" type="file" accept="image/png,image/jpeg,image/webp" style="width:150px" class="small">
          <button class="btn ghost small" onclick="logoUpload('${tid}')">Carica</button>${t.has_logo?`<button class="btn ghost small" onclick="logoDel('${tid}')">✕</button>`:''}</div></div>
      <div><div class="small mut" style="margin-bottom:4px">Colore primario (bottoni/icone)</div>${ci('cp',t.brand_primary)}
        <div class="small mut" style="margin:8px 0 4px">Colore hover/testo</div>${ci('ck',t.brand_ink)}
        <div class="small mut" style="margin:8px 0 4px">Sfondo tenue</div>${ci('cs',t.brand_soft)}
        <div class="small mut" style="margin:8px 0 4px">Accento (gradiente, es. rosa)</div>${ci('ca',t.brand_accent)}</div>
    </div>
    <div class="row" style="gap:8px;margin-top:12px"><button class="btn" onclick="saveAdmin('${tid}')">Salva amministrazione</button>
      <span class="small mut">I colori hanno effetto per i tenant che aprono la loro console.</span></div>
    </div>`;
  // sincronizza color picker <-> campo hex
  ['cp','ck','cs','ca'].forEach(k=>{ const p=document.getElementById(k+'_'+tid), x=document.getElementById(k+'t_'+tid);
    if(p&&x){ p.oninput=()=>x.value=p.value; x.oninput=()=>{ if(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(x.value)) p.value=x.value; }; } });
}
async function saveAdmin(tid){
  const hex=k=>{ const x=document.getElementById(k+'t_'+tid).value.trim(); return x; };
  const numv=id=>{ const v=document.getElementById(id+'_'+tid).value.trim(); return v===''?null:parseInt(v,10); };
  const body={ mobile_app_licenses:numv('lm'), iot_device_licenses:numv('li'),
    brand_primary:hex('cp'), brand_ink:hex('ck'), brand_soft:hex('cs'), brand_accent:hex('ca') };
  try{ await api('/superadmin/tenants/'+tid+'/admin',{method:'POST',body:JSON.stringify(body)}); toast('Amministrazione salvata','ok'); load(); }
  catch(e){ toast(e.message,'bad'); }
}
// messaggio leggibile dal server (formato non ammesso, troppo grande), mai il solo codice HTTP
async function logoErr(res){ try{ const t=(await res.text()).trim(); if(t){ try{ const j=JSON.parse(t); if(j&&j.error) return j.error; }catch(e){} return t; } }catch(e){} return 'caricamento non riuscito'; }
async function logoUpload(tid){
  const f=document.getElementById('logo_'+tid).files&&document.getElementById('logo_'+tid).files[0];
  if(!f){ toast('Scegli un file','bad'); return; }
  try{ const res=await fetch('/api/superadmin/tenants/'+tid+'/logo',{method:'POST',credentials:'include',
      headers:{'x-csrf-token':csrfToken(),'content-type':f.type||'image/png'}, body:f});
    if(!res.ok) throw new Error(await logoErr(res)); toast('Logo caricato','ok'); load();
  }catch(e){ toast(e.message,'bad'); }
}
async function logoDel(tid){ try{ await api('/superadmin/tenants/'+tid+'/logo',{method:'DELETE'}); toast('Logo rimosso','ok'); load(); }catch(e){ toast(e.message,'bad'); } }
function askConfirm(msg){ return new Promise(res=>{
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)';
  m.innerHTML=`<div class="card" style="padding:16px;max-width:430px;width:92%"><div style="margin-bottom:14px">${esc(msg)}</div>
    <div class="row" style="gap:8px;justify-content:flex-end"><button class="btn ghost" data-no>Annulla</button><button class="btn" data-yes>Conferma</button></div></div>`;
  const done=v=>{ try{m.remove();}catch(e){} res(v); };
  m.addEventListener('click',e=>{ if(e.target===m) done(false); });
  m.querySelector('[data-no]').onclick=()=>done(false);
  m.querySelector('[data-yes]').onclick=()=>done(true);
  document.body.appendChild(m); const y=m.querySelector('[data-yes]'); if(y)y.focus();
}); }
// Prompt non-bloccante (window.prompt è bloccato in alcune webview). Ritorna stringa o null.
function askPrompt(msg,val){ return new Promise(res=>{
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)';
  m.innerHTML=`<div class="card" style="padding:16px;max-width:430px;width:92%"><div style="margin-bottom:10px;white-space:pre-line">${esc(msg)}</div>
    <input data-in value="${esc(val||'')}" style="width:100%;margin-bottom:12px">
    <div class="row" style="gap:8px;justify-content:flex-end"><button class="btn ghost" data-no>Annulla</button><button class="btn" data-yes>OK</button></div></div>`;
  const done=v=>{ try{m.remove();}catch(e){} res(v); };
  m.addEventListener('click',e=>{ if(e.target===m) done(null); });
  m.querySelector('[data-no]').onclick=()=>done(null);
  const inp=m.querySelector('[data-in]');
  m.querySelector('[data-yes]').onclick=()=>done(inp.value);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')done(inp.value); if(e.key==='Escape')done(null); });
  document.body.appendChild(m); inp.focus(); inp.select();
}); }
async function impersonate(tid){
  const t=tenantOf(tid);
  if(!await askConfirm('Impersonare l\'admin di '+(t.name||'questo tenant')+'? Entrerai nella sua console per supporto. L\'azione è tracciata.')) return;
  try{ await api('/superadmin/tenants/'+tid+'/impersonate',{method:'POST'}); location.href='/app.html'; }
  catch(e){ toast(e.message,'bad'); }
}
async function toggle(tid,code,cb){
  const state=cb.checked?'attivo':'non_abilitato';
  try{ await api('/superadmin/tenants/'+tid+'/modules',{method:'POST',body:JSON.stringify({module_code:code,state})});
    toast(code+' → '+state,'ok');
    // aggiorna conteggi locali senza ricaricare (la riga resta aperta)
    const t=TENANTS.find(x=>x.id===tid); if(t){ t.mods_active=Math.max(0,(t.mods_active||0)+(cb.checked?1:-1)); renderKpis(TENANTS); refreshRowHead(tid); }
  }catch(e){ cb.checked=!cb.checked; toast('Bloccato: '+e.message,'bad'); }
}
// Superadmin scope: decide WHICH tools each tenant may configure.
async function openTools(tid,btn){
  const box=document.getElementById('tools_'+tid);
  if(box.dataset.open){ box.innerHTML=''; box.dataset.open=''; btnOn(btn,false); return; }
  box.dataset.open='1'; btnOn(btn,true);
  const tools=await api('/superadmin/tenants/'+tid+'/tools').catch(()=>[]);
  const groups={}; tools.forEach(t=>{(groups[t.module_code]=groups[t.module_code]||[]).push(t);});
  box.innerHTML=Object.keys(groups).map(mc=>`<div style="border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px">
    <div class="small mut mono">${esc(mc)}</div>
    ${groups[mc].map(t=>`<div class="row" style="justify-content:space-between;margin-top:4px">
      <div class="small">${esc(t.name)}</div>
      <label class="switch"><input type="checkbox" ${t.enabled?'checked':''}
        onchange="toggleTool('${tid}',${jattr(t.module_code)},${jattr(t.tool_code)},this)"><span class="sl"></span></label>
    </div>`).join('')}</div>`).join('')||'<div class="small mut">nessuno strumento</div>';
}
async function aiConn(tid,btn){
  const box=document.getElementById('cfg_'+tid);
  if(box.dataset.open==='ai'){ box.innerHTML=''; box.dataset.open=''; btnOn(btn,false); return; }
  box.dataset.open='ai'; cfgExclusive(btn); btnOn(btn,true); box.innerHTML='<div class="small mut">carico…</div>';
  let c; try{ c=await api('/superadmin/tenants/'+tid+'/ai'); }catch(e){ c={configured:false}; }
  const prov=c.provider||'youworker'; const def=AI_PROV_DEF[prov]||AI_PROV_DEF.custom;
  box.innerHTML=`<div class="card" style="padding:12px">
    <div class="small mut" style="margin-bottom:8px">Provider AI del tenant: <b>youworker.ai</b> (AI di YouCo) o esterno (OpenAI, DeepSeek, Anthropic, custom). Base URL + API key (cifrata a riposo). Pilota tutti i processi AI e l'agente operativo. <b>Salva</b> registra e attiva la connessione; <b>Verifica</b> prova a raggiungere il provider (serve rete + chiave valida). Se non configurata, i processi AI usano il piano deterministico locale.</div>
    <label class="small mut" style="display:block;margin:4px 0">Provider<select id="ai_prov_${tid}" onchange="aiProvDefaults('${tid}')">
      ${['youworker','openai','deepseek','anthropic','custom'].map(p=>`<option value="${p}" ${prov===p?'selected':''}>${p}</option>`).join('')}</select></label>
    <label class="small mut" style="display:block;margin:4px 0">Base URL<input id="ai_url_${tid}" placeholder="https://api.openai.com" value="${esc(c.base_url||def.base)}"></label>
    <label class="small mut" style="display:block;margin:4px 0">API key${c.has_api_key?' <span class="small">(impostata — lascia vuoto per non cambiarla)</span>':''}<input id="ai_key_${tid}" type="password" placeholder="${c.has_api_key?'•••••• invariata':'sk-…'}"></label>
    <label class="small mut" style="display:block;margin:4px 0">Modello<input id="ai_model_${tid}" placeholder="${def.model||'modello'}" value="${esc(c.model||def.model)}"></label>
    <div class="row" style="gap:8px">
      <label class="small mut" style="flex:1">Chat path<input id="ai_chat_${tid}" placeholder="/v1/chat/completions" value="${esc(c.chat_path||def.chat)}"></label>
      <label class="small mut" style="flex:1">STT path<input id="ai_stt_${tid}" placeholder="/v1/audio/transcriptions" value="${esc(c.stt_path||def.stt)}"></label></div>
    <div class="row" style="gap:8px;margin-top:6px"><button class="btn" onclick="aiConnSave('${tid}')">Salva</button>
      <button class="btn ghost" onclick="aiVerify('${tid}')">Verifica collegamento</button>
      ${c.configured?'<span class="chip s-attivo">configurata</span>':'<span class="chip">assente</span>'}</div>
    <div id="ai_msg_${tid}" class="small mut" style="margin-top:6px"></div></div>`;
}
const AI_PROV_DEF={
  youworker:{base:'https://api.youworker.ai',model:'youworker-1',chat:'/v1/chat/completions',stt:'/v1/audio/transcriptions'},
  openai:{base:'https://api.openai.com',model:'gpt-4o-mini',chat:'/v1/chat/completions',stt:'/v1/audio/transcriptions'},
  deepseek:{base:'https://api.deepseek.com',model:'deepseek-chat',chat:'/chat/completions',stt:'/v1/audio/transcriptions'},
  anthropic:{base:'https://api.anthropic.com',model:'claude-3-5-sonnet-latest',chat:'/v1/messages',stt:'/v1/audio/transcriptions'},
  custom:{base:'',model:'',chat:'/v1/chat/completions',stt:'/v1/audio/transcriptions'},
};
function aiProvDefaults(tid){ const p=document.getElementById('ai_prov_'+tid).value; const d=AI_PROV_DEF[p]||AI_PROV_DEF.custom;
  const u=document.getElementById('ai_url_'+tid); if(u && d.base) u.value=d.base; // suggerimento base URL del provider
  document.getElementById('ai_model_'+tid).value=d.model;
  document.getElementById('ai_chat_'+tid).value=d.chat;
  document.getElementById('ai_stt_'+tid).value=d.stt; }
async function aiConnSave(tid){
  const provider=document.getElementById('ai_prov_'+tid).value;
  const url=document.getElementById('ai_url_'+tid).value.trim();
  const key=document.getElementById('ai_key_'+tid).value;
  const model=document.getElementById('ai_model_'+tid).value.trim();
  const chat=document.getElementById('ai_chat_'+tid).value.trim();
  const stt=document.getElementById('ai_stt_'+tid).value.trim();
  const msg=document.getElementById('ai_msg_'+tid);
  if(!url){ toast('Base URL obbligatorio: scegli un provider (precompila l\'URL) o incollalo','bad'); if(msg)msg.innerHTML='<span style="color:var(--bad)">Base URL mancante</span>'; return; }
  try{ const body={provider:provider,base_url:url,model:model,chat_path:chat,stt_path:stt}; if(key) body.api_key=key;
    await api('/superadmin/tenants/'+tid+'/ai',{method:'POST',body:JSON.stringify(body)});
    toast('Connessione AI salvata e attiva','ok'); if(msg)msg.innerHTML='<span class="s-attivo">salvata e attiva</span> — verifico la raggiungibilità…';
    aiVerify(tid); // feedback immediato sulla raggiungibilità (opzionale)
  }catch(e){ toast(e.message,'bad'); if(msg)msg.textContent=e.message; }
}
async function aiVerify(tid){
  const msg=document.getElementById('ai_msg_'+tid); if(msg && msg.textContent.indexOf('verifico')<0) msg.textContent='Verifico…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/ai/verify',{method:'POST'});
    if(msg) msg.innerHTML=r.reachable?`<span class="s-attivo">✓ ${esc(r.verdict)}</span>${r.sample?' · '+esc(r.sample):''}`:`<span style="color:var(--bad)">✗ ${esc(r.verdict)}</span> — la connessione è comunque salvata; controlla URL/chiave/rete.`;
    toast(r.reachable?'Provider AI collegato':'Salvata, ma provider non raggiungibile', r.reachable?'ok':'warn');
  }catch(e){ if(msg)msg.textContent=e.message; toast(e.message,'bad'); }
}
async function scnOpen(tid,btn){
  const box=document.getElementById('cfg_'+tid);
  if(box.dataset.open==='scn'){ box.innerHTML=''; box.dataset.open=''; btnOn(btn,false); return; }
  box.dataset.open='scn'; cfgExclusive(btn); btnOn(btn,true);
  scnRender(tid);
}
// Visibilità voci menu mappa (Mappa/Piantine) decisa dal superadmin: entrambe, una o nessuna.
async function mapVisOpen(tid,btn){
  const box=document.getElementById('cfg_'+tid);
  if(box.dataset.open==='mapvis'){ box.innerHTML=''; box.dataset.open=''; btnOn(btn,false); return; }
  box.dataset.open='mapvis'; cfgExclusive(btn); btnOn(btn,true); box.innerHTML='<div class="small mut">carico…</div>';
  let v; try{ v=await api('/superadmin/tenants/'+tid+'/map-visibility'); }catch(e){ box.innerHTML='<div class="small" style="color:var(--bad)">'+e.message+'</div>'; return; }
  box.innerHTML=`<div class="card" style="padding:12px"><div class="small mut" style="margin-bottom:8px">Quali voci di menu mappa vede l'admin del tenant (sezione Operations). Richiede un modulo dispositivi attivo (Traccar/IoT).</div>
    <label style="display:block;margin-bottom:6px"><input type="checkbox" id="mv_out_${tid}" ${v.map_outdoor?'checked':''}> <b>Mappa</b> (outdoor)</label>
    <label style="display:block;margin-bottom:10px"><input type="checkbox" id="mv_in_${tid}" ${v.map_indoor?'checked':''}> <b>Piantine</b> (indoor)</label>
    <button class="btn small" onclick="mapVisSave('${tid}')">Salva</button>
    <span id="mv_msg_${tid}" class="small mut" style="margin-left:8px"></span></div>`;
}
async function mapVisSave(tid){
  const out=document.getElementById('mv_out_'+tid).checked, ind=document.getElementById('mv_in_'+tid).checked;
  const msg=document.getElementById('mv_msg_'+tid); if(msg)msg.textContent='Salvo…';
  try{ await api('/superadmin/tenants/'+tid+'/map-visibility',{method:'POST',body:JSON.stringify({map_outdoor:out,map_indoor:ind})});
    toast('Visibilità menu mappa aggiornata','ok'); if(msg)msg.innerHTML='<span class="s-attivo">salvato</span> — l\'admin del tenant la vede al prossimo caricamento';
  }catch(e){ toast(e.message,'bad'); if(msg)msg.textContent=e.message; }
}
// Render del pannello scenari, indipendente dal toggle/pulsante (richiamabile dopo attiva/rimuovi).
async function scnRender(tid){
  const box=document.getElementById('cfg_'+tid); if(!box)return;
  box.innerHTML='<div class="small mut">carico…</div>';
  let cat=[], app=[];
  try{ [cat,app]=await Promise.all([api('/superadmin/scenarios'), api('/superadmin/tenants/'+tid+'/scenarios')]); }catch(e){ box.innerHTML='<div class="small" style="color:var(--bad)">'+e.message+'</div>'; return; }
  const applied=new Set(app.map(a=>a.code));
  const bySector={}; cat.forEach(s=>{ (bySector[s.sector]=bySector[s.sector]||[]).push(s); });
  let h=`<div class="card" style="padding:12px"><div class="small mut" style="margin-bottom:8px">Ambienti per casi d'uso IoT. Attivare uno scenario abilita i moduli, inserisce il bundle di regole sensori e (se spuntato) crea device + sito demo. Rimozione pulita; i moduli restano abilitati.</div>
    <label class="small mut" style="display:block;margin-bottom:8px"><input type="checkbox" id="scn_demo_${tid}" checked> crea anche device/sito demo</label>
    <div class="row" style="gap:6px;margin-bottom:8px"><button class="btn small" onclick="scnApplyAll('${tid}')">Attiva tutti (${cat.length})</button>
      <button class="btn ghost small" onclick="scnRemoveAll('${tid}')">Rimuovi tutti${app.length?' ('+app.length+')':''}</button></div>`;
  Object.keys(bySector).sort().forEach(sec=>{
    h+=`<div class="small mut" style="margin:8px 0 4px;text-transform:uppercase;letter-spacing:.5px">${esc(sec)}</div>`;
    bySector[sec].forEach(s=>{ const on=applied.has(s.code);
      h+=`<div class="spread" style="padding:6px 0;border-bottom:1px solid var(--line);align-items:flex-start;gap:10px">
        <div><b>${esc(s.name)}</b> ${on?'<span class="chip s-attivo">attivo</span>':''}
          <div class="small mut">${esc(s.desc)}</div>
          <div class="small mut">moduli: ${s.modules.map(m=>`<span class="chip">${esc(m)}</span>`).join(' ')} · ${s.rule_count} regole · ${s.device_count} device demo</div></div>
        <div class="row" style="gap:6px">${on?`<button class="btn ghost small" onclick="scnDemo('${tid}','${s.code}')" title="Inietta telemetria demo (allarmi reali)">⚡ Demo</button>
                   <button class="btn ghost small" onclick="scnRemove('${tid}','${s.code}',this)">Rimuovi</button>`
                  :`<button class="btn small" onclick="scnApply('${tid}','${s.code}')">Attiva</button>`}</div></div>`;
    });
  });
  h+=`<div id="scn_msg_${tid}" class="small mut" style="margin-top:8px"></div></div>`;
  box.innerHTML=h;
}
async function scnApply(tid,code){
  const demo=document.getElementById('scn_demo_'+tid).checked; const msg=document.getElementById('scn_msg_'+tid); if(msg)msg.textContent='Attivo…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/scenarios',{method:'POST',body:JSON.stringify({code,with_demo:demo})});
    toast('Scenario attivato ('+r.rules_added+' regole, '+r.devices_added+' device)','ok'); scnRender(tid);
  }catch(e){ toast(e.message,'bad'); if(msg)msg.textContent=e.message; }
}
async function scnApplyAll(tid){
  const demo=document.getElementById('scn_demo_'+tid).checked; const msg=document.getElementById('scn_msg_'+tid); if(msg)msg.textContent='Attivo tutti gli ambienti…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/scenarios/bulk',{method:'POST',body:JSON.stringify({action:'apply',with_demo:demo})});
    toast('Attivati '+r.applied+' ambienti ('+r.rules_added+' regole, '+r.devices_added+' device)','ok'); scnRender(tid);
  }catch(e){ toast(e.message,'bad'); if(msg)msg.textContent=e.message; }
}
// Rimozione di massa in due passi (no confirm() in webview): primo click arma, secondo conferma.
async function scnRemoveAll(tid){
  const msg=document.getElementById('scn_msg_'+tid);
  if(window._scnArmAll!==tid){ window._scnArmAll=tid; if(msg)msg.innerHTML=`<span style="color:var(--bad)">Clicca di nuovo “Rimuovi tutti” per confermare la rimozione di TUTTI gli ambienti.</span>`;
    setTimeout(()=>{ if(window._scnArmAll===tid) window._scnArmAll=null; }, 4000); return; }
  window._scnArmAll=null; if(msg)msg.textContent='Rimuovo tutti gli ambienti…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/scenarios/bulk',{method:'POST',body:JSON.stringify({action:'remove'})});
    toast('Rimossi '+r.removed+' ambienti ('+r.rules_removed+' regole)','ok'); scnRender(tid);
  }catch(e){ toast(e.message,'bad'); if(msg)msg.textContent=e.message; }
}
async function scnDemo(tid,code){
  const msg=document.getElementById('scn_msg_'+tid); if(msg)msg.textContent='Genero telemetria demo…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/scenarios/'+code+'/demo',{method:'POST'});
    toast('Telemetria demo: '+r.events+' eventi, '+r.incidents+' incidenti','ok');
    if(msg)msg.innerHTML=`<span class="s-attivo">✓ ${r.events} eventi · ${r.incidents} incidenti</span> (vedi Centrale allarmi del tenant)`;
  }catch(e){ toast(e.message,'bad'); if(msg)msg.textContent=e.message; }
}
// Rimozione in due passi senza confirm() (bloccato in alcune webview): primo click arma (il
// bottone diventa "Conferma rimozione"), secondo click conferma. Rimozione COMPLETA lato server
// (scenario + regole + device/eventi/incidenti demo).
async function scnRemove(tid,code,btn){
  const msg=document.getElementById('scn_msg_'+tid);
  if(window._scnArm!==code){
    window._scnArm=code;
    if(btn){ btn.dataset.lbl=btn.textContent; btn.textContent='Conferma rimozione'; btn.classList.add('on'); }
    if(msg)msg.innerHTML=`<span style="color:var(--bad)">Clicca di nuovo per confermare la rimozione di <b>${esc(code)}</b> (anche i dati demo).</span>`;
    setTimeout(()=>{ if(window._scnArm===code){ window._scnArm=null; if(btn){ btn.textContent=btn.dataset.lbl||'Rimuovi'; btn.classList.remove('on'); } } }, 5000);
    return;
  }
  window._scnArm=null; if(msg)msg.textContent='Rimuovo…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/scenarios/'+code,{method:'DELETE'});
    toast('Scenario rimosso ('+r.rules_removed+' regole, '+r.devices_removed+' device demo)','ok'); scnRender(tid);
  }catch(e){ toast(e.message,'bad'); if(msg)msg.textContent=e.message; }
}
</script>
</body></html>
