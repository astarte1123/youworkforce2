<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Superadmin · YouWorkforce</title><link rel="icon" href="/youworkforce.webp" type="image/webp"><link rel="apple-touch-icon" href="/youworkforce.webp"><link rel="stylesheet" href="/app.css"></head><body>
<div id="root"></div>
<style>
  /* FE-13: spaziature e colori solo dai token di app.css (--s-*, --mut, --bad, ...); niente stile inline nel
     markup. Restano in px solo misure senza token (raggi 10/12, larghezze campi, corpi del testo).
     FE-15: niente larghezze fisse che sforano, righe che vanno a capo, tabelle che scorrono nella card.
     FE-16: focus visibile, schede e finestre accessibili da tastiera. */
  .ct-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-14) var(--s-16);align-items:start}
  .ct-grid .span2{grid-column:span 2}
  .ct-grid .span3{grid-column:span 3}
  @media(max-width:760px){.ct-grid{grid-template-columns:1fr}.ct-grid .span2,.ct-grid .span3{grid-column:auto}}
  .ct-brand{display:grid;grid-template-columns:1fr auto;gap:var(--s-16);align-items:stretch;margin-top:var(--s-14)}
  @media(max-width:760px){.ct-brand{grid-template-columns:1fr}}
  .dz{position:relative;display:flex;flex-direction:column;justify-content:center;gap:var(--s-4);border:2px dashed var(--line);border-radius:10px;
      padding:var(--s-16);text-align:center;cursor:pointer;transition:border-color .12s,background .12s;background:var(--bg2);min-height:84px}
  .dz:hover,.dz:focus-within{border-color:var(--brand)} .dz.over{border-color:var(--brand);background:var(--brand-soft)}
  /* input file nascosto alla vista ma raggiungibile da tastiera (display:none lo toglieva dal Tab) */
  .dz input{position:absolute;width:1px;height:1px;padding:0;margin:0;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
  .dz:focus-within{outline:2px solid var(--brand);outline-offset:2px}
  .dz-t{font-size:13px;color:var(--mut)} .dz-name{font-weight:600;font-size:13px}
  .colorset{display:flex;gap:var(--s-12);align-items:flex-end;flex-wrap:wrap;align-content:flex-end}
  .chkline{display:inline-flex;gap:var(--s-8);align-items:center;white-space:nowrap;height:36px}
  .ct-foot{display:flex;justify-content:space-between;gap:var(--s-16);align-items:center;flex-wrap:wrap;margin-top:var(--s-14)}
  /* cruscotto superadmin */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--s-12);margin-bottom:var(--s-16)}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:var(--s-12) var(--s-14);background:var(--surface)}
  .kpi .v{font-size:24px;font-weight:800;line-height:1.1}
  .kpi .k{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-top:var(--s-2)}
  .kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
  .sa-toolbar{display:flex;gap:var(--s-10);align-items:center;flex-wrap:wrap;margin-bottom:var(--s-12)}
  .sa-search{flex:1 1 200px;min-width:0;max-width:100%}
  .fchip{font:inherit;font-size:13px;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:var(--s-5) var(--s-12);cursor:pointer}
  .fchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* riga tenant compatta */
  .trow{border:1px solid var(--line);border-radius:12px;margin-bottom:var(--s-8);background:var(--surface);overflow:hidden}
  .trow-h{display:flex;align-items:center;gap:var(--s-12);padding:var(--s-12) var(--s-14);cursor:pointer}
  .trow-h:hover{background:var(--bg2)}
  .trow-meta{display:flex;gap:var(--s-14);align-items:center;flex-wrap:wrap;margin-left:auto}
  @media(max-width:640px){.trow-h{flex-wrap:wrap}.trow-meta{margin-left:0;gap:var(--s-8)}}
  .tstat{font-size:12.5px;color:var(--mut);white-space:nowrap}
  .tstat b{color:var(--fg);font-size:13.5px}
  .tchev{transition:transform .15s;color:var(--faint)} .trow.open .tchev{transform:rotate(90deg)}
  .tdetail{padding:0 var(--s-14) var(--s-14);border-top:1px solid var(--line)}
  /* schede: su telefono scorrono in orizzontale invece di sforare */
  .tabs{display:flex;gap:var(--s-4);box-shadow:inset 0 -1px 0 var(--line);margin-bottom:var(--s-18);overflow-x:auto;scrollbar-width:thin}
  .tab{flex:none;white-space:nowrap;font:inherit;background:none;border:0;border-bottom:2px solid transparent;
       padding:var(--s-10) var(--s-16);cursor:pointer;font-weight:600;color:var(--mut)}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand)}
  .pane{display:none} .pane.on{display:block}
  /* stato sistema */
  .sys-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:var(--s-12)}
  .sys-card{border:1px solid var(--line);border-radius:12px;padding:var(--s-14);background:var(--surface)}
  .sys-card h3{margin:0 0 var(--s-10);font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
  .meter{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:var(--s-6) 0}
  .meter>i{display:block;height:100%;background:var(--ok)}
  .meter.warn>i{background:var(--warn)} .meter.bad>i{background:var(--bad)}
  .srow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--s-10);font-size:13.5px;padding:var(--s-3) 0}
  .srow .k{color:var(--mut)} .srow .v{font-weight:600}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:var(--s-6)}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  .alert-item{display:flex;gap:var(--s-10);align-items:center;padding:var(--s-8) var(--s-10);border:1px solid var(--line);border-radius:10px;margin-bottom:var(--s-6);font-size:13.5px}
  /* accesso / MFA */
  .sa-auth{min-height:100vh;display:grid;place-items:center;padding:var(--s-20);background:var(--bg)}
  .sa-auth.glow{background:radial-gradient(1000px 500px at 50% -10%, var(--brand-soft), transparent), var(--bg)}
  .sa-auth-card{width:100%;max-width:380px} .sa-auth-card.wide{max-width:460px}
  .sa-auth h1{font-size:18px}
  .sa-steps{padding-left:var(--s-18);margin:0 0 var(--s-10)}
  .msg-err{color:var(--bad);min-height:var(--s-16)}
  .sel-all{user-select:all;overflow-wrap:anywhere}
  .logo.logo-sm{width:26px;height:26px}
  /* pannelli, riquadri, finestre */
  .sa-panel{padding:var(--s-14);border:1px solid var(--line)} .sa-panel.tight{padding:var(--s-12)}
  .sa-box{border:1px solid var(--line);border-radius:10px;padding:var(--s-8) var(--s-10)}
  .sa-note-card{margin-top:var(--s-12);padding:var(--s-12);border:1px solid var(--line);background:var(--bg2)}
  .sa-json{width:100%;height:160px;font-family:var(--mono);font-size:12px;margin-top:var(--s-6)}
  .sa-ov{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:var(--s-16);background:rgba(0,0,0,.45)}
  .sa-dlg{padding:var(--s-16);width:100%;max-width:440px;max-height:calc(100vh - 2*var(--s-16));overflow:auto}
  .sa-dlg.dlg-430{max-width:430px} .sa-dlg.dlg-480{max-width:480px}
  .sa-fld{display:block;margin:var(--s-6) 0}
  .sec-lbl{text-transform:uppercase;letter-spacing:.5px}
  .mod-name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
  .logo-box{width:64px;height:64px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ava.logo-bg{background:#fff;padding:var(--s-3)} /* logo del tenant: sempre su bianco, come caricato */
  .img-fit{width:100%;height:100%;object-fit:contain}
  .color-in{width:40px;height:34px;padding:var(--s-2)} .color-in.wide{width:46px}
  .scn-item{padding:var(--s-6) 0;border-bottom:1px solid var(--line);align-items:flex-start;gap:var(--s-10);flex-wrap:wrap}
  .ta-60{width:100%;height:60px}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  /* utilità (scala --s-*) */
  .mt-2{margin-top:var(--s-2)} .mt-4{margin-top:var(--s-4)} .mt-6{margin-top:var(--s-6)} .mt-8{margin-top:var(--s-8)}
  .mt-10{margin-top:var(--s-10)} .mt-12{margin-top:var(--s-12)} .mt-16{margin-top:var(--s-16)}
  .mb-4{margin-bottom:var(--s-4)} .mb-5{margin-bottom:var(--s-5)} .mb-6{margin-bottom:var(--s-6)} .mb-8{margin-bottom:var(--s-8)}
  .mb-10{margin-bottom:var(--s-10)} .mb-14{margin-bottom:var(--s-14)} .mb-16{margin-bottom:var(--s-16)} .mb-18{margin-bottom:var(--s-18)}
  .my-4{margin-top:var(--s-4);margin-bottom:var(--s-4)} .ml-6{margin-left:var(--s-6)} .ml-8{margin-left:var(--s-8)} .mr-auto{margin-right:auto}
  .gap-4{gap:var(--s-4)} .gap-6{gap:var(--s-6)} .gap-8{gap:var(--s-8)} .gap-10{gap:var(--s-10)} .gap-16{gap:var(--s-16)} .gap-18{gap:var(--s-18)}
  .jc-end{justify-content:flex-end} .jc-between{justify-content:space-between} .ai-start{align-items:flex-start}
  .lbl{font-size:12.5px;font-weight:600;color:var(--mut)} /* come <label> di app.css, per titoli di gruppo senza un solo campo */
  .pre-line{white-space:pre-line}
  .blk{display:block} .flex-0{flex:0} .minw-0{min-width:0} .ta-r{text-align:right} .fw-6{font-weight:600}
  .w-90{width:90px} .w-92{width:92px} .w-110{width:110px} .w-130{width:130px} .w-140{width:140px} .w-150{width:150px} .w-240{width:240px}
  .w-90,.w-92,.w-110,.w-130,.w-140,.w-150,.w-240{max-width:100%}
  .t-bad,.btn.ghost.t-bad{color:var(--bad)}
  .chip.chip-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
  .chip.chip-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .sr-only{position:absolute;left:0;top:0;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
  th,td{position:relative}
  /* FE-16: focus sempre visibile da tastiera */
  .btn:focus-visible,.tab:focus-visible,.fchip:focus-visible,.trow-h:focus-visible,a:focus-visible,summary:focus-visible,
  input[type=checkbox]:focus-visible,input[type=radio]:focus-visible,.switch input:focus-visible+.sl{outline:2px solid var(--brand);outline-offset:2px}
  .trow-h:focus-visible{outline-offset:-2px}
</style>
<script src="/app.js"></script>
<script src="/i18n-en.js"></script><script src="/i18n.js"></script>
<script>
let TENANTS=[];
(async function(){ try{ const me=await api('/me'); if(me.is_super) return shell(); if(me.role==='superadmin_setup') return mfaGate(); }catch(e){} login(); })();

function login(){
  $('#root').innerHTML=`<main class="sa-auth glow">
    <div class="card sa-auth-card"><div class="card-b">
      <div class="row gap-10 mb-14"><div class="logo">${ICON.logomark}</div>
        <div class="grow"><h1>Piano di controllo</h1><div class="small mut">tenants.loneworker.eu</div></div>${ywI18n.select()}</div>
      <div class="col">
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="nome@azienda.it"></div>
        <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
        <div class="field hide" id="otpF"><label for="otp">Codice dell’app di autenticazione</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="6 cifre"></div>
        <button class="btn block lg" id="go">Accedi</button>
        <div class="small msg-err" id="msg" role="alert"></div>
      </div></div></div></main>`;
  $('#go').onclick=async()=>{ try{
    const body={email:$('#email').value,password:$('#pw').value}; if(!$('#otpF').classList.contains('hide')) body.otp=$('#otp').value;
    const r=await api('/superadmin/login',{method:'POST',body:JSON.stringify(body)});
    if(r&&(r.mfa_setup_required||r.secrets_locked)) return mfaGate(); shell();
  }catch(e){
    // SA-12: secondo fattore richiesto -> compare il campo del codice
    if(e.body&&e.body.mfa_required){ $('#otpF').classList.remove('hide'); $('#otp').focus(); $('#msg').textContent=e.body.error||'Inserisci il codice'; return; }
    $('#msg').textContent=loginErrorText(e); } };
  $('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click();};
  $('#otp').onkeydown=e=>{if(e.key==='Enter')$('#go').click();};
  // FE-12: credenziali di prova precompilate SOLO in ambiente demo/dev (default: produzione, campi vuoti).
  loginInfo().then(li=>{ if(!li.demo) return; const em=$('#email'), pw=$('#pw');
    if(em&&!em.value) em.value='admin@loneworker.eu'; if(pw&&!pw.value) pw.value='admin'; });
}

// ===== SA-12: attivazione MFA obbligatoria / chiave dei segreti bloccata =====
async function mfaGate(){
  let st; try{ st=await api('/superadmin/mfa'); }catch(e){ return login(); }
  const wrap=inner=>`<main class="sa-auth"><div class="card sa-auth-card wide"><div class="card-b">${inner}</div></div></main>`;
  if(st.secrets_locked && st.enabled){
    $('#root').innerHTML=wrap(`<h2 class="mb-8">Chiave dei segreti bloccata</h2>
      <div class="small mut mb-10">Questo server non apre la chiave che protegge i segreti, compreso il codice della tua app di autenticazione. Sbloccala con la <b>passphrase di recupero</b>; poi accedi di nuovo con il codice.</div>
      <div class="field"><label for="rp">Passphrase di recupero</label><input id="rp" type="password" autocomplete="off"></div>
      <button class="btn block" id="ub">Sblocca</button><div class="small msg-err" id="um" role="alert"></div>
      <button class="btn ghost block" onclick="out()">Esci</button>`);
    $('#ub').onclick=async()=>{ try{ await api('/superadmin/secrets/unlock',{method:'POST',body:JSON.stringify({passphrase:$('#rp').value})}); toast('Chiave sbloccata: accedi di nuovo con il codice','ok'); out(); }catch(e){ $('#um').textContent=friendlyError(e); } };
    return; }
  let su; try{ su=await api('/superadmin/mfa/setup',{method:'POST'}); }catch(e){ $('#root').innerHTML=wrap(`<div class="t-bad" role="alert">${esc(friendlyError(e))}</div><button class="btn ghost" onclick="out()">Esci</button>`); return; }
  const grp=String(su.secret).replace(/(.{4})/g,'$1 ').trim();
  $('#root').innerHTML=wrap(`<h2 class="mb-8">Attiva la verifica in due passaggi</h2>
    <div class="small mut mb-10">Per il piano di controllo serve, oltre alla password, un codice che cambia ogni 30 secondi. Usa un’app di autenticazione (per esempio Google Authenticator, Microsoft Authenticator, FreeOTP).</div>
    <ol class="small sa-steps">
      <li>Nell’app scegli «aggiungi account» e poi «inserisci una chiave», oppure, dal telefono, tocca <a href="${esc(su.otpauth)}">questo collegamento</a>.</li>
      <li>Account: <b>${esc(st.email)}</b> · chiave: <code class="sel-all">${esc(grp)}</code> · tipo: basato sull’ora.</li>
      <li>Scrivi qui sotto il codice di 6 cifre che l’app mostra.</li></ol>
    <div class="field"><label for="mc">Codice</label><input id="mc" inputmode="numeric" autocomplete="one-time-code" maxlength="7"></div>
    <button class="btn block" id="mb">Attiva</button><div class="small msg-err" id="mm" role="alert"></div>
    <button class="btn ghost block" onclick="out()">Esci</button>`);
  $('#mc').focus(); $('#mc').onkeydown=e=>{if(e.key==='Enter')$('#mb').click();};
  $('#mb').onclick=async()=>{ try{ await api('/superadmin/mfa/enable',{method:'POST',body:JSON.stringify({code:$('#mc').value})}); toast('Verifica in due passaggi attiva','ok'); shell(); }catch(e){ $('#mm').textContent=friendlyError(e); } };
}
async function shell(){
  $('#root').innerHTML=`
  <header class="topbar"><div class="logo logo-sm">${ICON.logomark}</div><strong>Piano di controllo</strong>
    <span class="chip">superadmin</span><div class="grow"></div>
    ${ywI18n.select()}
    <button id="themeBtn" class="btn-ico btn ghost" title="Tema" aria-label="Cambia tema chiaro/scuro" onclick="toggleTheme()">${themeIconHtml()}</button>
    <button class="btn-ico btn ghost" title="Esci" aria-label="Esci" onclick="out()">${ICON.logout}</button></header>
  <main class="content">
    <div class="tabs" role="tablist" aria-label="Sezioni del piano di controllo">
      <button type="button" class="tab on" role="tab" id="tab-panoramica" aria-selected="true" aria-controls="pane-panoramica" data-t="panoramica" onclick="saTab('panoramica')" onkeydown="saTabKey(event)">Panoramica</button>
      <button type="button" class="tab" role="tab" id="tab-tenant" aria-selected="false" aria-controls="pane-tenant" tabindex="-1" data-t="tenant" onclick="saTab('tenant')" onkeydown="saTabKey(event)">Tenant</button>
      <button type="button" class="tab" role="tab" id="tab-sistema" aria-selected="false" aria-controls="pane-sistema" tabindex="-1" data-t="sistema" onclick="saTab('sistema')" onkeydown="saTabKey(event)">Sistema</button>
      <button type="button" class="tab" role="tab" id="tab-scenari" aria-selected="false" aria-controls="pane-scenari" tabindex="-1" data-t="scenari" onclick="saTab('scenari')" onkeydown="saTabKey(event)">Scenari IoT</button>
      <button type="button" class="tab" role="tab" id="tab-cataloghi" aria-selected="false" aria-controls="pane-cataloghi" tabindex="-1" data-t="cataloghi" onclick="saTab('cataloghi')" onkeydown="saTabKey(event)">Cataloghi</button>
    </div>

    <div class="pane on" id="pane-panoramica" role="tabpanel" aria-labelledby="tab-panoramica">
      <div id="kpis" class="kpis"></div>
      <div class="card mb-16"><div class="card-h"><h2 id="sysOverall">Stato sistema</h2>
        <button class="btn ghost small" onclick="loadSystem()">↻ aggiorna</button></div>
        <div class="card-b" id="sysSummary"><div class="small mut">Carico…</div></div></div>
      <div class="card"><div class="card-h"><h2>Alert recenti</h2>
        <button class="btn ghost small" onclick="saTab('sistema')">vedi tutti</button></div>
        <div class="card-b" id="sysAlertsMini"><div class="small mut">—</div></div></div>
    </div>

    <div class="pane" id="pane-tenant" role="tabpanel" aria-labelledby="tab-tenant">
      <div class="sa-toolbar">
        <h2 class="mr-auto">Tenant</h2>
        <div class="row gap-10" role="group" aria-label="Filtra i tenant per stato">
          <button type="button" class="fchip on" aria-pressed="true" data-f="all" onclick="setFilter('all',this)">Tutti</button>
          <button type="button" class="fchip" aria-pressed="false" data-f="operativo" onclick="setFilter('operativo',this)">Operativi</button>
          <button type="button" class="fchip" aria-pressed="false" data-f="daconfig" onclick="setFilter('daconfig',this)">Da configurare</button>
          <button type="button" class="fchip" aria-pressed="false" data-f="sospeso" onclick="setFilter('sospeso',this)">Sospesi</button>
        </div>
        <input id="t_search" class="sa-search" placeholder="🔎 cerca per nome o slug" aria-label="Cerca tenant per nome o slug" oninput="tenantFilter()">
        <button class="btn" onclick="toggleCreate()" id="c_toggle" aria-expanded="false" aria-controls="createCard">+ Nuovo tenant</button>
      </div>
      <div id="createCard" style="display:none">
      <div class="card mb-18"><div class="card-h"><h2>Crea tenant</h2></div><div class="card-b">
      <div class="ct-grid">
        <div class="field"><label for="c_slug">Slug</label><input id="c_slug" placeholder="acme2" oninput="slugPrev()" aria-describedby="c_slugprev">
          <div id="c_slugprev" class="small mut" aria-live="polite">indirizzo: —</div></div>
        <div class="field"><label for="c_name">Nome</label><input id="c_name" placeholder="Acme 2 Srl"></div>
        <div class="field"><label for="c_email">Admin email</label><input id="c_email" type="email" placeholder="admin@acme2.eu"></div>

        <div class="field span2"><label for="c_mode">Attivazione admin</label>
          <select id="c_mode" onchange="modePw()">
            <option value="invite">Invito monouso (consigliato — nessuna password nota)</option>
            <option value="password">Imposta password (demo/dev)</option>
          </select></div>
        <div class="field" id="c_pwwrap" style="display:none"><label for="c_pw">Password (min 8)</label><input id="c_pw" type="text" placeholder="min 8 caratteri"></div>

        <div class="field"><label for="c_plan">Pacchetto (moduli attivati subito)</label>
          <select id="c_plan" onchange="planPrev()" aria-describedby="c_planprev"><option value="">— nessuno (attiva dopo) —</option></select>
          <div id="c_planprev" class="small mut" aria-live="polite"></div></div>
        <div class="field"><label for="c_lic_m">Licenze app mobile</label><input id="c_lic_m" type="number" min="0" placeholder="illimitato"></div>
        <div class="field"><label for="c_lic_i">Licenze IoT</label><input id="c_lic_i" type="number" min="0" placeholder="illimitato"></div>

        <div class="field span2"><label for="c_scn">Scenario / caso d’uso (opzionale)</label>
          <select id="c_scn"><option value="">— nessuno —</option></select></div>
        <div class="field"><span class="lbl" aria-hidden="true">&nbsp;</span><label class="chkline"><input type="checkbox" id="c_scn_demo"> con dati demo</label></div>

function saTab(k){
  document.querySelectorAll('.tab').forEach(t=>{ const on=t.dataset.t===k; t.classList.toggle('on',on);
    t.setAttribute('aria-selected',on?'true':'false'); t.tabIndex=on?0:-1; });
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+k));
  if(k==='sistema') loadSystem();
  if(k==='scenari') catLoad();
  if(k==='cataloghi'){ planLoad(); etLoad(); }
}

// FE-16: schede da tastiera (frecce sinistra/destra, Home, Fine) come da pattern ARIA tablist
function saTabKey(e){ const T=[...document.querySelectorAll('.tab')]; const i=T.indexOf(e.currentTarget); let j=-1;
  if(e.key==='ArrowRight') j=(i+1)%T.length; else if(e.key==='ArrowLeft') j=(i-1+T.length)%T.length;
  else if(e.key==='Home') j=0; else if(e.key==='End') j=T.length-1;
  if(j<0) return; e.preventDefault(); T[j].focus(); saTab(T[j].dataset.t); }
// FE-16: elemento con role="button" attivabile con Invio/Spazio come un vero pulsante
function saKey(e){ if(e.target!==e.currentTarget) return; if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.currentTarget.click(); } }
// FE-16: finestra modale accessibile: ruolo dialog, Esc annulla, il Tab resta dentro, alla chiusura il
// fuoco torna dove era. Restituisce la funzione che riporta il fuoco.
function saDialog(m,title,onEsc){
  const prev=document.activeElement, box=m.firstElementChild;
  box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); box.setAttribute('aria-label',title);
  m.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ e.preventDefault(); onEsc(); return; }
    if(e.key!=='Tab') return;
    const f=[...box.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!f.length) return; const a=f[0], z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){ e.preventDefault(); z.focus(); }
    else if(!e.shiftKey&&document.activeElement===z){ e.preventDefault(); a.focus(); }
  });
  return ()=>{ try{ if(prev&&prev.focus&&document.contains(prev)) prev.focus(); }catch(e){} };
}

function fmtBytes(n){ if(n==null)return '—'; const u=['B','KB','MB','GB','TB']; let i=0,v=Number(n); while(v>=1024&&i<u.length-1){v/=1024;i++;} return v.toFixed(v<10&&i>0?1:0)+' '+u[i]; }
function fmtDur(s){ if(s==null||s<0)return '—'; s=Number(s); const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return (d?d+'g ':'')+(h?h+'h ':'')+m+'m'; }
function meter(pct,max){ pct=Number(pct)||0; max=Number(max)||100; const sev=pct>=max?'bad':(pct>=max-10?'warn':''); return `<div class="meter ${sev}" role="img" aria-label="${Math.round(pct)}% (soglia ${max}%)"><i style="width:${Math.min(100,pct)}%"></i></div>`; }

    <div class="small mut mt-2 mb-10">Fino alla data l’amministratore del tenant vede un avviso con la data e le limitazioni.</div>

    <div class="row gap-8 jc-end mt-12"><button class="btn ghost" data-no>Annulla</button><button class="btn bad" data-yes>Sospendi</button></div></div>`;
  let restore=()=>{};
  const done=v=>{ try{m.remove();}catch(e){} restore(); res(v); };
  restore=saDialog(m,'Sospendere '+name,()=>done(null));
  m.addEventListener('click',e=>{ if(e.target===m) done(null); });
  m.querySelector('[data-no]').onclick=()=>done(null);
  m.querySelector('[data-yes]').onclick=()=>{
    const when=m.querySelector('input[name=_sw]:checked').value;

function askConfirm(msg){ return new Promise(res=>{
  const m=document.createElement('div'); m.className='sa-ov';
  m.innerHTML=`<div class="card sa-dlg dlg-430"><div class="mb-14" id="_saConfirmMsg">${esc(msg)}</div>
    <div class="row gap-8 jc-end"><button class="btn ghost" data-no>Annulla</button><button class="btn" data-yes>Conferma</button></div></div>`;
  let restore=()=>{};
  const done=v=>{ try{m.remove();}catch(e){} restore(); res(v); };
  restore=saDialog(m,'Conferma',()=>done(false));
  m.firstElementChild.setAttribute('aria-describedby','_saConfirmMsg');
  m.addEventListener('click',e=>{ if(e.target===m) done(false); });
  m.querySelector('[data-no]').onclick=()=>done(false);
  m.querySelector('[data-yes]').onclick=()=>done(true);
  document.body.appendChild(m); const y=m.querySelector('[data-yes]'); if(y)y.focus();
}); }
// Prompt non-bloccante (window.prompt è bloccato in alcune webview). Ritorna stringa o null.
function askPrompt(msg,val){ return new Promise(res=>{
  const m=document.createElement('div'); m.className='sa-ov';
  m.innerHTML=`<div class="card sa-dlg dlg-430"><div id="_saPromptMsg" class="mb-10 pre-line">${esc(msg)}</div>
    <input data-in value="${esc(val||'')}" class="mb-12" aria-labelledby="_saPromptMsg">
    <div class="row gap-8 jc-end"><button class="btn ghost" data-no>Annulla</button><button class="btn" data-yes>OK</button></div></div>`;
  let restore=()=>{};
  const done=v=>{ try{m.remove();}catch(e){} restore(); res(v); };
  restore=saDialog(m,msg.split('\n')[0],()=>done(null));
  m.addEventListener('click',e=>{ if(e.target===m) done(null); });
  m.querySelector('[data-no]').onclick=()=>done(null);
  const inp=m.querySelector('[data-in]');
  m.querySelector('[data-yes]').onclick=()=>done(inp.value);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')done(inp.value); });
  document.body.appendChild(m); inp.focus(); inp.select();
}); }

async function toggle(tid,code,cb){

      if(e.status===409 && /serve attivare anche/.test(e.message||'') && await askConfirm(e.message+'. Attivarli insieme?')){
        r=await api('/superadmin/tenants/'+tid+'/modules',{method:'POST',body:JSON.stringify({module_code:code,state,with_deps:true})});

    <label class="small mut blk mb-8"><input type="checkbox" id="scn_demo_${tid}" checked> crea anche device/sito demo</label>
    <div class="row gap-6 mb-8"><button class="btn small" onclick="scnApplyAll('${tid}')">Attiva tutti (${cat.length})</button>
      <button class="btn ghost small" onclick="scnRemoveAll('${tid}')">Rimuovi tutti${app.length?' ('+app.length+')':''}</button></div>`;
  Object.keys(bySector).sort().forEach(sec=>{
    h+=`<div class="small mut sec-lbl mt-8 mb-4">${esc(sec)}</div>`;
    bySector[sec].forEach(s=>{ const on=applied.has(s.code);
      h+=`<div class="spread scn-item">
        <div class="minw-0"><b>${esc(s.name)}</b> ${on?'<span class="chip s-attivo">attivo</span>':''}
          <div class="small mut">${esc(s.desc)}</div>
          <div class="small mut">moduli: ${s.modules.map(m=>`<span class="chip">${esc(modName(m))}</span>`).join(' ')} · ${s.rule_count} regole · ${s.device_count} device demo</div></div>
        <div class="row gap-6">${on?`<button class="btn ghost small" onclick="scnDemo('${tid}','${s.code}')" title="Inietta telemetria demo (allarmi reali)">⚡ Demo</button>
                   <button class="btn ghost small" onclick="scnRemove('${tid}','${s.code}',this)">Rimuovi</button>`
                  :`<button class="btn small" onclick="scnApply('${tid}','${s.code}')">Attiva</button>`}</div></div>`;
    });
  });
  h+=`<div id="scn_msg_${tid}" class="small mut mt-8" role="status" aria-live="polite"></div></div>`;
  box.innerHTML=h;
}
async function scnApply(tid,code){
  const demo=document.getElementById('scn_demo_'+tid).checked; const msg=document.getElementById('scn_msg_'+tid); if(msg)msg.textContent='Attivo…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/scenarios',{method:'POST',body:JSON.stringify({code,with_demo:demo})});
    toast('Scenario attivato ('+r.rules_added+' regole, '+r.devices_added+' device)','ok'); scnRender(tid);
  }catch(e){ toast(e,'bad'); if(msg)msg.textContent=friendlyError(e); }
}
async function scnApplyAll(tid){
  const demo=document.getElementById('scn_demo_'+tid).checked; const msg=document.getElementById('scn_msg_'+tid); if(msg)msg.textContent='Attivo tutti gli ambienti…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/scenarios/bulk',{method:'POST',body:JSON.stringify({action:'apply',with_demo:demo})});
    toast('Attivati '+r.applied+' ambienti ('+r.rules_added+' regole, '+r.devices_added+' device)','ok'); scnRender(tid);
  }catch(e){ toast(e,'bad'); if(msg)msg.textContent=friendlyError(e); }
}
// Rimozione di massa in due passi (no confirm() in webview): primo click arma, secondo conferma.
async function scnRemoveAll(tid){
  const msg=document.getElementById('scn_msg_'+tid);
  if(window._scnArmAll!==tid){ window._scnArmAll=tid; if(msg)msg.innerHTML=`<span class="t-bad">Clicca di nuovo “Rimuovi tutti” per confermare la rimozione di TUTTI gli ambienti.</span>`;
    setTimeout(()=>{ if(window._scnArmAll===tid) window._scnArmAll=null; }, 4000); return; }
  window._scnArmAll=null; if(msg)msg.textContent='Rimuovo tutti gli ambienti…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/scenarios/bulk',{method:'POST',body:JSON.stringify({action:'remove'})});
    toast('Rimossi '+r.removed+' ambienti ('+r.rules_removed+' regole)','ok'); scnRender(tid);
  }catch(e){ toast(e,'bad'); if(msg)msg.textContent=friendlyError(e); }
}
async function scnDemo(tid,code){
  const msg=document.getElementById('scn_msg_'+tid); if(msg)msg.textContent='Genero telemetria demo…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/scenarios/'+code+'/demo',{method:'POST'});
    toast('Telemetria demo: '+r.events+' eventi, '+r.incidents+' incidenti','ok');
    if(msg)msg.innerHTML=`<span class="s-attivo">✓ ${r.events} eventi · ${r.incidents} incidenti</span> (vedi Centrale allarmi del tenant)`;
  }catch(e){ toast(e,'bad'); if(msg)msg.textContent=friendlyError(e); }
}
// Rimozione in due passi senza confirm() (bloccato in alcune webview): primo click arma (il
// bottone diventa "Conferma rimozione"), secondo click conferma. Rimozione COMPLETA lato server
// (scenario + regole + device/eventi/incidenti demo).
async function scnRemove(tid,code,btn){
  const msg=document.getElementById('scn_msg_'+tid);
  if(window._scnArm!==code){
    window._scnArm=code;
    if(btn){ btn.dataset.lbl=btn.textContent; btn.textContent='Conferma rimozione'; btn.classList.add('on'); }
    if(msg)msg.innerHTML=`<span class="t-bad">Clicca di nuovo per confermare la rimozione di <b>${esc(code)}</b> (anche i dati demo).</span>`;
    setTimeout(()=>{ if(window._scnArm===code){ window._scnArm=null; if(btn){ btn.textContent=btn.dataset.lbl||'Rimuovi'; btn.classList.remove('on'); } } }, 5000);
    return;
  }
  window._scnArm=null; if(msg)msg.textContent='Rimuovo…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/scenarios/'+code,{method:'DELETE'});
    toast('Scenario rimosso ('+r.rules_removed+' regole, '+r.devices_removed+' device demo)','ok'); scnRender(tid);
  }catch(e){ toast(e,'bad'); if(msg)msg.textContent=friendlyError(e); }
}
</script>
</body></html>
