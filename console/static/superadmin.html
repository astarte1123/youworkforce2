<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Superadmin · YouWorkforce</title><link rel="stylesheet" href="/app.css"></head><body>
<div id="root"></div>
<script src="/app.js"></script>
<script>
let TENANTS=[];
(async function(){ try{ const me=await api('/me'); if(me.is_super) return shell(); }catch(e){} login(); })();

function login(){
  $('#root').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px;background:
    radial-gradient(1000px 500px at 50% -10%, var(--brand-soft), transparent), var(--bg)">
    <div class="card" style="width:380px;max-width:100%"><div class="card-b">
      <div class="row" style="gap:10px;margin-bottom:14px"><div class="logo">${ICON.logomark}</div>
        <div><h1 style="font-size:18px">Piano di controllo</h1><div class="small mut">tenants.loneworker.eu</div></div></div>
      <div class="col">
        <div class="field"><label>Email</label><input id="email" value="admin@loneworker.eu"></div>
        <div class="field"><label>Password</label><input id="pw" type="password" value="admin"></div>
        <button class="btn block lg" id="go">Accedi</button>
        <div class="small" id="msg" style="color:var(--bad);min-height:16px"></div>
      </div></div></div></div>`;
  $('#go').onclick=async()=>{ try{ await api('/superadmin/login',{method:'POST',
    body:JSON.stringify({email:$('#email').value,password:$('#pw').value})}); shell();
  }catch(e){ $('#msg').textContent='Credenziali non valide'; } };
  $('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click();};
}

async function shell(){
  $('#root').innerHTML=`
  <div class="topbar"><div class="logo" style="width:26px;height:26px">${ICON.logomark}</div><strong>Piano di controllo</strong>
    <span class="chip">superadmin</span><div class="grow"></div>
    <button class="btn-ico btn ghost" onclick="toggleTheme()">${ICON.moon}</button>
    <button class="btn-ico btn ghost" onclick="out()">${ICON.logout}</button></div>
  <div class="content">
    <div class="card" style="margin-bottom:18px"><div class="card-h"><h2>Crea tenant</h2></div><div class="card-b">
      <div class="row">
        <div class="field grow"><label>Slug</label><input id="c_slug" placeholder="acme2"></div>
        <div class="field grow"><label>Nome</label><input id="c_name" placeholder="Acme 2 Srl"></div>
        <div class="field grow"><label>Admin email</label><input id="c_email" placeholder="admin@acme2.loneworker.eu"></div>
        <div class="field"><label>Password</label><input id="c_pw" value="demo"></div>
      </div>
      <div class="row" style="margin-top:10px;align-items:flex-end;flex-wrap:wrap;gap:16px">
        <div class="field"><label>Logo <span class="small mut">(PNG/SVG trasparente, consigliato 256×256px, max ~1&nbsp;MB)</span></label>
          <input id="c_logo" type="file" accept="image/png,image/svg+xml,image/jpeg,image/webp"></div>
        ${cColor('c_cp','Primario')}${cColor('c_ca','Accento')}${cColor('c_ck','Hover')}${cColor('c_cs','Soft')}
        <div class="field" style="flex:0"><button class="btn" id="c_go">Crea tenant</button></div>
      </div>
      <div class="small mut" style="margin-top:6px">Colori: lascia vuoto per usare il default YouCo (rosso/rosa). Potrai modificare logo e colori anche dopo, da ⚙ Amministrazione.</div>
    </div></div>
    <h2 style="margin-bottom:12px">Tenant</h2>
    <div id="list" class="col"></div>
  </div>`;
  $('#c_go').onclick=create; ['c_cp','c_ca','c_ck','c_cs'].forEach(syncPair); load();
}
async function out(){ location.reload(); }
async function create(){
  const hx=id=>{ const v=document.getElementById(id+'t').value.trim(); return v||null; };
  try{
    const r=await api('/superadmin/tenants',{method:'POST',body:JSON.stringify({
      slug:$('#c_slug').value,name:$('#c_name').value,admin_email:$('#c_email').value,admin_password:$('#c_pw').value,
      brand_primary:hx('c_cp'),brand_accent:hx('c_ca'),brand_ink:hx('c_ck'),brand_soft:hx('c_cs')})});
    const f=$('#c_logo').files&&$('#c_logo').files[0];
    if(f){ const res=await fetch('/api/superadmin/tenants/'+r.id+'/logo',{method:'POST',credentials:'include',
        headers:{'x-csrf-token':csrfToken(),'content-type':f.type||'image/png'}, body:f});
      if(!res.ok) toast('Tenant creato, ma logo non caricato ('+res.status+')','bad'); }
    toast('Tenant creato','ok');
    ['c_slug','c_name','c_email'].forEach(id=>$('#'+id).value=''); if($('#c_logo'))$('#c_logo').value='';
    load();
  }catch(e){ toast(e.message,'bad'); } }

async function load(){
  TENANTS=await api('/superadmin/tenants').catch(()=>[]);
  const mods=await Promise.all(TENANTS.map(t=>api('/superadmin/tenants/'+t.id+'/modules').catch(()=>[])));
  $('#list').innerHTML=TENANTS.map((t,i)=>tenantCard(t,mods[i])).join('')||'<div class="empty">nessun tenant</div>';
}
function tenantCard(t,mods){
  return `<div class="card"><div class="card-h">
    <div class="row" style="gap:10px"><div class="ava" ${t.has_logo?`style="background:#fff;padding:3px"`:''}>${t.has_logo?`<img src="/api/superadmin/tenants/${t.id}/logo" style="width:100%;height:100%;object-fit:contain">`:initials(t.name)}</div>
      <div><b>${esc(t.name)}</b><div class="small mut mono">${esc(t.slug)}.loneworker.eu</div></div></div>
    <div class="row" style="gap:6px">${licChip('App mobile',t.mobile_used,t.mobile_app_licenses)} ${licChip('IoT',t.iot_used,t.iot_device_licenses)}</div>
    </div><div class="card-b"><div class="grid g3">
    ${mods.map(m=>`<div class="row" style="justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:10px">
      <div style="min-width:0"><div style="font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis">${esc(m.name)}</div>
        <div class="small faint">${chip(m.state)}</div></div>
      ${m.available?`<label class="switch"><input type="checkbox" ${m.state==='attivo'?'checked':''}
        onchange="toggle('${t.id}','${m.code}',this)"><span class="sl"></span></label>`
        :'<span class="tag">N/D</span>'}
    </div>`).join('')}
    </div>
    <div style="margin-top:12px">
      <div class="small mut" style="margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px">Gestione</div>
      <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn" onclick="openAdmin('${t.id}',this)">⚙ Amministrazione</button>
        <button class="btn ghost" onclick="impersonate('${t.id}')">👤 Impersona admin</button>
        <button class="btn ghost" onclick="openTools('${t.id}',this)">Strumenti disponibili</button>
        <button class="btn ghost cfgbtn" onclick="scnOpen('${t.id}',this)">Ambienti (casi d'uso)</button></div>
      <div class="small mut" style="margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px">Connessioni &amp; integrazioni</div>
      <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn ghost" onclick="gaProvision('${t.id}',this)">Provisiona GoAlert</button>
        <button class="btn ghost cfgbtn" onclick="gaConfig('${t.id}',this)">Trasporto notifiche</button>
        <button class="btn ghost cfgbtn" onclick="trConn('${t.id}',this)">Connessione Traccar</button>
        <button class="btn ghost cfgbtn" onclick="trConfig('${t.id}',this)">Config Traccar</button>
        <button class="btn ghost cfgbtn" onclick="tbConn('${t.id}',this)">Connessione ThingsBoard</button>
        <button class="btn ghost cfgbtn" onclick="aiConn('${t.id}',this)">Connessione AI</button></div>
    </div>
    <div id="admin_${t.id}" style="margin-top:8px"></div>
    <div id="tools_${t.id}" style="margin-top:8px"></div>
    <div id="cfg_${t.id}" style="margin-top:8px"></div>
    </div></div>`;
}
// campo colore compatto per il form Crea tenant (hex vuoto = default YouCo)
function cColor(id,label){ return `<div class="field" style="flex:0"><label>${label}</label>
  <div class="row" style="gap:4px"><input id="${id}" type="color" value="#e2001a" style="width:40px;height:34px;padding:2px">
    <input id="${id}t" placeholder="default" style="width:92px" class="mono small"></div></div>`; }
function syncPair(cid){ const p=document.getElementById(cid), x=document.getElementById(cid+'t');
  if(p&&x){ p.oninput=()=>x.value=p.value; x.oninput=()=>{ if(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(x.value)) p.value=x.value; }; } }
function licChip(label,used,limit){
  if(limit==null) return `<span class="chip" title="${label}: nessun limite">${label} ${used}/∞</span>`;
  const over=used>limit;
  return `<span class="chip ${over?'s-critico':'s-attivo'}" title="${label}: uso/licenze">${over?'⚠ ':''}${label} ${used}/${limit}</span>`;
}
function tenantOf(tid){ return TENANTS.find(x=>x.id===tid)||{}; }
function btnOn(btn,on){ if(btn) btn.classList.toggle('on',!!on); }
function cfgExclusive(btn){ if(!btn)return; const c=btn.closest('.card'); if(c) c.querySelectorAll('.cfgbtn').forEach(b=>{ if(b!==btn) b.classList.remove('on'); }); }
async function openAdmin(tid,btn){
  const box=document.getElementById('admin_'+tid);
  if(box.dataset.open){ box.innerHTML=''; box.dataset.open=''; btnOn(btn,false); return; }
  box.dataset.open='1'; btnOn(btn,true);
  const t=tenantOf(tid);
  const ci=(id,val)=>`<input id="${id}_${tid}" type="color" value="${val||'#000000'}" style="width:46px;height:34px;padding:2px">
    <input id="${id}t_${tid}" value="${val||''}" placeholder="default" style="width:110px" class="mono small">`;
  box.innerHTML=`<div class="card" style="padding:14px">
    <h3 style="margin:0 0 8px">Licenze</h3>
    <div class="small mut" style="margin-bottom:8px">Conteggio seat app mobile (lavoratori/reperibili) e dispositivi IoT registrati. Vuoto = illimitato. Policy: si traccia e si avvisa, non si blocca.</div>
    <div class="row" style="gap:16px">
      <label class="small mut">Licenze app mobile <span class="chip">${t.mobile_used} in uso</span><br><input id="lm_${tid}" type="number" min="0" value="${t.mobile_app_licenses??''}" placeholder="illimitato" style="width:140px"></label>
      <label class="small mut">Licenze dispositivi IoT <span class="chip">${t.iot_used} in uso</span><br><input id="li_${tid}" type="number" min="0" value="${t.iot_device_licenses??''}" placeholder="illimitato" style="width:140px"></label>
    </div>
    <h3 style="margin:16px 0 8px">Identità visiva</h3>
    <div class="small mut" style="margin-bottom:8px">Logo e colori principali dell'app per questo tenant. Vuoto = default globale YouCo (rosso/rosa).</div>
    <div class="row" style="gap:18px;align-items:flex-start;flex-wrap:wrap">
      <div><div class="small mut" style="margin-bottom:4px">Logo</div>
        <div style="width:64px;height:64px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden">
          ${t.has_logo?`<img src="/api/superadmin/tenants/${tid}/logo?ts=${Date.now()}" style="width:100%;height:100%;object-fit:contain">`:'<span class="small faint">nessuno</span>'}</div>
        <div class="row" style="gap:6px;margin-top:6px"><input id="logo_${tid}" type="file" accept="image/*" style="width:150px" class="small">
          <button class="btn ghost small" onclick="logoUpload('${tid}')">Carica</button>${t.has_logo?`<button class="btn ghost small" onclick="logoDel('${tid}')">✕</button>`:''}</div></div>
      <div><div class="small mut" style="margin-bottom:4px">Colore primario (bottoni/icone)</div>${ci('cp',t.brand_primary)}
        <div class="small mut" style="margin:8px 0 4px">Colore hover/testo</div>${ci('ck',t.brand_ink)}
        <div class="small mut" style="margin:8px 0 4px">Sfondo tenue</div>${ci('cs',t.brand_soft)}
        <div class="small mut" style="margin:8px 0 4px">Accento (gradiente, es. rosa)</div>${ci('ca',t.brand_accent)}</div>
    </div>
    <div class="row" style="gap:8px;margin-top:12px"><button class="btn" onclick="saveAdmin('${tid}')">Salva amministrazione</button>
      <span class="small mut">I colori hanno effetto per i tenant che aprono la loro console.</span></div>
    </div>`;
  // sincronizza color picker <-> campo hex
  ['cp','ck','cs','ca'].forEach(k=>{ const p=document.getElementById(k+'_'+tid), x=document.getElementById(k+'t_'+tid);
    if(p&&x){ p.oninput=()=>x.value=p.value; x.oninput=()=>{ if(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(x.value)) p.value=x.value; }; } });
}
async function saveAdmin(tid){
  const hex=k=>{ const x=document.getElementById(k+'t_'+tid).value.trim(); return x; };
  const numv=id=>{ const v=document.getElementById(id+'_'+tid).value.trim(); return v===''?null:parseInt(v,10); };
  const body={ mobile_app_licenses:numv('lm'), iot_device_licenses:numv('li'),
    brand_primary:hex('cp'), brand_ink:hex('ck'), brand_soft:hex('cs'), brand_accent:hex('ca') };
  try{ await api('/superadmin/tenants/'+tid+'/admin',{method:'POST',body:JSON.stringify(body)}); toast('Amministrazione salvata','ok'); load(); }
  catch(e){ toast(e.message,'bad'); }
}
async function logoUpload(tid){
  const f=document.getElementById('logo_'+tid).files&&document.getElementById('logo_'+tid).files[0];
  if(!f){ toast('Scegli un file','bad'); return; }
  try{ const res=await fetch('/api/superadmin/tenants/'+tid+'/logo',{method:'POST',credentials:'include',
      headers:{'x-csrf-token':csrfToken(),'content-type':f.type||'image/png'}, body:f});
    if(!res.ok) throw new Error('upload '+res.status); toast('Logo caricato','ok'); load();
  }catch(e){ toast(e.message,'bad'); }
}
async function logoDel(tid){ try{ await api('/superadmin/tenants/'+tid+'/logo',{method:'DELETE'}); toast('Logo rimosso','ok'); load(); }catch(e){ toast(e.message,'bad'); } }
function askConfirm(msg){ return new Promise(res=>{
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)';
  m.innerHTML=`<div class="card" style="padding:16px;max-width:430px;width:92%"><div style="margin-bottom:14px">${esc(msg)}</div>
    <div class="row" style="gap:8px;justify-content:flex-end"><button class="btn ghost" data-no>Annulla</button><button class="btn" data-yes>Conferma</button></div></div>`;
  const done=v=>{ try{m.remove();}catch(e){} res(v); };
  m.addEventListener('click',e=>{ if(e.target===m) done(false); });
  m.querySelector('[data-no]').onclick=()=>done(false);
  m.querySelector('[data-yes]').onclick=()=>done(true);
  document.body.appendChild(m); const y=m.querySelector('[data-yes]'); if(y)y.focus();
}); }
async function impersonate(tid){
  const t=tenantOf(tid);
  if(!await askConfirm('Impersonare l\'admin di '+(t.name||'questo tenant')+'? Entrerai nella sua console per supporto. L\'azione è tracciata.')) return;
  try{ await api('/superadmin/tenants/'+tid+'/impersonate',{method:'POST'}); location.href='/app.html'; }
  catch(e){ toast(e.message,'bad'); }
}
async function toggle(tid,code,cb){
  const state=cb.checked?'attivo':'non_abilitato';
  try{ await api('/superadmin/tenants/'+tid+'/modules',{method:'POST',body:JSON.stringify({module_code:code,state})});
    toast(code+' → '+state,'ok'); load();
  }catch(e){ cb.checked=!cb.checked; toast('Bloccato: '+e.message,'bad'); }
}
// Superadmin scope: decide WHICH tools each tenant may configure.
async function openTools(tid,btn){
  const box=document.getElementById('tools_'+tid);
  if(box.dataset.open){ box.innerHTML=''; box.dataset.open=''; btnOn(btn,false); return; }
  box.dataset.open='1'; btnOn(btn,true);
  const tools=await api('/superadmin/tenants/'+tid+'/tools').catch(()=>[]);
  const groups={}; tools.forEach(t=>{(groups[t.module_code]=groups[t.module_code]||[]).push(t);});
  box.innerHTML=Object.keys(groups).map(mc=>`<div style="border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px">
    <div class="small mut mono">${esc(mc)}</div>
    ${groups[mc].map(t=>`<div class="row" style="justify-content:space-between;margin-top:4px">
      <div class="small">${esc(t.name)}</div>
      <label class="switch"><input type="checkbox" ${t.enabled?'checked':''}
        onchange="toggleTool('${tid}','${esc(t.module_code)}','${esc(t.tool_code)}',this)"><span class="sl"></span></label>
    </div>`).join('')}</div>`).join('')||'<div class="small mut">nessuno strumento</div>';
}
const CFG_GROUPS={
  'SMS / Voce (Twilio)':['Twilio.Enable','Twilio.AccountSID','Twilio.AuthToken','Twilio.FromNumber','Twilio.MessagingServiceSID'],
  'Email (SMTP)':['SMTP.Enable','SMTP.From','SMTP.Address','SMTP.Username','SMTP.Password'],
  'Slack':['Slack.Enable','Slack.ClientID','Slack.ClientSecret','Slack.AccessToken','Slack.SigningSecret'],
  'Email (Mailgun)':['Mailgun.Enable','Mailgun.APIKey','Mailgun.EmailDomain'],
  'Webhook (es. Teams)':['Webhook.Enable','Webhook.AllowedURLs'],
  'Generale':['General.PublicURL'],
};
async function trConn(tid,btn){
  const box=document.getElementById('cfg_'+tid);
  if(box.dataset.open==='trconn'){ box.innerHTML=''; box.dataset.open=''; btnOn(btn,false); return; }
  box.dataset.open='trconn'; cfgExclusive(btn); btnOn(btn,true); box.innerHTML='<div class="small mut">carico…</div>';
  let c; try{ c=await api('/superadmin/tenants/'+tid+'/traccar'); }catch(e){ c={configured:false}; }
  box.innerHTML=`<div class="card" style="padding:12px">
    <div class="small mut" style="margin-bottom:8px">Connessione al server Traccar del tenant (base URL + credenziali). È il prerequisito di tutto il modulo: polling, comandi, sync, verifica.</div>
    <label class="small mut" style="display:block;margin:4px 0">Base URL<input id="tc_url_${tid}" placeholder="http://host:8082" value="${esc(c.base_url||'')}"></label>
    <label class="small mut" style="display:block;margin:4px 0">Utente<input id="tc_user_${tid}" placeholder="op@tenant.test" value="${esc(c.username||'')}"></label>
    <label class="small mut" style="display:block;margin:4px 0">Password${c.has_password?' <span class="small">(impostata — lascia vuoto per non cambiarla)</span>':''}<input id="tc_pw_${tid}" type="password" placeholder="${c.has_password?'•••••• invariata':'password'}"></label>
    <div class="row" style="gap:8px;margin-top:6px"><button class="btn" onclick="trConnSave('${tid}')">Salva e verifica</button>
      ${c.configured?'<span class="chip s-attivo">configurata</span>':'<span class="chip">assente</span>'}</div>
    <div id="tc_msg_${tid}" class="small mut" style="margin-top:6px"></div></div>`;
}
async function trConnSave(tid){
  const url=document.getElementById('tc_url_'+tid).value.trim();
  const user=document.getElementById('tc_user_'+tid).value.trim();
  const pw=document.getElementById('tc_pw_'+tid).value;
  const msg=document.getElementById('tc_msg_'+tid);
  if(!url||!user){ toast('Base URL e utente obbligatori','bad'); return; }
  try{
    const body={base_url:url,username:user}; if(pw) body.password=pw;
    await api('/superadmin/tenants/'+tid+'/traccar',{method:'POST',body:JSON.stringify(body)});
    toast('Connessione salvata','ok');
    if(msg){ msg.innerHTML='<span class="s-attivo">salvata</span> — ora l\'admin del tenant può usare “Verifica collegamento” nella pagina Connettori.'; }
  }catch(e){ toast(e.message,'bad'); if(msg)msg.textContent=e.message; }
}
async function tbConn(tid,btn){
  const box=document.getElementById('cfg_'+tid);
  if(box.dataset.open==='tb'){ box.innerHTML=''; box.dataset.open=''; btnOn(btn,false); return; }
  box.dataset.open='tb'; cfgExclusive(btn); btnOn(btn,true); box.innerHTML='<div class="small mut">carico…</div>';
  let c; try{ c=await api('/superadmin/tenants/'+tid+'/thingsboard'); }catch(e){ c={configured:false}; }
  box.innerHTML=`<div class="card" style="padding:12px">
    <div class="small mut" style="margin-bottom:8px">Connessione al server ThingsBoard del tenant (base URL + credenziali). Abilita la verifica del collegamento e lo specchio dei device. Il push via Rule Engine resta il percorso di ingestione.</div>
    <label class="small mut" style="display:block;margin:4px 0">Base URL<input id="tb_url_${tid}" placeholder="http://host:8080" value="${esc(c.base_url||'')}"></label>
    <label class="small mut" style="display:block;margin:4px 0">Utente<input id="tb_user_${tid}" placeholder="tenant@tb.test" value="${esc(c.username||'')}"></label>
    <label class="small mut" style="display:block;margin:4px 0">Password${c.has_password?' <span class="small">(impostata — lascia vuoto per non cambiarla)</span>':''}<input id="tb_pw_${tid}" type="password" placeholder="${c.has_password?'•••••• invariata':'password'}"></label>
    <div class="row" style="gap:8px;margin-top:6px"><button class="btn" onclick="tbConnSave('${tid}')">Salva</button>
      <button class="btn ghost" onclick="tbVerify('${tid}')">Verifica collegamento</button>
      ${c.configured?'<span class="chip s-attivo">configurata</span>':'<span class="chip">assente</span>'}</div>
    <div class="divider" style="margin:10px 0"></div>
    <div class="small mut" style="margin-bottom:6px">Pull (specchio device + telemetria → regole): oltre al push Rule Engine, YouWorkforce pulla i device e l'ultima telemetria alla cadenza impostata.</div>
    <div class="row" style="gap:8px;align-items:flex-end;flex-wrap:wrap">
      <label class="small mut"><input type="checkbox" id="tb_poll_${tid}" ${c.poll_enabled?'checked':''}> Poll automatico</label>
      <label class="small mut">Cadenza (s)<input id="tb_int_${tid}" type="number" min="15" max="3600" value="${c.poll_interval_s||60}" style="width:90px"></label>
      <button class="btn ghost" onclick="tbSync('${tid}')">⟳ Sincronizza ora</button></div>
    <div id="tb_msg_${tid}" class="small mut" style="margin-top:6px"></div></div>`;
}
async function tbSync(tid){
  const msg=document.getElementById('tb_msg_'+tid); if(msg)msg.textContent='Sincronizzo…';
  const body={poll_enabled:document.getElementById('tb_poll_'+tid).checked, poll_interval_s:+document.getElementById('tb_int_'+tid).value};
  try{ const r=await api('/superadmin/tenants/'+tid+'/thingsboard/sync',{method:'POST',body:JSON.stringify(body)});
    if(msg) msg.innerHTML=r.reachable?`<span class="s-attivo">✓ ${r.device_count} device · ${r.alarm_count} allarmi</span>`:`<span style="color:var(--bad)">✗ ${esc(r.verdict||'irraggiungibile')}</span>`;
    toast(r.reachable?'ThingsBoard sincronizzato':'ThingsBoard irraggiungibile', r.reachable?'ok':'bad');
  }catch(e){ if(msg)msg.textContent=e.message; toast(e.message,'bad'); }
}
async function tbConnSave(tid){
  const url=document.getElementById('tb_url_'+tid).value.trim();
  const user=document.getElementById('tb_user_'+tid).value.trim();
  const pw=document.getElementById('tb_pw_'+tid).value;
  const msg=document.getElementById('tb_msg_'+tid);
  if(!url||!user){ toast('Base URL e utente obbligatori','bad'); return; }
  try{ const body={base_url:url,username:user}; if(pw) body.password=pw;
    await api('/superadmin/tenants/'+tid+'/thingsboard',{method:'POST',body:JSON.stringify(body)});
    toast('Connessione salvata','ok'); if(msg)msg.innerHTML='<span class="s-attivo">salvata</span>';
  }catch(e){ toast(e.message,'bad'); if(msg)msg.textContent=e.message; }
}
async function tbVerify(tid){
  const msg=document.getElementById('tb_msg_'+tid); if(msg)msg.textContent='Verifico…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/thingsboard/verify',{method:'POST'});
    if(msg) msg.innerHTML=r.reachable?`<span class="s-attivo">✓ ${esc(r.verdict)}</span> · device: <b>${r.device_count}</b>`:`<span style="color:var(--bad)">✗ ${esc(r.verdict)}</span>`;
    toast(r.reachable?'ThingsBoard collegato':'ThingsBoard irraggiungibile', r.reachable?'ok':'bad');
  }catch(e){ if(msg)msg.textContent=e.message; toast(e.message,'bad'); }
}
async function aiConn(tid,btn){
  const box=document.getElementById('cfg_'+tid);
  if(box.dataset.open==='ai'){ box.innerHTML=''; box.dataset.open=''; btnOn(btn,false); return; }
  box.dataset.open='ai'; cfgExclusive(btn); btnOn(btn,true); box.innerHTML='<div class="small mut">carico…</div>';
  let c; try{ c=await api('/superadmin/tenants/'+tid+'/ai'); }catch(e){ c={configured:false}; }
  const prov=c.provider||'youworker'; const def=AI_PROV_DEF[prov]||AI_PROV_DEF.custom;
  box.innerHTML=`<div class="card" style="padding:12px">
    <div class="small mut" style="margin-bottom:8px">Provider AI del tenant: <b>youworker.ai</b> (AI di YouCo) o esterno (OpenAI, DeepSeek, Anthropic, custom). Base URL + API key (cifrata a riposo). Pilota tutti i processi AI e l'agente operativo. <b>Salva</b> registra e attiva la connessione; <b>Verifica</b> prova a raggiungere il provider (serve rete + chiave valida). Se non configurata, i processi AI usano il piano deterministico locale.</div>
    <label class="small mut" style="display:block;margin:4px 0">Provider<select id="ai_prov_${tid}" onchange="aiProvDefaults('${tid}')">
      ${['youworker','openai','deepseek','anthropic','custom'].map(p=>`<option value="${p}" ${prov===p?'selected':''}>${p}</option>`).join('')}</select></label>
    <label class="small mut" style="display:block;margin:4px 0">Base URL<input id="ai_url_${tid}" placeholder="https://api.openai.com" value="${esc(c.base_url||def.base)}"></label>
    <label class="small mut" style="display:block;margin:4px 0">API key${c.has_api_key?' <span class="small">(impostata — lascia vuoto per non cambiarla)</span>':''}<input id="ai_key_${tid}" type="password" placeholder="${c.has_api_key?'•••••• invariata':'sk-…'}"></label>
    <label class="small mut" style="display:block;margin:4px 0">Modello<input id="ai_model_${tid}" placeholder="${def.model||'modello'}" value="${esc(c.model||def.model)}"></label>
    <div class="row" style="gap:8px">
      <label class="small mut" style="flex:1">Chat path<input id="ai_chat_${tid}" placeholder="/v1/chat/completions" value="${esc(c.chat_path||def.chat)}"></label>
      <label class="small mut" style="flex:1">STT path<input id="ai_stt_${tid}" placeholder="/v1/audio/transcriptions" value="${esc(c.stt_path||def.stt)}"></label></div>
    <div class="row" style="gap:8px;margin-top:6px"><button class="btn" onclick="aiConnSave('${tid}')">Salva</button>
      <button class="btn ghost" onclick="aiVerify('${tid}')">Verifica collegamento</button>
      ${c.configured?'<span class="chip s-attivo">configurata</span>':'<span class="chip">assente</span>'}</div>
    <div id="ai_msg_${tid}" class="small mut" style="margin-top:6px"></div></div>`;
}
const AI_PROV_DEF={
  youworker:{base:'https://api.youworker.ai',model:'youworker-1',chat:'/v1/chat/completions',stt:'/v1/audio/transcriptions'},
  openai:{base:'https://api.openai.com',model:'gpt-4o-mini',chat:'/v1/chat/completions',stt:'/v1/audio/transcriptions'},
  deepseek:{base:'https://api.deepseek.com',model:'deepseek-chat',chat:'/chat/completions',stt:'/v1/audio/transcriptions'},
  anthropic:{base:'https://api.anthropic.com',model:'claude-3-5-sonnet-latest',chat:'/v1/messages',stt:'/v1/audio/transcriptions'},
  custom:{base:'',model:'',chat:'/v1/chat/completions',stt:'/v1/audio/transcriptions'},
};
function aiProvDefaults(tid){ const p=document.getElementById('ai_prov_'+tid).value; const d=AI_PROV_DEF[p]||AI_PROV_DEF.custom;
  const u=document.getElementById('ai_url_'+tid); if(u && d.base) u.value=d.base; // suggerimento base URL del provider
  document.getElementById('ai_model_'+tid).value=d.model;
  document.getElementById('ai_chat_'+tid).value=d.chat;
  document.getElementById('ai_stt_'+tid).value=d.stt; }
async function aiConnSave(tid){
  const provider=document.getElementById('ai_prov_'+tid).value;
  const url=document.getElementById('ai_url_'+tid).value.trim();
  const key=document.getElementById('ai_key_'+tid).value;
  const model=document.getElementById('ai_model_'+tid).value.trim();
  const chat=document.getElementById('ai_chat_'+tid).value.trim();
  const stt=document.getElementById('ai_stt_'+tid).value.trim();
  const msg=document.getElementById('ai_msg_'+tid);
  if(!url){ toast('Base URL obbligatorio: scegli un provider (precompila l\'URL) o incollalo','bad'); if(msg)msg.innerHTML='<span style="color:var(--bad)">Base URL mancante</span>'; return; }
  try{ const body={provider:provider,base_url:url,model:model,chat_path:chat,stt_path:stt}; if(key) body.api_key=key;
    await api('/superadmin/tenants/'+tid+'/ai',{method:'POST',body:JSON.stringify(body)});
    toast('Connessione AI salvata e attiva','ok'); if(msg)msg.innerHTML='<span class="s-attivo">salvata e attiva</span> — verifico la raggiungibilità…';
    aiVerify(tid); // feedback immediato sulla raggiungibilità (opzionale)
  }catch(e){ toast(e.message,'bad'); if(msg)msg.textContent=e.message; }
}
async function aiVerify(tid){
  const msg=document.getElementById('ai_msg_'+tid); if(msg && msg.textContent.indexOf('verifico')<0) msg.textContent='Verifico…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/ai/verify',{method:'POST'});
    if(msg) msg.innerHTML=r.reachable?`<span class="s-attivo">✓ ${esc(r.verdict)}</span>${r.sample?' · '+esc(r.sample):''}`:`<span style="color:var(--bad)">✗ ${esc(r.verdict)}</span> — la connessione è comunque salvata; controlla URL/chiave/rete.`;
    toast(r.reachable?'Provider AI collegato':'Salvata, ma provider non raggiungibile', r.reachable?'ok':'warn');
  }catch(e){ if(msg)msg.textContent=e.message; toast(e.message,'bad'); }
}
async function scnOpen(tid,btn){
  const box=document.getElementById('cfg_'+tid);
  if(box.dataset.open==='scn'){ box.innerHTML=''; box.dataset.open=''; btnOn(btn,false); return; }
  box.dataset.open='scn'; cfgExclusive(btn); btnOn(btn,true);
  scnRender(tid);
}
// Render del pannello scenari, indipendente dal toggle/pulsante (richiamabile dopo attiva/rimuovi).
async function scnRender(tid){
  const box=document.getElementById('cfg_'+tid); if(!box)return;
  box.innerHTML='<div class="small mut">carico…</div>';
  let cat=[], app=[];
  try{ [cat,app]=await Promise.all([api('/superadmin/scenarios'), api('/superadmin/tenants/'+tid+'/scenarios')]); }catch(e){ box.innerHTML='<div class="small" style="color:var(--bad)">'+e.message+'</div>'; return; }
  const applied=new Set(app.map(a=>a.code));
  const bySector={}; cat.forEach(s=>{ (bySector[s.sector]=bySector[s.sector]||[]).push(s); });
  let h=`<div class="card" style="padding:12px"><div class="small mut" style="margin-bottom:8px">Ambienti ispirati ai casi d'uso ThingsBoard. Attivare uno scenario abilita i moduli, inserisce il bundle di regole sensori e (se spuntato) crea device + sito demo. Rimozione pulita; i moduli restano abilitati.</div>
    <label class="small mut" style="display:block;margin-bottom:8px"><input type="checkbox" id="scn_demo_${tid}" checked> crea anche device/sito demo</label>`;
  Object.keys(bySector).sort().forEach(sec=>{
    h+=`<div class="small mut" style="margin:8px 0 4px;text-transform:uppercase;letter-spacing:.5px">${esc(sec)}</div>`;
    bySector[sec].forEach(s=>{ const on=applied.has(s.code);
      h+=`<div class="spread" style="padding:6px 0;border-bottom:1px solid var(--line);align-items:flex-start;gap:10px">
        <div><b>${esc(s.name)}</b> ${on?'<span class="chip s-attivo">attivo</span>':''}
          <div class="small mut">${esc(s.desc)}</div>
          <div class="small mut">moduli: ${s.modules.map(m=>`<span class="chip">${esc(m)}</span>`).join(' ')} · ${s.rule_count} regole · ${s.device_count} device demo</div></div>
        <div class="row" style="gap:6px">${on?`<button class="btn ghost small" onclick="scnDemo('${tid}','${s.code}')" title="Inietta telemetria demo (allarmi reali)">⚡ Demo</button>
                   <button class="btn ghost small" onclick="scnRemove('${tid}','${s.code}')">Rimuovi</button>`
                  :`<button class="btn small" onclick="scnApply('${tid}','${s.code}')">Attiva</button>`}</div></div>`;
    });
  });
  h+=`<div id="scn_msg_${tid}" class="small mut" style="margin-top:8px"></div></div>`;
  box.innerHTML=h;
}
async function scnApply(tid,code){
  const demo=document.getElementById('scn_demo_'+tid).checked; const msg=document.getElementById('scn_msg_'+tid); if(msg)msg.textContent='Attivo…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/scenarios',{method:'POST',body:JSON.stringify({code,with_demo:demo})});
    toast('Scenario attivato ('+r.rules_added+' regole, '+r.devices_added+' device)','ok'); scnRender(tid);
  }catch(e){ toast(e.message,'bad'); if(msg)msg.textContent=e.message; }
}
async function scnDemo(tid,code){
  const msg=document.getElementById('scn_msg_'+tid); if(msg)msg.textContent='Genero telemetria demo…';
  try{ const r=await api('/superadmin/tenants/'+tid+'/scenarios/'+code+'/demo',{method:'POST'});
    toast('Telemetria demo: '+r.events+' eventi, '+r.incidents+' incidenti','ok');
    if(msg)msg.innerHTML=`<span class="s-attivo">✓ ${r.events} eventi · ${r.incidents} incidenti</span> (vedi Centrale allarmi del tenant)`;
  }catch(e){ toast(e.message,'bad'); if(msg)msg.textContent=e.message; }
}
// Rimozione in due passi senza confirm() (bloccato in alcune webview): primo click arma, secondo conferma.
async function scnRemove(tid,code){
  const msg=document.getElementById('scn_msg_'+tid);
  if(window._scnArm!==code){ window._scnArm=code; if(msg)msg.innerHTML=`<span style="color:var(--bad)">Clicca di nuovo “Rimuovi” su <b>${esc(code)}</b> per confermare.</span>`;
    setTimeout(()=>{ if(window._scnArm===code) window._scnArm=null; }, 4000); return; }
  window._scnArm=null;
  try{ const r=await api('/superadmin/tenants/'+tid+'/scenarios/'+code,{method:'DELETE'});
    toast('Scenario rimosso ('+r.rules_removed+' regole)','ok'); scnRender(tid);
  }catch(e){ toast(e.message,'bad'); if(msg)msg.textContent=e.message; }
}
async function trConfig(tid,btn){
  const box=document.getElementById('cfg_'+tid);
  if(box.dataset.open==='tr'){ box.innerHTML=''; box.dataset.open=''; btnOn(btn,false); return; }
  box.dataset.open='tr'; cfgExclusive(btn); btnOn(btn,true); box.innerHTML='<div class="small mut">carico…</div>';
  let cfg; try{ cfg=await api('/superadmin/tenants/'+tid+'/traccar/config'); }
  catch(e){ box.innerHTML='<div class="small" style="color:var(--bad)">'+e.message+'</div>'; return; }
  const field=c=> c.type==='boolean'
    ? `<label class="small" style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" data-id="${c.id}" ${c.value?'checked':''}> ${c.id}</label>`
    : `<label class="small mut" style="display:block;margin:4px 0">${c.id}<input data-id="${c.id}" data-num="${c.type==='number'}" value="${String(c.value).replace(/"/g,'&quot;')}"></label>`;
  box.innerHTML=`<div class="card" style="padding:12px">
    <div class="small mut" style="margin-bottom:8px">Impostazioni server Traccar (runtime). Porte/forwarding = config d'avvio (compose); i filtri posizione sono in Moduli → Traccar.</div>
    ${cfg.map(field).join('')}
    <button class="btn" onclick="trConfigSave('${tid}')">Salva Traccar</button></div>`;
}
async function trConfigSave(tid){
  const box=document.getElementById('cfg_'+tid); const entries=[];
  box.querySelectorAll('[data-id]').forEach(el=>{ let v=el.type==='checkbox'?(el.checked?'true':'false'):el.value; entries.push({id:el.dataset.id,value:v}); });
  try{ await api('/superadmin/tenants/'+tid+'/traccar/config',{method:'POST',body:JSON.stringify({entries})}); toast('Config Traccar salvata','ok'); }
  catch(e){ toast(e.message,'bad'); }
}
async function gaConfig(tid,btn){
  const box=document.getElementById('cfg_'+tid);
  if(box.dataset.open==='ga'){ box.innerHTML=''; box.dataset.open=''; btnOn(btn,false); return; }
  box.dataset.open='ga'; cfgExclusive(btn); btnOn(btn,true); box.innerHTML='<div class="small mut">carico…</div>';
  let cfg; try{ cfg=await api('/superadmin/tenants/'+tid+'/goalert/config'); }
  catch(e){ box.innerHTML='<div class="small" style="color:var(--bad)">'+e.message+'</div>'; return; }
  const byId={}; cfg.forEach(c=>byId[c.id]=c);
  const field=c=>{ if(!c)return'';
    if(c.type==='boolean') return `<label class="small" style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" data-id="${c.id}" ${c.value==='true'?'checked':''}> ${c.id}</label>`;
    if(c.secret) return `<label class="small mut" style="display:block;margin:4px 0">${c.id} ${c.set?'<span class="tag">impostato</span>':''}<input type="password" data-id="${c.id}" placeholder="${c.set?'•••• (lascia vuoto per non cambiare)':'non impostato'}"></label>`;
    return `<label class="small mut" style="display:block;margin:4px 0">${c.id}<input data-id="${c.id}" value="${(c.value||'').replace(/"/g,'&quot;')}"></label>`; };
  box.innerHTML=`<div class="card" style="padding:12px">
    <div class="small mut" style="margin-bottom:8px">Config trasporto GoAlert (istanza). I segreti sono write-only.</div>
    ${Object.entries(CFG_GROUPS).map(([g,ids])=>`<div style="border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px">
      <b class="small">${g}</b>${ids.map(id=>field(byId[id])).join('')}</div>`).join('')}
    <button class="btn" onclick="gaConfigSave('${tid}')">Salva trasporto</button></div>`;
}
async function gaConfigSave(tid){
  const box=document.getElementById('cfg_'+tid); const entries=[];
  box.querySelectorAll('[data-id]').forEach(el=>{
    let val; if(el.type==='checkbox') val=el.checked?'true':'false';
    else { if(el.type==='password' && !el.value) return; val=el.value; }
    entries.push({id:el.dataset.id,value:val});
  });
  try{ const r=await api('/superadmin/tenants/'+tid+'/goalert/config',{method:'POST',body:JSON.stringify({entries})});
    toast('Trasporto aggiornato ('+r.updated+' campi)','ok');
  }catch(e){ toast(e.message,'bad'); }
}
async function gaProvision(tid,btn){
  btnOn(btn,true);
  // Auto: il motore GoAlert è integrato nel prodotto -> usa le credenziali di default (nessun prompt)
  try{ const r=await api('/superadmin/tenants/'+tid+'/goalert/provision',{method:'POST',body:JSON.stringify({})});
    toast('GoAlert provisionato: service '+(r.service_id||'').slice(0,8),'ok');
  }catch(e){ toast('GoAlert: '+e.message,'bad'); } finally{ btnOn(btn,false); } }
async function toggleTool(tid,mc,tc,cb){
  try{ await api('/superadmin/tenants/'+tid+'/tools',{method:'POST',body:JSON.stringify({module_code:mc,tool_code:tc,enabled:cb.checked})});
    toast(tc+' → '+(cb.checked?'disponibile':'nascosto'),'ok');
  }catch(e){ cb.checked=!cb.checked; toast(e.message,'bad'); }
}
</script>
</body></html>
