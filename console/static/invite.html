<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attiva account · YouWorkforce</title>
<style>
  :root{ --brand:#e2001a; --ink:#1a1a1a; --line:#e5e7eb; --bg:#f7f7f8; --ok:#16a34a; --bad:#dc2626; }
  *{box-sizing:border-box} body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);
    display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;max-width:420px;width:100%;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
  h1{font-size:20px;margin:0 0 4px} .sub{color:#6b7280;font-size:13.5px;margin:0 0 20px}
  label{display:block;font-size:13px;color:#6b7280;margin:14px 0 4px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px}
  input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
  button{width:100%;margin-top:20px;padding:11px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .msg{margin-top:14px;font-size:13.5px;min-height:18px} .msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
  .who{background:#f3f4f6;border-radius:9px;padding:8px 12px;font-size:13.5px;margin-bottom:6px}
  .hint{font-size:12.5px;color:#9ca3af;margin-top:6px}
</style>
</head>
<body>
<div class="card">
  <h1>Attiva il tuo account</h1>
  <p class="sub">Imposta la password per accedere a YouWorkforce.</p>
  <div id="body"><div class="msg">Verifico l'invito…</div></div>
</div>
<script>
const qs=new URLSearchParams(location.search);
const token=qs.get('token')||'';
// slug: dal parametro, altrimenti dal sottodominio (es. acme.localhost)
const slug=(qs.get('slug')|| (location.hostname.split('.')[0]||'')).toLowerCase();
const el=id=>document.getElementById(id);
async function init(){
  if(!token){ el('body').innerHTML='<div class="msg bad">Link di invito non valido (token mancante).</div>'; return; }
  let r;
  try{ r=await (await fetch('/api/invite/check?slug='+encodeURIComponent(slug)+'&token='+encodeURIComponent(token))).json(); }
  catch(e){ r={valid:false}; }
  if(!r.valid){ el('body').innerHTML='<div class="msg bad">Invito non valido, già usato o scaduto. Chiedi al tuo referente un nuovo invito.</div>'; return; }
  el('body').innerHTML=`
    <div class="who">Account: <b>${(r.email||'').replace(/[<>&]/g,'')}</b></div>
    <label>Nuova password (min 8 caratteri)</label><input id="p1" type="password" autocomplete="new-password">
    <label>Conferma password</label><input id="p2" type="password" autocomplete="new-password">
    <button id="go">Attiva e imposta password</button>
    <div class="hint">Dopo l'attivazione potrai accedere con la tua email e questa password.</div>
    <div id="m" class="msg"></div>`;
  el('go').onclick=submit;
  el('p2').addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
}
async function submit(){
  const m=el('m'), p1=el('p1').value, p2=el('p2').value;
  m.className='msg';
  if(p1.length<8){ m.className='msg bad'; m.textContent='La password deve avere almeno 8 caratteri.'; return; }
  if(p1!==p2){ m.className='msg bad'; m.textContent='Le due password non coincidono.'; return; }
  el('go').disabled=true; m.textContent='Attivo…';
  try{
    const res=await fetch('/api/invite/accept',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({slug,token,password:p1})});
    const j=await res.json();
    if(!res.ok) throw new Error(j.error||('HTTP '+res.status));
    m.className='msg ok'; m.textContent='Account attivato! Ti porto all\'accesso…';
    setTimeout(()=>{ location.href='/app.html'; }, 1200);
  }catch(e){ el('go').disabled=false; m.className='msg bad'; m.textContent=e.message; }
}
init();
</script>
</body>
</html>
